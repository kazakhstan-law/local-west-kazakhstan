act_code: '176189'
requisite: Решение Таскалинского районного маслихата Западно-Казахстанской области от 23 декабря 2022 года № 34-2. Утратило силу решением Таскалинского районного маслихата Западно-Казахстанской области от 26 сентября 2023 года № 10-1 (вводится в действие по истечении десяти календарных дней после дня первого официального опубликования)
title:
  rus: О предоставлении 2023 году социальной поддержки специалистам в области здравоохранения, образования, социального обеспечения, культуры, спорта и агропромышленного комплекса, государственным служащим аппаратов акимов сельских округов прибывшим для работы и проживания в сельские населенные пункты Таскалинского района
  kaz: Тасқала ауданының ауылдық елді мекендеріне жұмыс істеуге және тұруға келген денсаулық сақтау, білім беру, әлеуметтік қамсыздандыру, мәдениет, спорт және агроөнеркәсіптік кешен саласындағы мамандарға, ауылдық округтер әкімдері аппаратының мемлекеттік қызметшілеріне 2023 жылы әлеуметтік қолдау көрсету туралы
