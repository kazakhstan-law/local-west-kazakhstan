requisite: Решение Таскалинского районного маслихата Западно-Казахстанской области от 19 апреля 2022 года № 21-2. Зарегистрировано в Министерстве юстиции Республики Казахстан 20 апреля 2022 года № 27677
title:
  rus: Об установлении повышенных на двадцать пять процентов должностных окладов и тарифных ставок специалистам в области социального обеспечения, культуры и спорта являющимся гражданскими служащими и работающим в сельской местности Таскалинского района
  kaz: Тасқала ауданының азаматтық қызметшілері болып табылатын және ауылдық жерде жұмыс істейтін әлеуметтік қамсыздандыру, мәдениет, спорт саласындағы мамандарға жиырма бес пайызға жоғарылатылған лауазымдық айлықақылар мен тарифтік мөлшерлемелер белгілеу туралы
