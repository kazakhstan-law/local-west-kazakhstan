requisite: Решение Таскалинского районного маслихата Западно-Казахстанской области от 18 марта 2014 года № 22-5. Зарегистрировано Департаментом юстиции Западно-Казахстанской области 8 апреля 2014 года № 3495. Утратило силу решением Таскалинского районного маслихата Западно-Казахстанской области от 26 сентября 2023 года № 10-2 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: Об утверждении Правил о порядке проведения раздельных сходов местного сообщества и определения количества представителей жителей села, улицы, многоквартирного жилого дома для участия в сходе местного сообщества на территории Таскалинского района
  kaz: Тасқала ауданының аумағында бөлек жергiлiктi қоғамдастық жиындарын өткiзу және жергiлiктi қоғамдастық жиынына қатысу үшiн ауыл, көше, көппәтерлi тұрғын үй тұрғындары өкiлдерiнiң санын айқындау тәртiбi туралы қағидасын бекiту туралы
