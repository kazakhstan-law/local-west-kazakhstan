  title:
    rus: О внесении изменений и дополнения в решение Таскалинского районного маслихата от 23 декабря 2014 года № 29-6 «Об определении порядка и размера возмещения затрат на обучение на дому детей с ограниченными возможностями из числа инвалидов по индивидуальному учебному плану в Таскалинском районе»
    kaz: Тасқала аудандық мәслихатының 2014 жылғы 23 желтоқсандағы № 29-6 «Тасқала ауданында мүгедектер қатарындағы кемтар балаларды жеке оқыту жоспары бойынша үйде оқытуға жұмсаған шығындарын өндіріп алу тәртібін және мөлшерін айқындау туралы» шешіміне өзгерістер мен толықтыру енгізу туралы
