title:
  rus: Об определении порядка и размера возмещения затрат на обучение на дому детей с ограниченными возможностями из числа детей с инвалидностью по индивидуальному учебному плану в Таскалинском районе
  kaz: Тасқала ауданында жеке оқыту жоспары бойынша мүгедектігі бар балалар қатарындағы кемтар балаларды үйде оқытуға жұмсаған шығындарды өтеу тәртібін және мөлшерін айқындау туралы
