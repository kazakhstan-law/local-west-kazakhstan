  title:
    rus: О внесении изменения в решение Таскалинского районного маслихата от 23 декабря 2014 года № 29-6 «Об определении порядка и размера возмещения затрат на обучение на дому детей с ограниченными возможностями из числа детей с инвалидностью по индивидуальному учебному плану в Таскалинском районе»
    kaz: Тасқала аудандық мәслихатының «Тасқала ауданында жеке оқыту жоспары бойынша мүгедектігі бар балалар қатарындағы кемтар балаларды үйде оқытуға жұмсаған шығындарды өтеу тәртібін және мөлшерін айқындау туралы» 2014 жылғы 23 желтоқсанындағы № 29-6 шешіміне өзгеріс енгізу туралы
