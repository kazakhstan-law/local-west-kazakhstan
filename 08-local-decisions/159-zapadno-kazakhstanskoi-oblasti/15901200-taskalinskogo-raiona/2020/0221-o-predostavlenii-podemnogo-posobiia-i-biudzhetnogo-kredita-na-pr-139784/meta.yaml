act_code: '139784'
requisite: Решение Таскалинского районного маслихата Западно-Казахстанской области от 21 февраля 2020 года № 44-3. Зарегистрировано Департаментом юстиции Западно-Казахстанской области 25 февраля 2020 года № 6053. Утратило силу решением Таскалинского районного маслихата Западно-Казахстанской области от 22 января 2021 года № 57-2 (вводится в действие по истечении десяти календарных дней после дня первого официального опубликования)
title:
  rus: О предоставлении подъемного пособия и бюджетного кредита на приобретение или строительство жилья специалистам в области здравоохранения, образования, социального обеспечения, культуры, спорта и агропромышленного комплекса, прибывшим для работы и проживания в сельские населенные пункты Таскалинского района в 2020 году
  kaz: 2020 жылы Тасқала ауданының ауылдық елді мекендеріне жұмыс істеу және тұру үшін келген денсаулық сақтау, білім беру, әлеуметтік қамсыздандыру, мәдениет, спорт және агроөнеркәсіптік кешен саласындағы мамандарға көтерме жәрдемақы және тұрғын үй сатып алу немесе салу үшін бюджеттік кредит беру туралы
