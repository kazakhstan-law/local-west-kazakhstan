act_code: '144412'
requisite: Решение Таскалинского районного маслихата Западно-Казахстанской области от 26 июня 2020 года № 48-3. Зарегистрировано Департаментом юстиции Западно-Казахстанской области 3 июля 2020 года № 6289
title:
  rus: Об установлении категории автостоянок (паркингов), увеличений размеров базовых ставок налога на земли, выделенные под автостоянки (паркинги), определении близлежащего населенного пункта, базовые ставки на земли которого будут применяться при начислении налога по Таскалинскому району
  kaz: Тасқала ауданы бойынша автотұрақтардың (паркингтердің) санаттарын белгілеу, автотұрақтар (паркингтер) үшін бөлінген жерлерге базалық салық мөлшерлемелерінің мөлшерін ұлғайту, салықты есептеу кезінде жеріне базалық мөлшерлемелер қолданылатын жақын орналасқан елді мекенді айқындау туралы
