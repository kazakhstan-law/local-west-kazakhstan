  title:
    rus: О внесении изменений в решение Таскалинского районного маслихата от 25 декабря 2020 года № 56-10 «Об утверждении Правил оказания социальной помощи, установления размеров и определения перечня отдельных категорий нуждающихся граждан Таскалинского района»
    kaz: Тасқала аудандық мәслихатының 2020 жылғы 25 желтоқсандағы № 56-10 «Тасқала ауданының әлеуметтік көмек көрсету, оның мөлшерлерін белгілеу және мұқтаж азаматтардың жекелеген санаттарының тізбесін айқындау қағидаларын бекіту туралы» шешіміне өзгерістер енгізу туралы
