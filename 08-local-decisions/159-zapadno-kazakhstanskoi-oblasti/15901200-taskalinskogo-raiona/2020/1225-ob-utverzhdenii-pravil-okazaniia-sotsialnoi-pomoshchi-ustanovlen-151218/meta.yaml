requisite: Решение Таскалинского районного маслихата Западно-Казахстанской области от 25 декабря 2020 года № 56-10. Зарегистрировано Департаментом юстиции Западно-Казахстанской области 31 декабря 2020 года № 6756. Утратило силу решением Таскалинского районного маслихата Западно-Казахстанской области от 6 сентября 2023 года № 8-3 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
