requisite: Решение Таскалинского районного маслихата Западно-Казахстанской области от 8 октября 2020 года № 52-2. Зарегистрировано Департаментом юстиции Западно-Казахстанской области 9 октября 2020 года № 6415
title:
  rus: Об определении специализированных мест для организации и проведения мирных собраний, порядка их использования, норм предельной заполняемости, требований к материально-техническому и организационному обеспечению, границ прилегающих территорий, в которых запрещено проведение пикетирования по Таскалинскому району
  kaz: Тасқала ауданында бейбіт жиналыстарды ұйымдастыру және өткізу үшін арнайы орындарды, оларды пайдалану тәртібін, шекті толтырылу нормаларын, олардың материалдық-техникалық және ұйымдастырушылық қамтамасыз етуге қойылатын талаптарын, пикеттеуді өткізуге тыйым салынған іргелес аумақтардың шекараларын айқындау туралы
