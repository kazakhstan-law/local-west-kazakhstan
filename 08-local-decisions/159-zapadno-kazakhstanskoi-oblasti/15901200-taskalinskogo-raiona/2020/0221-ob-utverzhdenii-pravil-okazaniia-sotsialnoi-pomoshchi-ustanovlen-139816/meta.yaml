  title:
    rus: О внесении изменения в решение Таскалинского районного маслихата от 21 февраля 2020 года №44-7 «Об утверждении Правил оказания социальной помощи, установления размеров и определения перечня отдельных категорий нуждающихся граждан Таскалинского района»
    kaz: Тасқала аудандық мәслихатының 2020 жылғы 21 ақпандағы №44-7 «Тасқала ауданының әлеуметтік көмек көрсету, оның мөлшерлерін белгілеу және мұқтаж азаматтардың жекелеген санаттарының тізбесін айқындау қағидаларын бекіту туралы» шешіміне өзгеріс енгізу туралы
