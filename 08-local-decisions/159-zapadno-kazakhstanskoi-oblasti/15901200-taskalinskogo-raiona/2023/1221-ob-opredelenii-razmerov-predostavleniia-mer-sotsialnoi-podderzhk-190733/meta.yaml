act_code: '190733'
requisite: Решение Таскалинского районного маслихата Западно-Казахстанской области от 21 декабря 2023 года № 15-3
title:
  rus: Об определении размеров предоставления мер социальной поддержки специалистам в области здравоохранения, образования, социального обеспечения, культуры, спорта и агропромышленного комплекса, государственным служащим аппаратов акимов сельских округов прибывшим для работы и проживания в сельские населенные пункты Таскалинского района на 2024 год
  kaz: 2024 жылға арналған Тасқала ауданының ауылдық елді мекендеріне жұмыс істеу және тұру үшін келген денсаулық сақтау, білім беру, әлеуметтік қамсыздандыру, мәдениет, спорт және агроөнеркәсіптік кешен саласындағы мамандарға, ауылдық округ әкімдері аппараттарының мемлекеттік қызметшілеріне әлеуметтік қолдау шараларын ұсыну мөлшерін айқындау туралы
