  title:
    rus: О внесении изменения в решение Таскалинского районного маслихата от 31 октября 2023 года 12-1 «Об утверждении Правил оказания социальной помощи, установления ее размеров и определения перечня отдельных категорий нуждающихся граждан Таскалинского района»
    kaz: Тасқала аудандық мәслихатының «Тасқала ауданының әлеуметтік көмек көрсетудің, оның мөлшерлерін белгілеудің және мұқтаж азаматтардың жекелеген санаттарының тізбесін айқындаудың қағидаларын бекіту туралы» 2023 жылғы 31 қазандағы № 12-1 шешіміне өзгеріс енгізу туралы
