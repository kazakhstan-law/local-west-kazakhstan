title:
  rus: Об утверждении Правил проведения раздельных сходов местного сообщества и определения количества представителей жителей села, микрорайона, улицы, многоквартирного жилого дома для участия в сходе местного сообщества на территории Таскалинского района
  kaz: Тасқала ауданының аумағында бөлек жергілікті қоғамдастық жиындарын өткізу қағидаларын бекіту және жергілікті қоғамдастық жиынына қатысу үшін ауыл, шағын аудан, көше, көппәтерлі тұрғын үй тұрғындары өкілдерінің санын айқындау туралы
