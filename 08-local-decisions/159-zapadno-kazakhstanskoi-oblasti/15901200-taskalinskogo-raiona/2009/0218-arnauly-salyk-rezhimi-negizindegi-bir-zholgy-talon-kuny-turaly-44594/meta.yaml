act_code: '44594'
requisite: Батыс Қазақстан облысы Тасқала аудандық мәслихатының 2009 жылғы 18 ақпандағы № 12-2 шешімі. Батыс Қазақстан облысы Тасқала ауданы әділет басқармасында 2009 жылғы 3 наурызда № 7-11-88 тіркелді. Күші жойылды - Батыс Қазақстан облысы Тасқала аудандық мәслихаттың 2013 жылғы 13 мамырдағы № 10-3 шешімімен
