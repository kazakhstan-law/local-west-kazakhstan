requisite: Батыс Қазақстан облысы Тасқала ауданы әкімінің 2009 жылғы 10 ақпандағы № 2 шешімі. Батыс Қазақстан облысы Тасқала ауданы әділет басқармасында 2009 жылғы 24 ақпанда № 7-11-85 тіркелді. Күші жойылды - Батыс Қазақстан облысы Тасқала ауданы әкімінің 2009 жылғы 7 сәуірдегі № 5 шешімімен
