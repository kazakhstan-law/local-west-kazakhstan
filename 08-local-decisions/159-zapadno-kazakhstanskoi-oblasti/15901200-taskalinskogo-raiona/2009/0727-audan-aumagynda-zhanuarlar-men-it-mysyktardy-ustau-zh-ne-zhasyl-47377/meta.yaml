act_code: '47377'
requisite: Батыс Қазақстан облысы Тасқала аудандық мәслихаттың 2009 жылғы 27 шілдедегі № 16-3 шешімі. Батыс Қазақстан облысы Тасқала ауданы әділет басқармасында 2009 жылғы 17 тамызда № 7-11-98 тіркелді. Күші жойылды - Батыс Қазақстан облысы Тасқала аудандық мәслихатының 2012 жылғы 18 мамырдағы № 4-7 шешімімен
title:
