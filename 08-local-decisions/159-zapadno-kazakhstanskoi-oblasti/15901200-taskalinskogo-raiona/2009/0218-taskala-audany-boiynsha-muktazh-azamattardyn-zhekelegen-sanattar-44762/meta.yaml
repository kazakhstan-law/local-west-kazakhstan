requisite: Батыс Қазақстан облысы Тасқала аудандық мәслихатының 2009 жылғы 18 ақпандағы № 12-4 шешімі. Батыс Қазақстан облысы Тасқала ауданы әділет басқармасында 2009 жылғы 10 наурызда № 7-11-90 тіркелді. Күші жойылды - Батыс Қазақстан облысы Тасқала аудандық мәслихатының 2011 жылғы 30 наурыздағы № 32-2 шешімімен
