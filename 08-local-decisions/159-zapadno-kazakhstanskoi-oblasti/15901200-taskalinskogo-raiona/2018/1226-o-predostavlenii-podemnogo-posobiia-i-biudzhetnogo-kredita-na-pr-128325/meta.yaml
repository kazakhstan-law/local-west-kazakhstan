  requisite: Решение Таскалинского районного маслихата Западно-Казахстанской области от 8 октября 2019 года № 39-4. Зарегистрировано Департаментом юстиции Западно-Казахстанской области 9 октября 2019 года № 5816. Утратило силу решением Таскалинского районного маслихата Западно-Казахстанской области от 21 февраля 2020 года № 44-3 (вводится в действие по истечении десяти календарных дней после дня первого официального опубликования)
  title:
    rus: О внесении изменения в решение Таскалинского районного маслихата №31-2 от 26 декабря 2018 года «О предоставлении подъемного пособия и бюджетного кредита на приобретение или строительство жилья специалистам в области здравоохранения, образования, социального обеспечения, культуры, спорта и агропромышленного комплекса, прибывшим для работы и проживания в сельские населенные пункты Таскалинского района в 2019 году»
    kaz: Тасқала аудандық мәслихатының 2018 жылғы 26 желтоқсандағы № 31-2 «2019 жылы Тасқала ауданының ауылдық елді мекендеріне жұмыс істеу және тұру үшін келген денсаулық сақтау, білім беру, әлеуметтік қамсыздандыру, мәдениет, спорт және агроөнеркәсіптік кешен саласындағы мамандарға көтерме жәрдемақы және тұрғын үй сатып алу немесе салу үшін бюджеттік кредит беру туралы» шешіміне өзгеріс енгізу туралы
  link: https://zan.gov.kz/client/#!/doc/135181/rus
