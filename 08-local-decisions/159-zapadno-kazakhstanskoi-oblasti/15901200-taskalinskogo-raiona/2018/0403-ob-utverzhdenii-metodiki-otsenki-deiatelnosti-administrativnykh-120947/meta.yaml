requisite: Решение Таскалинского районного маслихата Западно-Казахстанской области от 3 апреля 2018 года № 22-7. Зарегистрировано Департаментом юстиции Западно-Казахстанской области 18 апреля 2018 года № 5169. Утратило силу решением Таскалинского районного маслихата Западно-Казахстанской области от 19 июня 2024 года № 24-2 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: Об утверждении методики оценки деятельности административных государственных служащих корпуса «Б» государственного учреждения «Аппарат Таскалинского районного маслихата»
