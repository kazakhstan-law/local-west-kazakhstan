  title:
    rus: О внесении изменений в решение Таскалинского районного маслихата Западно-Казахстанской области от 3 апреля 2018 года № 22-7 «Об утверждении методики оценки деятельности административных государственных служащих корпуса «Б» государственного учреждения «Аппарат Таскалинского районного маслихата»
    kaz: Батыс Қазақстан облысы Тасқала аудандық мәслихатының 2018 жылғы 3 сәуірдегі № 22-7 «Тасқала аудандық мәслихатының аппараты» мемлекеттік мекемесінің «Б» корпусы мемлекеттік әкімшілік қызметшілерінің қызметін бағалау әдістемесін бекіту туралы» шешіміне өзгерістер енгізу туралы
