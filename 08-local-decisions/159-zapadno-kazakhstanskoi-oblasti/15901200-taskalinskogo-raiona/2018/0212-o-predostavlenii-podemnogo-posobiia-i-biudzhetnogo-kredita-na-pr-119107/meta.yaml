act_code: '119107'
requisite: Решение Таскалинского районного маслихата Западно-Казахстанской области от 12 февраля 2018 года № 21-1. Зарегистрировано Департаментом юстиции Западно-Казахстанской области 27 февраля 2018 года № 5067. Утратило силу решением Таскалинского районного маслихата Западно-Казахстанской области от 26 декабря 2018 года № 31-2
title:
  rus: О предоставлении подъемного пособия и бюджетного кредита на приобретение или строительство жилья специалистам в области здравоохранения, образования, социального обеспечения, культуры, спорта и агропромышленного комплекса, прибывшим для работы и проживания в сельские населенные пункты Таскалинского района в 2018 году
  kaz: 2018 жылы Тасқала ауданының ауылдық елді мекендеріне жұмыс істеу және тұру үшін келген денсаулық сақтау, білім беру, әлеуметтік қамсыздандыру, мәдениет, спорт және агроөнеркәсіптік кешен саласындағы мамандарға көтерме жәрдемақы және тұрғын үй сатып алу немесе салу үшін бюджеттік кредит беру туралы
