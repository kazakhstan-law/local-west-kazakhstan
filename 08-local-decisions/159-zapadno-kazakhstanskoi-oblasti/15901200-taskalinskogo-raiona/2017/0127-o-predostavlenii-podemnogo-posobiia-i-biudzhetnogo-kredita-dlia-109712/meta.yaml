requisite: Решение Таскалинского районного маслихата Западно-Казахстанской области от 27 января 2017 года № 10-1. Зарегистрировано Департаментом юстиции Западно-Казахстанской области 10 февраля 2017 года № 4683. Утратило силу решением Таскалинского районного маслихата Западно-Казахстанской области от 12 февраля 2018 года № 21-1
title:
  rus: О предоставлении подъемного пособия и бюджетного кредита для приобретения или строительства жилья специалистам в области здравоохранения, образования, социального обеспечения, культуры, спорта и агропромышленного комплекса, прибывшим для работы и проживания в сельские населенные пункты Таскалинского района в 2017 году
  kaz: 2017 жылы Тасқала ауданының ауылдық елді мекендеріне жұмыс істеу және тұру үшін келген денсаулық сақтау, білім беру, әлеуметтік қамсыздандыру, мәдениет, спорт және агроөнеркәсіптік кешен саласындағы мамандарға көтерме жәрдемақы және тұрғын үй сатып алу немесе салу үшін бюджеттік кредит беру туралы
