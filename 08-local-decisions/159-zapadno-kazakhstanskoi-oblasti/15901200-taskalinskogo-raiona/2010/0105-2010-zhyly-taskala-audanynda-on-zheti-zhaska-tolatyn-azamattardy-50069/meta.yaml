act_code: '50069'
requisite: Батыс Қазақстан облысы Тасқала ауданы әкімінің 2010 жылғы 5 қаңтардағы № 1 шешімі. Батыс Қазақстан облысы Тасқала ауданыа ауданы әділет басқармасында 2010 жылғы 19 қаңтарда № 7-11-112 тіркелді. Күші жойылды - Батыс Қазақстан облысы Тасқала ауданы әкімінің 2010 жылғы 15 сәуірдегі № 4 шешімімен
