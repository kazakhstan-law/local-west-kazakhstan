  title:
    rus: О внесении изменений в решение акима Казахстанского аульного округа Таскалинского района от 30 апреля 2013 года № 4 "Об установлении ветеринарного режима карантинной зоны с введением ограничительных мероприятий на территории населенных пунктов Атамекен, Молочная, Калмак шабын, Аяк, Кисык сай Казахстанского аульного округа Таскалинского района"
    kaz: Тасқала ауданы Қазақстан ауылдық округі әкімінің 2013 жылғы 30 сәуірдегі № 4 "Тасқала ауданының Қазақстан ауылдық округінің Атамекен, Молочная, Қалмақ шабын, Аяқ, Қисық сай елді мекендерде аумақтарына шектеу іс-шараларын енгізе отырып карантин аймағының ветеринарлық режимін белгілеу туралы" шешіміне өзгерістер енгізу туралы
