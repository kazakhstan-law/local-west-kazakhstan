requisite: Решение акима Казахстанского аульного округа Таскалинского района Западно-Казахстанской области от 30 апреля 2013 года № 4. Зарегистрировано Департаментом юстиции Западно-Казахстанской области 17 мая 2013 года № 3292. Утратило силу решением акима Казахстанского сельского округа Таскалинского района Западно-Казахстанской области от 25 декабря 2015 года № 7
