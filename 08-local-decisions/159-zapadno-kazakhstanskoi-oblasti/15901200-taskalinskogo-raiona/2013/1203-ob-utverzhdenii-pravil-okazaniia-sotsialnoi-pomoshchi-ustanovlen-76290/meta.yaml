  title:
    rus: О внесении изменений и дополнений в решение Таскалинского районного маслихата от 3 декабря 2013 года №18-1 «Об утверждении Правил оказания социальной помощи, установления размеров и определения перечня отдельных категорий нуждающихся граждан Таскалинского района»
    kaz: Тасқала аудандық мәслихатының 2013 жылғы 3 желтоқсандағы №18-1 «Тасқала ауданының әлеуметтік көмек көрсету, оның мөлшерлерін белгілеу және мұқтаж азаматтардың жекелеген санаттарының тізбесін айқындау қағидасын бекіту туралы» шешіміне өзгерістер мен толықтырулар енгізу туралы
