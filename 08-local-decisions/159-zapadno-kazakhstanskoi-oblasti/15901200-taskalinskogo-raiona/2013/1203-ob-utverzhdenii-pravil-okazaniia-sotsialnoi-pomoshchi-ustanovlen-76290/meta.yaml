    kaz: Тасқала аудандық мәслихатының 2013 жылғы 3 желтоқсандағы № 18-1 «Тасқала ауданының әлеуметтік көмек көрсету, оның мөлшерлерін белгілеу және мұқтаж азаматтардың жекелеген санаттарының тізбесін айқындау қағидасын бекіту туралы» шешіміне толықтыру енгізу туралы
