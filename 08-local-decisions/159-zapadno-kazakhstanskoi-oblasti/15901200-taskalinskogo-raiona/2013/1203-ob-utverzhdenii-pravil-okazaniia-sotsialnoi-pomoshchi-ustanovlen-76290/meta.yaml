requisite: Решение Таскалинского районного маслихата Западно-Казахстанской области от 3 декабря 2013 года № 18-1. Зарегистрировано Департаментом юстиции Западно-Казахстанской области 27 декабря 2013 года № 3386. Утратило силу решением Таскалинского районного маслихата Западно-Казахстанской области от 21 февраля 2020 года № 44-7 (вводится в действие по истечении десяти календарных дней со дня первого официального опубликования)
title:
