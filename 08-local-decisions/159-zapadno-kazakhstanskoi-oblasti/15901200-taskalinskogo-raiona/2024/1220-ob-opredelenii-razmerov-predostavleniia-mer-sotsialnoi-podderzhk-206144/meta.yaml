act_code: '206144'
requisite: Решение Таскалинского районного маслихата Западно-Казахстанской области от 20 декабря 2024 года № 29-5. Отменен решением Таскалинского районного маслихата Западно-Казахстанской области от 14 мая 2025 года № 33-4 (вводится в действие по истечении десяти календарных дней после дня первого официального опубликования)
title:
  rus: Об определении размеров предоставления мер социальной поддержки специалистам в области здравоохранения, образования, социального обеспечения, культуры, спорта и агропромышленного комплекса, государственным служащим аппаратов акимов сельских округов прибывшим для работы и проживания в сельские населенные пункты Таскалинского района на 2025 год
  kaz: 2025 жылға арналған Тасқала ауданының ауылдық елді мекендеріне жұмыс істеу және тұру үшін келген денсаулық сақтау, білім беру, әлеуметтік қамсыздандыру, мәдениет, спорт және агроөнеркәсіптік кешен саласындағы мамандарға, ауылдық округ әкімдері аппараттарының мемлекеттік қызметшілеріне әлеуметтік қолдау шараларын ұсыну мөлшерін айқындау туралы
