  title:
    rus: О внесении изменения в решение Таскалинского районного маслихата от 26 августа 2024 года № 26-4 «Об установлении за счет средств местного бюджета стимулирующих надбавок к должностным окладам работников организаций, финансируемых из местного бюджета»
    kaz: Тасқала аудандық мәслихатының «Жергілікті бюджеттен қаржыландырылатын ұйымдар жұмыскерлерінің лауазымдық айлықақыларына жергілікті бюджет қаражаты есебінен ынталандыру үстемеақыларын белгілеу туралы» 2024 жылғы 26 тамыздағы № 26-4 шешіміне өзгеріс енгізу туралы
