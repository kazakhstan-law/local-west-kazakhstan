act_code: '39564'
requisite: Батыс Қазақстан облысы Тасқала аудандық мәслихатының 2008 жылғы 28 сәуірдегі № 6-3 шешімі. Батыс Қазақстан облысы Тасқала ауданы әділет басқармасында 2008 жылғы 12 мамырда № 7-11-66 тіркелді. Күші жойылды - Батыс Қазақстан облысы Тасқала аудандық мәслихатының 2010 жылғы 15 сәуірдегі № 23-3 шешімімен
