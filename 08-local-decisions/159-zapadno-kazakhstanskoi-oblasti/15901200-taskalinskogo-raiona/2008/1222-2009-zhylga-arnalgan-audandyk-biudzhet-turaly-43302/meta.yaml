act_code: '43302'
requisite: Батыс Қазақстан облысы Тасқала аудандық мәслихатының 2008 жылғы 22 желтоқсандағы № 11-3 шешімі. Батыс Қазақстан облысы Тасқала ауданы әділет басқармасында 2009 жылғы 8 қаңтарда № 7-11-79 тіркелді. Күші жойылды - Батыс Қазақстан облысы Тасқала аудандық мәслихатының 2010 жылғы 15 сәуірдегі № 23-6 шешімімен
