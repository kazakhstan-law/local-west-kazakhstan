act_code: '152424'
requisite: Решение Таскалинского районного маслихата Западно-Казахстанской области от 22 января 2021 года № 57-2. Зарегистрировано Департаментом юстиции Западно-Казахстанской области 25 января 2021 года № 6812
title:
  rus: О предоставлении подъемного пособия и бюджетного кредита на приобретение или строительство жилья специалистам в области здравоохранения, образования, социального обеспечения, культуры, спорта и агропромышленного комплекса, государственным служащим аппаратов акимов сел, сельских округов, прибывшим для работы и проживания в сельские населенные пункты Таскалинского района в 2021 году
  kaz: 2021 жылы Тасқала ауданының ауылдық елді мекендеріне жұмыс істеу және тұру үшін келген, денсаулық сақтау, білім беру, әлеуметтік қамсыздандыру, мәдениет, спорт және агроөнеркәсіптік кешен саласындағы мамандарға, ауылдар, ауылдық округтер әкімдері аппараттарының мемлекеттік қызметшілеріне тұрғын үй сатып алуға немесе салуға көтерме жәрдемақы және бюджеттік кредит беру туралы
