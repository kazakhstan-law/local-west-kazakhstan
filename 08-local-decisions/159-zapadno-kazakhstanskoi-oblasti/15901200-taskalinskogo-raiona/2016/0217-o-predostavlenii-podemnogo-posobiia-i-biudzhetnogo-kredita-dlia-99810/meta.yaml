requisite: Решение Таскалинского районного маслихата Западно-Казахстанской области от 17 февраля 2016 года № 38-3. Зарегистрировано Департаментом юстиции Западно-Казахстанской области 3 марта 2016 года № 4288. Утратило силу решением Таскалинского районного маслихата Западно-Казахстанской области от 27 января 2017 года № 10-1
title:
  rus: О предоставлении подъемного пособия и бюджетного кредита для приобретения или строительства жилья специалистам в области здравоохранения, образования, социального обеспечения, культуры, спорта и агропромышленного комплекса, прибывшим для работы и проживания в сельские населенные пункты Таскалинского района в 2016 году
  kaz: 2016 жылы Тасқала ауданының ауылдық елді мекендеріне жұмыс істеу және тұру үшін келген денсаулық сақтау, білім беру, әлеуметтік қамсыздандыру, мәдениет, спорт және агроөнеркәсіптік кешен саласындағы мамандарға көтерме жәрдемақы және тұрғын үй сатып алу немесе салу үшін бюджеттік кредит беру туралы
