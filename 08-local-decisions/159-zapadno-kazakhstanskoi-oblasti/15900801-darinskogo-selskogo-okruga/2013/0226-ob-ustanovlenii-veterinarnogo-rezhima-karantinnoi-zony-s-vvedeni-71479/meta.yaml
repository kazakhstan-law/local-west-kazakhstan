requisite: Решение акима Рубежинского аульного округа Зеленовского района Западно-Казахстанской области от 26 февраля 2013 года № 5. Зарегистрировано Департаментом юстиции Западно-Казахстанской области 11 марта 2013 года № 3201. Утратило силу решением акима Рубежинского аульного округа Зеленовского района Западно-Казахстанской области от 3 декабря 2013 года № 21
title:
  rus: Об установлении ветеринарного режима карантинной зоны с введением ограничительных мероприятий на территорию зимовки Чулпан Рубежинского аульного (сельского) округа Зеленовского района Западно-Казахстанской области
  kaz: Батыс Қазақстан облысы Зеленов ауданы Рубежин ауылдық (селолық) округінің Чулпан қыстағы аумағына шектеу іс-шараларын енгізе отырып карантин аймағының ветеринариялық режимін белгілеу туралы
