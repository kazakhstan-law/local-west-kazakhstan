title:
  rus: О признании утратившим силу решения Казталовского районного маслихата от 3 июня 2020 года № 49-2 «О повышении базовых ставок земельного налога на не используемые земли сельскохозяйственного назначения»
  kaz: Казталов аудандық мәслихатының 2020 жылғы 3 маусымдағы № 49-2 «Пайдаланылмайтын ауыл шаруашылығы мақсатындағы жерлерге жер салығының базалық мөлшерлемелерін арттыру туралы» шешімінің күші жойылады деп тану туралы
