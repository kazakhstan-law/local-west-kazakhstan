  title:
    rus: О внесении изменения в решение маслихата Казталовского района Западно-Казахстанской области от 24 декабря 2020 года №58-17 «Об утверждении Правил оказания социальной помощи, установления размеров и определения перечня отдельных категорий нуждающихся граждан Казталовского района»
    kaz: Батыс Қазақстан облысы Казталов аудандық мәслихатының 2020 жылғы 24 желтоқсандағы №58-17 «Казталов ауданының әлеуметтік көмек көрсету, оның мөлшерлерін белгілеу және мұқтаж азаматтардың жекеленген санаттарының тізбесін айқындау қағидаларын бекіту туралы» шешіміне өзгеріс енгізу туралы
