requisite: Решение Казталовского районного маслихата Западно-Казахстанской области от 24 декабря 2020 года № 58-17. Зарегистрировано Департаментом юстиции Западно-Казахстанской области 8 января 2021 года № 6768. Утратило силу решением Казталовского районного маслихата Западно-Казахстанской области от 2 ноября 2023 года № 9-3 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: Об утверждении Правил оказания социальной помощи, установления размеров и определения перечня отдельных категорий нуждающихся граждан Казталовского района
  kaz: Казталов ауданының әлеуметтік көмек көрсету, оның мөлшерлерін белгілеу және мұқтаж азаматтардың жекелеген санаттарының тізбесін айқындау қағидаларын бекіту туралы
