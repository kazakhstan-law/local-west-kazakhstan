act_code: '146657'
requisite: Решение Казталовского районного маслихата Западно-Казахстанской области от 18 сентября 2020 года № 52-2. Зарегистрировано Департаментом юстиции Западно-Казахстанской области 24 сентября 2020 года № 6382
title:
  rus: Об определении специализированных мест для организации и проведения мирных собраний, порядка их использования, норм их предельной заполняемости, требований к материально-техническому и организационному обеспечению, границ прилегающих территорий, в которых запрещено проведение пикетирования по Казталовскому району
  kaz: Казталов ауданында бейбіт жиналыстарды ұйымдастыру және өткізу үшін арнайы орындарды, оларды пайдалану тәртібін, шекті толтырылу нормаларын, олардың материалдық-техникалық және ұйымдастырушылық қамтамасыз етуге қойылатын талаптарын, пикеттеуді өткізуге тыйым салынған іргелес аумақтардың шекараларын айқындау туралы
