act_code: '180301'
requisite: Решение Казталовского районного маслихата Западно-Казахстанской области от 24 апреля 2023 года № 2-5. Утратило силу решением Казталовского районного маслихата Западно-Казахстанской области от 10 ноября 2023 года № 10-17 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: О предоставлении в 2023 году мер социальной поддержки в виде подъемного пособия и бюджетного кредита на приобретение или строительство жилья специалистам в области здравоохранения, образования, социального обеспечения, культуры, спорта и агропромышленного комплекса, государственным служащим аппаратов акимов сел, поселков, сельских округов, прибывшим для работы и проживания в сельские населенные пункты Казталовского района
  kaz: Казталов ауданының ауылдық елді мекендеріне жұмыс істеу және тұру үшін келген денсаулық сақтау, білім беру, әлеуметтік қамсыздандыру, мәдениет, спорт және агроөнеркәсіптік кешен саласындағы мамандарға, ауылдар, ауылдық округтер әкімдері аппараттарының мемлекеттік қызметшілеріне 2023 жылы тұрғын үй сатып алуға немесе салуға бюджеттік несие беру және бір жолғы көтерме жәрдемақы беру туралы
