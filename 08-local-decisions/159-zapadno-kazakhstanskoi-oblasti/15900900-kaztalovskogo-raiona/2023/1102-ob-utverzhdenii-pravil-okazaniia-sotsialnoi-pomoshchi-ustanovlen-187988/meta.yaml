    kaz: Казталов аудандық мәслихатының 2023 жылғы 2 қарашадағы № 9-7 «Казталов ауданының әлеуметтік көмек көрсетудің, оның мөлшерлерін белгілеудің және мұқтаж азаматтардың жекелеген санаттарының тізбесін айқындаудың қағидаларын бекіту туралы» шешіміне өзгеріс енгізу туралы
