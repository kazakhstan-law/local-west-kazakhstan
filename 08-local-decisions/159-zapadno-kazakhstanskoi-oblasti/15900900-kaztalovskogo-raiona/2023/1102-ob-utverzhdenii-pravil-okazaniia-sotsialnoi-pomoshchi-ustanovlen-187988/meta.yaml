    kaz: Казталов аудандық мәслихатының «Казталов ауданының әлеуметтік көмек көрсетудің, оның мөлшерлерін белгілеудің және мұқтаж азаматтардың жекелеген санаттарының тізбесін айқындаудың қағидаларын бекіту туралы» 2023 жылғы 2 қарашадағы № 9-7 шешіміне өзгеріс енгізу туралы
