  title:
    rus: О внесении изменения в решение маслихата Казталовского района от 17 января 2023 года №28-2 «Об утверждении минимального размера расходов на управление объектом кондоминиума и содержание общего имущества объекта кондоминиума на 2023 год по Казталовскому району»
    kaz: Казталов аудандық мәслихатының 2023 жылғы 17 қаңтардағы №28-2 «2023 жылға арналған Казталов ауданы бойынша кондоминиум объектісін басқаруға және кондоминиум объектісінің ортақ мүлкін күтіп-ұстауға арналған шығыстардың ең төмен мөлшерін бекіту туралы» шешіміне өзгеріс енгізу туралы
