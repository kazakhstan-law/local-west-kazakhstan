act_code: '100127'
requisite: Решение Казталовского районного маслихата Западно-Казахстанской области от 16 февраля 2016 года № 41-2. Зарегистрировано Департаментом юстиции Западно-Казахстанской области 9 марта 2016 года № 4290. Утратило силу решением Казталовского районного маслихата Западно-Казахстанской области от 7 марта 2017 года № 9-5
title:
  rus: О предоставлении мер социальной поддержки специалистам в области здравоохранения, образования, социального обеспечения, культуры, спорта и агропромышленного комплекса, прибывшим для работы и проживания в сельские населенные пункты Казталовского района в 2016 году
  kaz: 2016 жылы Казталов ауданының ауылдық елді мекендеріне жұмыс істеу және тұру үшін келген денсаулық сақтау, білім беру, әлеуметтік қамсыздандыру, мәдениет, спорт және агроөнеркәсіптік кешен саласындағы мамандарға әлеуметтік қолдау шараларын беру туралы
