requisite: Батыс Қазақстан облысы Казталов аудандық мәслихаттың 2004 жылғы 2 маусымдағы № 2 шешімі. Батыс Қазақстан облыстық Әділет департаментінде 2004 жылғы 25 маусымда № 2701 тіркелген. Күші жойылды - Батыс Қазақстан облысы Казталов аудандық мәслихаттың 2010 жылғы 28 мамырдағы № 28-3 шешімімен
