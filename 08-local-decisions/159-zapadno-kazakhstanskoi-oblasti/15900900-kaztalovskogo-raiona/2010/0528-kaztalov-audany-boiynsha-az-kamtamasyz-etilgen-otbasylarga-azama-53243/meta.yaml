act_code: '53243'
requisite: Батыс Қазақстан облысы Казталов аудандық мәслихатының 2010 жылғы 28 мамырдағы № 28-3 шешімі. Батыс Қазақстан облысы Казталов ауданы әділет басқармасында 2010 жылғы 21 маусымда № 7-8-113 тіркелді. Күші жойылды - Батыс Қазақстан облысы Казталов аудандық мәслихатының 2012 жылғы 15 мамырдағы № 6-9 шешімімен
