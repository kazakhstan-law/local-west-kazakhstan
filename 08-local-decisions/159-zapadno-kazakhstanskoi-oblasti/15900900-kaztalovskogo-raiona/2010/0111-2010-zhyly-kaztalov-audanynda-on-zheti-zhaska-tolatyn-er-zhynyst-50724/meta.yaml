act_code: '50724'
requisite: Батыс Қазақстан облысы Казталов ауданы әкімінің 2010 жылғы 11 қаңтардағы № 1 шешімі. Батыс Қазақстан облысы Казталов ауданы әділет басқармасында 2010 жылғы 17 ақпанда № 7-8-99 тіркелді. Күші жойылды - Батыс Қазақстан облысы Казталов ауданы әкімінің 2010 жылғы 15 сәуірдегі № 15 шешімімен
title:
