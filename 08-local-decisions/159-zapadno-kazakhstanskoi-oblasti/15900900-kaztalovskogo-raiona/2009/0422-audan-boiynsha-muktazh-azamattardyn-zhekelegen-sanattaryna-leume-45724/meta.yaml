requisite: Батыс Қазақстан облысы Казталов аудандық мәслихатының 2009 жылғы 22 сәуірдегі № 16-3 шешімі. Батыс Қазақстан облысы Казталов ауданы әділет басқармасында 2009 жылғы 30 сәуірде № 7-8-87 тіркелген. Күші жойылды - Батыс Қазақстан облысы Казталов аудандық мәслихатының 2012 жылғы 30 шілдедегі № 7-2 шешімімен
