act_code: '49727'
requisite: Батыс Қазақстан облысы Казталов аудандық мәслихаттың 2009 жылғы 25 желтоқсандағы № 24-2 шешімі. Батыс Қазақстан облысы Казталов ауданы әділет басқармасында 2010 жылғы 6 қаңтарда № 7-8-98 тіркелді. Күші жойылды - Батыс Қазақстан облысы Казталов аудандық мәслихаттың 2011 жылғы 30 маусымдағы № 40-7 шешімімен
