requisite: Батыс Қазақстан облысы Казталов аудандық мәслихаттың 2009 жылғы 4 наурыздағы № 15-7 шешімі. Батыс Қазақстан облысы Казталов ауданы әділет басқармасында 2009 жылғы 27 наурызда № 7-8-86 тіркелді. Күші жойылды - Батыс Қазақстан облысы Қазталов аудандық мәслихаттың 2013 жылғы 5 ақпандағы № 10-9 шешімімен
