requisite: Решение Казталовского районного маслихата Западно-Казахстанской области от 11 июня 2019 года № 35-2. Зарегистрировано Департаментом юстиции Западно-Казахстанской области 13 июня 2019 года № 5720. Утратило силу решением Казталовского районного маслихата Западно-Казахстанской области от 13 февраля 2020 года № 44-9 (вводится в действие со дня первого официального опубликования)
title:
  rus: Об утверждении Правил возмещения расходов на служебные командировки, в том числе в иностранные государства сотрудников аппарата маслихата и депутатов Казталовского района
  kaz: Казталов аудандық мәслихат аппараты қызметкерлері және депутаттарының қызметтік, оның ішінде шет мемлекеттерге іссапарларға арналған шығыстарын өтеудің қағидаларын бекіту туралы
