requisite: Решение Казталовского районного маслихата Западно-Казахстанской области от 12 марта 2014 года № 21-2. Зарегистрировано Департаментом юстиции Западно-Казахстанской области 2 апреля 2014 года № 3465. Утратило силу решением Казталовского районного маслихата Западно-Казахстанской области от 5 ноября 2014 года № 29-2
title:
  rus: О предоставлении подъемного пособия и социальной поддержки для приобретения или строительства жилья специалистам в области здравоохранения, образования, социального обеспечения, культуры, спорта и агропромышленного комплекса, прибывшим для работы и проживания в сельские населенные пункты Казталовского района на 2014 год
  kaz: 2014 жылы Казталов ауданының ауылдық елді мекендеріне жұмыс істеуге және тұруға келген денсаулық сақтау, білім беру, әлеуметтік қамсыздандыру, мәдениет, спорт және агроөнеркәсіптік кешен саласындағы мамандарына көтерме жәрдемақы және тұрғын үй алу немесе салу үшін әлеуметтiк қолдау көрсету туралы
