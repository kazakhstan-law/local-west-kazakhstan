  title:
    rus: О внесении изменения в решение Казталовского районного маслихата от 12 марта 2014 года № 21-1 «Об утверждении Правил проведения раздельных сходов местного сообщества и определения количества представителей жителей села, улицы, многоквартирного жилого дома для участия в сходе местного сообщества на территории Казталовского района»
    kaz: Казталов аудандық мәслихатының 2014 жылғы 12 наурыздағы № 21-1 «Казталов ауданының аумағында бөлек жергiлiктi қоғамдастық жиындарын өткiзу және жергiлiктi қоғамдастық жиынына қатысу үшiн ауыл, көше, көппәтерлi тұрғын үй тұрғындары өкiлдерiнiң санын айқындау тәртiбi туралы қағидасын бекiту туралы» шешіміне өзгеріс енгізу туралы
