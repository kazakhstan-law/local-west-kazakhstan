act_code: '78384'
requisite: Решение Казталовского районного маслихата Западно-Казахстанской области от 12 марта 2014 года № 21-1. Зарегистрировано Департаментом юстиции Западно-Казахстанской области 2 апреля 2014 года № 3467. Утратило силу решением Казталовского районного маслихата Западно-Казахстанской области от 2 ноября 2023 года № 9-4 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: Об утверждении Правил о порядке проведения раздельных сходов местного сообщества и определения количества представителей жителей села, улицы, многоквартирного жилого дома для участия в сходе местного сообщества на территории Казталовского района
  kaz: Казталов ауданының аумағында бөлек жергiлiктi қоғамдастық жиындарын өткiзу және жергiлiктi қоғамдастық жиынына қатысу үшiн ауыл, көше, көппәтерлi тұрғын үй тұрғындары өкiлдерiнiң санын айқындау тәртiбi туралы қағидасын бекiту туралы
