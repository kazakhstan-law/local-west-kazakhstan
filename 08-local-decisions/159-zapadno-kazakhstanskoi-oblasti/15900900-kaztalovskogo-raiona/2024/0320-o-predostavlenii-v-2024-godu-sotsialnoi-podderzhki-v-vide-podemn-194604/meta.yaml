act_code: '194604'
requisite: Решение Казталовского районного маслихата Западно-Казахстанской области от 20 марта 2024 года № 15-2
title:
  rus: О предоставлении в 2024 году социальной поддержки в виде подъемного пособия и бюджетного кредита на приобретение или строительство жилья специалистам здравоохранения, образования, социального обеспечения, культуры, спорта и агропромышленного комплекса, государственным служащим аппаратов акимов сел, поселка, сельских округов, прибывшим для работы и проживания в сельские населенные пункты Казталовского района
  kaz: 2024 жылы Казталов ауданының ауылдық елді мекендеріне жұмыс істеу және тұру үшін келген денсаулық сақтау, білім беру, әлеуметтік қамсыздандыру, мәдениет, спорт және агроөнеркәсіптік кешен саласындағы мамандарға, ауылдар, ауылдық округтер әкімдері аппараттарының мемлекеттік қызметшілеріне тұрғын үй сатып алуға немесе салуға бюджеттік кредит беру және бір жолғы көтерме жәрдемақы беру туралы
