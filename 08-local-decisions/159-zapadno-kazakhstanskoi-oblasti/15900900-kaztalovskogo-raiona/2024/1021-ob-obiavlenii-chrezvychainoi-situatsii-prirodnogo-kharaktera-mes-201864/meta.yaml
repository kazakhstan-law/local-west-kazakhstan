requisite: Решение акима Казталовского района Западно-Казахстанской области от 21 октября 2024 года № 26. Утратило силу решением акима Казталовского района Западно-Казахстанской области от 13 января 2025 года № 3 (вводится в действие со дня его первого официального опубликования)
title:
  rus: Об объявлении чрезвычайной ситуации природного характера местного масштаба на территории сел Коктерек, Оразгали, Саралжын Коктерекского сельского округа и сел Абиш и Танат Жанажолского сельского округа, а также Бостандыкского, Казталовского, Теренкульского сельских округов Казталовского района
  kaz: Казталов ауданының Бостандық, Казталов, Тереңкөл және Көктерек ауылдық округінің Көктерек, Оразғали, Саралжын ауылдары мен Жаңажол ауылдық округінің Әбіш пен Танат ауылдарының аумағындағы жергілікті ауқымдағы табиғи сипаттағы төтенше жағдайды жариялау туралы
