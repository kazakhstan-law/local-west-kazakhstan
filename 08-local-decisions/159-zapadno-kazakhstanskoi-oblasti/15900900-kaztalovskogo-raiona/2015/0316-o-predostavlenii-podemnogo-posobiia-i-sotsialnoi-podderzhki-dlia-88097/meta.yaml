requisite: Решение Казталовского районного маслихата Западно-Казахстанской области от 16 марта 2015 года № 32-3. Зарегистрировано Департаментом юстиции Западно-Казахстанской области 2 апреля 2015 года № 3870. Утратило силу решением Казталовского районного маслихата Западно-Казахстанской области от 11 января 2016 года № 40-2
title:
  rus: О предоставлении подъемного пособия и социальной поддержки для приобретения или строительства жилья специалистам в области здравоохранения, образования, социального обеспечения, культуры, спорта и агропромышленного комплекса, прибывшим для работы и проживания в сельские населенные пункты Казталовского района на 2015 год
  kaz: 2015 жылы Казталов ауданының ауылдық елді мекендеріне жұмыс істеуге және тұруға келген денсаулық сақтау, білім беру, әлеуметтік қамсыздандыру, мәдениет, спорт  және агроөнеркәсіптік кешен саласындағы мамандарына көтерме жәрдемақы және тұрғын үй алу немесе салу үшін әлеуметтiк қолдау көрсету туралы
