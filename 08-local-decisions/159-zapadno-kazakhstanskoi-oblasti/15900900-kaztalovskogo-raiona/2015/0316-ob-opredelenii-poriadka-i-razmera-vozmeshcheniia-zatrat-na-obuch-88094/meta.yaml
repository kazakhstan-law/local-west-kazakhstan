  title:
    rus: О внесении изменений и дополнения в решение Казталовского районного маслихата от 16 марта 2015 года № 32-4 «Об определении порядка и размера возмещения затрат на обучение на дому детей с ограниченными возможностями из числа инвалидов по индивидуальному учебному плану в Казталовском районе»
    kaz: Казталов аудандық мәслихатының 2015 жылғы 16 наурыздағы № 32-4 «Казталов ауданында мүгедектер қатарындағы кемтар балаларды жеке оқыту жоспары бойынша үйде оқытуға жұмсаған шығындарын өндіріп алу тәртібін және мөлшерін айқындау туралы» шешіміне өзгерістер мен толықтыру енгізу туралы
