  title:
    rus: О внесении изменения в решение Казталовского районного маслихата от 27 декабря 2013 года № 20-5 «Об утверждении Правил оказания социальной помощи, установления размеров и определения перечня отдельных категорий нуждающихся граждан Казталовского района»
    kaz: Казталов аудандық мәслихатының 2013 жылғы 27 желтоқсандағы №20-5 «Казталов ауданының әлеуметтік көмек көрсетудің, оның мөлшерлерін белгілеудің және мұқтаж азаматтардың жекелеген санаттарының тізбесін айқындаудың қағидасын бекіту туралы» шешіміне өзгеріс енгізу туралы
