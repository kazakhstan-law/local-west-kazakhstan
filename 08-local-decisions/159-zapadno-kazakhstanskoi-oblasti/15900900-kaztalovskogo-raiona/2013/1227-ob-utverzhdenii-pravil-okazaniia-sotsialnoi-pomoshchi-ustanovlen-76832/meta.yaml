  title:
    rus: О внесении дополнений в решение Казталовского районного маслихата от 27 декабря 2013 года №20-5 «Об утверждении Правил оказания социальной помощи, установления размеров и определения перечня отдельных категорий нуждающихся граждан Казталовского района»
    kaz: Казталов аудандық мәслихатының 2013 жылғы 27 желтоқсандағы №20-5 «Казталов ауданының әлеуметтік көмек көрсету, оның мөлшерлерін белгілеу және мұқтаж азаматтардың жекелеген санаттарының тізбесін айқындау қағидасын бекіту туралы» шешіміне толықтырулар енгізу туралы
