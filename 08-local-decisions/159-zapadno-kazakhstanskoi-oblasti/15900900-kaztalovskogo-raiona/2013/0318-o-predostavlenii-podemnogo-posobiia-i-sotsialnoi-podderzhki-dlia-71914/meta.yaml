requisite: Решение Казталовского районного маслихата Западно-Казахстанской области от 18 марта 2013 года № 11-5. Зарегистрировано Департаментом юстиции Западно-Казахстанской области 9 апреля 2013 года № 3240. Утратило силу решением Казталовского районного маслихата Западно-Казахстанской области от 12 марта 2014 года № 21-4
title:
  rus: О предоставлении подъемного пособия и социальной поддержки для приобретения или строительства жилья специалистам здравоохранения, образования, социального обеспечения, культуры, спорта и ветеринарии, прибывшим для работы и проживания в сельские населенные пункты Казталовского района на 2013 год
  kaz: 2013 жылы Казталов ауданының ауылдық елдi мекендеріне жұмыс iстеуге және тұруға келген денсаулық сақтау, бiлiм беру, әлеуметтiк қамсыздандыру, мәдениет, спорт және ветеринария мамандарына көтерме жәрдемақы және тұрғын үй алу немесе салу үшін әлеуметтік қолдау көрсету туралы
