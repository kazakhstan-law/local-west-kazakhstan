  title:
    rus: О внесении изменения в решение акима Жанабулакского сельского округа Акжаикского района от 19 января 2015 года №3 «Об установлении ограничительных мероприятий на территории села Жанабулак и зимовья Таскудык Жанабулакского сельского округа Акжаикского района Западно-Казахстанской области»
    kaz: Ақжайық ауданы Жаңабұлақ ауылдық округі әкімінің 2015 жылғы 19 қаңтардағы №3 «Батыс Қазақстан облысы Ақжайық ауданы Жаңабұлақ ауылдық округінің Жаңабұлақ ауылы және Тасқұдық қыстағы аумағында шектеу іс-шараларын белгілеу туралы» шешіміне өзгеріс еңгізу туралы
