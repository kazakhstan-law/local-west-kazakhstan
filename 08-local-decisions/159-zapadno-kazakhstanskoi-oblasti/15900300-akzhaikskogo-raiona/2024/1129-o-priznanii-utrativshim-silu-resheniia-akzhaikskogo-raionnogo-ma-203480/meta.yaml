title:
  rus: О признании утратившим силу решения Акжаикского районного маслихата от 17 апреля 2023 года № 2-10 «Об утверждении Плана по управлению пастбищами и их использованию по Акжаикскому району на 2023-2024 годы»
  kaz: Ақжайық аудандық мәслихатының 2023 жылғы 17 сәуірдегі № 2-10 «Ақжайық ауданы бойынша 2023-2024 жылдарға арналған жайылымдарды басқару және оларды пайдалану жөніндегі жоспарын бекіту туралы» шешімнің күшін жою деп тану туралы
