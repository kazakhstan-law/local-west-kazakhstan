requisite: Батыс Қазақстан облысы Ақжайық ауданы әкімінің 2009 жылғы 8 желтоқсандағы № 18 шешімі. Батыс Қазақстан облысы Ақжайық ауданы әділет басқармасында 2009 жылғы 31 желтоқсанда № 7-2-83 тіркелді. Күші жойылды - Батыс Қазақстан облысы Ақжайық ауданы әкімінің 2010 жылғы 2 сәуірдегі № 6 шешімімен
