act_code: '44877'
requisite: Батыс Қазақстан облысы Ақжайық аудандық мәслихатының 2009 жылғы 25 ақпандағы № 11-3 шешімі. Батыс Қазақстан облысы Ақжайық ауданы әділет басқармасында 2009 жылғы 16 наурызда № 7-2-71 тіркелді. Күші жойылды - Батыс Қазақстан облысы Ақжайық аудандық мәслихатының 2013 жылғы 5 қаңтардағы № 8-2 шешімімен
