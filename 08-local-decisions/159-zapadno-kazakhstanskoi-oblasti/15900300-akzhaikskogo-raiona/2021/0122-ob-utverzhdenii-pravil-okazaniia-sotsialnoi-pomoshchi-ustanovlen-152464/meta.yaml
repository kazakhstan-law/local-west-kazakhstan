  title:
    rus: О внесении изменения в решение Акжаикского районного маслихата от 22 января 2021 года № 2-2 «Об утверждении Правил оказания социальной помощи, установления размеров и определения перечня отдельных категорий нуждающихся граждан Акжаикского района»
    kaz: Ақжайық аудандық мәслихатының 2021 жылғы 22 қаңтардағы № 2-2 «Ақжайық ауданының әлеуметтік көмек көрсету, оның мөлшерлерін белгілеу және мұқтаж азаматтардың жекелеген санаттарының тізбесін айқындау қағидаларын бекіту туралы» шешіміне өзгеріс енгізу туралы
