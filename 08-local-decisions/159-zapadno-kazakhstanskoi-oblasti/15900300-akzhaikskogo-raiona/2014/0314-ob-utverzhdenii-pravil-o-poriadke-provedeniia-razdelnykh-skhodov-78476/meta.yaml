requisite: Решение Акжаикского районного маслихата Западно-Казахстанской области от 14 марта 2014 года № 18-4. Зарегистрировано Департаментом юстиции Западно-Казахстанской области 3 апреля 2014 года № 3484. Утратило силу решением Акжаикского районного маслихата Западно-Казахстанской области от 13 октября 2023 года № 7-5 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: Об утверждении Правил о порядке проведения раздельных сходов местного сообщества и определения количества представителей жителей села, улицы, многоквартирного жилого дома для участия в сходе местного сообщества на территории Акжаикского района
  kaz: Ақжайық ауданының аумағында жергілікті қоғамдастықтың бөлек жиындарын өткізу және жергілікті қоғамдастық жиынына қатысу үшін ауыл, көше, көппәтерлі тұрғын үй тұрғындары өкілдерінің санын айқындау тәртібі туралы қағидасын бекіту туралы
