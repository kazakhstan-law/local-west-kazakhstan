act_code: '38921'
requisite: Батыс Қазақстан облысы Ақжайық аудандық мәслихатының 2008 жылғы 5 наурыздағы № 4-5 шешімі. Батыс Қазақстан облысы Ақжайық ауданы әділет басқармасында 2008 жылғы 11 сәуірде № 7-2-54 тіркелді. Күші жойылды - Батыс Қазақстан облысы Ақжайық аудандық мәслихаттың 2010 жылғы 29 маусымдағы № 23-4 шешімімен
