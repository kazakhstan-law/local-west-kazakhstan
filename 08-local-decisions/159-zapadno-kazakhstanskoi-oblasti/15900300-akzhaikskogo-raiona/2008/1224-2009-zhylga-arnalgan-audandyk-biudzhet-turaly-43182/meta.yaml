act_code: '43182'
requisite: Батыс Қазақстан облысы Ақжайық аудандық мәслихатының 2008 жылғы 24 желтоқсандағы № 10-3 шешімі. Батыс Қазақстан облысы Ақжайық ауданы әділет басқармасында 2008 жылғы 30 желтоқсанда № 7-2-69 тіркелді. Күші жойылды - Батыс Қазақстан облысы Ақжайық аудандық мәслихаттың 2010 жылғы 26 ақпандағы № 19-3 шешімімен
