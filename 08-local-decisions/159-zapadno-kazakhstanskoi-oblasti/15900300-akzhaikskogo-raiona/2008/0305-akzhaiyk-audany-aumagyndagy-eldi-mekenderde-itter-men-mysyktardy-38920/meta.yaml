act_code: '38920'
requisite: Батыс Қазақстан облысы Ақжайық аудандық мәслихаттың 2008 жылғы 5 наурыздағы № 4-3 шешімі. Батыс Қазақстан облысы Ақжайық ауданы әділет басқармасында 2008 жылғы 11 сәуірде № 7-2-53 тіркелді. Күші жойылды - Батыс Қазақстан облысы Ақжайық аудандық мәслихаттың 2012 жылғы 22 маусымдағы № 4-4 шешімімен
title:
  rus: Ақжайық ауданы аумағындағы елді мекендерде иттер мен мысықтарды күтіп ұстау Ережесін бекіту туралы
