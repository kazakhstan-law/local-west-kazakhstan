act_code: '54755'
requisite: Батыс Қазақстан облысы Ақжайық ауданы Жаңабұлақ ауылдық округі әкімінің 2010 жылғы 28 қыркүйектегі № 14 шешімі. Батыс Қазақстан облысы Ақжайық ауданы әділет басқармасында 2010 жылғы 6 қазанда № 7-2-99 тіркелді. Күші жойылды - Батыс Қазақстан облысы Ақжайық ауданы Жаңабұлақ ауылдық округі әкімінің 2010 жылғы 28 қазандағы № 15 шешімімен
title:
  rus: Жаңабұлақ ауылдық округінің "Атамекен" шаруа қожалығы аумағында қарасан ауруы шығуына байланысты шектеу іс-шаралары енгізіліп, карантин аймағының ветеринариялық режимін белгілеу туралы
