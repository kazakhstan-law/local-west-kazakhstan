act_code: '54312'
requisite: Батыс Қазақстан облысы Ақжайық ауданы Қабыршақты ауылдық округі әкімінің 2010 жылғы 12 тамыздағы № 9 шешімі. Батыс Қазақстан облысы Ақжайық ауданы әділет басқармасында 2010 жылғы 3 қыркүйекте № 7-2-98 тіркелді
