act_code: '53625'
requisite: Батыс Қазақстан облысы Ақжайық аудандық мәслихатының 2010 жылғы 29 маусымдағы № 23-4 шешімі. Батыс Қазақстан облысы Ақжайық ауданы әділет басқармасында 2010 жылғы 22 шілдесінде № 7-2-93 тіркелді. Күші жойылды - Батыс Қазақстан облысы Ақжайық аудандық мәслихаттың 2012 жылғы 19 сәуірдегі № 3-5 шешімімен
