  title:
    rus: О внесении изменений в решение Акжаикского районного маслихата от 27 декабря 2013 года № 16-2 «Об утверждении Правил оказания социальной помощи, установления размеров и определения перечня отдельных категорий нуждающихся граждан Акжаикского района»
    kaz: Ақжайық аудандық мәслихатының 2013 жылғы 27 желтоқсандағы № 16-2 «Ақжайық ауданының әлеуметтік көмек көрсету, оның мөлшерлерін белгілеу және мұқтаж азаматтардың жекелеген санаттарының тізбесін айқындау қағидасын бекіту туралы» шешіміне өзгерістер енгізу туралы
