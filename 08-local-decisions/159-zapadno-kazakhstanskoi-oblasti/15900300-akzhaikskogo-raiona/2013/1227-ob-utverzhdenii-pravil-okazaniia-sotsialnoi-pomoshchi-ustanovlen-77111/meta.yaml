    kaz: Ақжайық аудандық мәслихатының 2013 жылғы 27 желтоқсандағы №16-2 «Ақжайық ауданының әлеуметтік көмек көрсету, оның мөлшерлерін белгілеу және мұқтаж азаматтардың жекелеген санаттарының тізбесін айқындау қағидасын бекіту туралы» шешіміне толықтырулар енгізу туралы
