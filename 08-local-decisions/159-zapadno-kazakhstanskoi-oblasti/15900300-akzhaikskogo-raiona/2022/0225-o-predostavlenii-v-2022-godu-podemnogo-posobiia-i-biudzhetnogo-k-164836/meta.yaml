act_code: '164836'
requisite: Решение Акжаикского районного маслихата Западно-Казахстанской области от 25 февраля 2022 года № 13-3
title:
  rus: О предоставлении в 2022 году подъемного пособия и бюджетного кредита на приобретение или строительство жилья специалистам в области здравоохранения, образования, социального обеспечения, культуры, спорта и агропромышленного комплекса, государственным служащим аппаратов сельских округов, прибывшим для работы и проживания в сельские населенные пункты Акжаикского района
  kaz: Ақжайық ауданының ауылдық елді мекендеріне жұмыс істеуге және тұруға келген денсаулық сақтау, білім беру, әлеуметтік қамсыздандыру, мәдениет, спорт және агроөнеркәсіптік кешен саласындағы мамандарға, ауылдық округтер әкімдері аппараттарының мемлекеттік қызметшілеріне 2022 жылы көтерме жәрдемақы және тұрғын үй сатып алу немесе салу үшін бюджеттік кредит беру туралы
