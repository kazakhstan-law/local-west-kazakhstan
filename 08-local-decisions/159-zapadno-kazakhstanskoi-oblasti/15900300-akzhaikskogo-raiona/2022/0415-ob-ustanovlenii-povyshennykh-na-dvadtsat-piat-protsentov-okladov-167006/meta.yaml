requisite: Решение Акжаикского районного маслихата Западно-Казахстанской области от 15 апреля 2022 года № 14-5. Зарегистрировано в Министерстве юстиции Республики Казахстан 26 апреля 2022 года № 27761
title:
  rus: Об установлении повышенных на двадцать пять процентов окладов и тарифных ставок специалистам в области социального обеспечения, культуры и спорта, являющимся гражданскими служащими и работающим в сельских населенных пунктах Акжаикского района
  kaz: Ақжайық ауданының азаматтық қызметші болып табылатын және ауылдық елді мекендерде жұмыс істейтін әлеуметтік қамсыздандыру, мәдениет және спорт саласының мамандарына жиырма бес пайызға жоғарылатылған айлықақылар мен тарифтік мөлшерлемелер белгілеу туралы
