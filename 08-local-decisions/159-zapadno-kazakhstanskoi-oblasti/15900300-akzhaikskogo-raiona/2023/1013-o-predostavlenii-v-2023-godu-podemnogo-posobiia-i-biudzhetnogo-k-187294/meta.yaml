act_code: '187294'
requisite: Решение Акжаикского районного маслихата Западно-Казахстанской области от 13 октября 2023 года № 7-4
title:
  rus: О предоставлении в 2023 году подъемного пособия и бюджетного кредита на приобретение или строительство жилья специалистам в области здравоохранения, образования, социального обеспечения, культуры, спорта и агропромышленного комплекса, государственным служащим аппаратов сельских округов, прибывшим для работы и проживания в сельские населенные пункты Акжаикского района
  kaz: Ақжайық ауданының ауылдық елді мекендеріне жұмыс істеуге және тұруға келген денсаулық сақтау, білім беру, әлеуметтік қамсыздандыру, мәдениет, спорт және агроөнеркәсіптік кешен саласындағы мамандарға, ауылдық округтер әкімдері аппараттарының мемлекеттік қызметшілеріне 2023 жылы көтерме жәрдемақы және тұрғын үй сатып алу немесе салу үшін бюджеттік кредит беру туралы
