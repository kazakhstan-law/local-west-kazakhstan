  title:
    rus: О внесении изменения в решение Акжаикского районного маслихата от 11 января 2016 года № 34-2 «Об утверждении Правил и размера возмещения затрат на обучение на дому детей с ограниченными возможностями из числа инвалидов по индивидуальному учебному плану»
    kaz: Ақжайық аудандық мәслихатының 2016 жылғы 11 қаңтардағы № 34-2 «Мүгедектер қатарындағы кемтар балаларды жеке оқыту жоспары бойынша үйде оқытуға жұмсаған шығындарын өндіріп алу қағидасы мен мөлшерін бекіту туралы» шешіміне өзгеріс енгізу туралы
