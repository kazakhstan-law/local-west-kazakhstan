act_code: '149658'
requisite: Решение Акжаикского районного маслихата Западно-Казахстанской области от 10 декабря 2020 года № 55-3. Зарегистрировано Департаментом юстиции Западно-Казахстанской области 11 декабря 2020 года № 6542
title:
  rus: Об определении специализированных мест для организации и проведения мирных собраний, порядка их использования, норм их предельной заполняемости, требований к их материально-техническому и организационному обеспечению, границ прилегающих территорий, в которых запрещено проведение пикетирования по Акжаикскому району
  kaz: Ақжайық ауданында бейбіт жиналыстарды ұйымдастыру және өткізу үшін арнайы орындарды, оларды пайдалану тәртібін, шекті толтырылу нормаларын, олардың материалдық-техникалық және ұйымдастырушылық қамтамасыз етуге қойылатын талаптарын, пикеттеуді өткізуге тыйым салынған іргелес аумақтардың шекараларын айқындау туралы
