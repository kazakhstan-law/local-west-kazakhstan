act_code: '17670'
requisite: Батыс Қазақстан облысы Ақжайық аудандық мәслихатының 2003 жылғы 18 қарашадағы № 2-3 шешімі. Батыс Қазақстан облыстық Әділет басқармасында 2003 жылғы 28 қарашада № 2365 тіркелген. Күші жойылды - Батыс Қазақстан облысы Ақжайық аудандық мәслихатының 2006 жылғы 9 маусымдағы № 23-6 шешімімен
title:
