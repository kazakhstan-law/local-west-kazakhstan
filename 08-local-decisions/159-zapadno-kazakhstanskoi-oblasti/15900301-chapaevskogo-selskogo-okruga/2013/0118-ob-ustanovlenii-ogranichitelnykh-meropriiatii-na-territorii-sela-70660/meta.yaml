  title:
    rus: О внесении изменений в решение акима Караултюбинского сельского округа  Акжаикского района Западно-Казахстанской области от 18 января 2013 года № 4 "Об установлении ветеринарного режима карантинной зоны с введением ограничительных мероприятий на территории села Караултюба Караултюбинского сельского округа Акжаикского района Западно-Казахстанской области"
    kaz: Батыс Қазақстан облысы Ақжайық ауданы Қарауылтөбе ауылдық округі әкімінің  2013 жылғы 18 қаңтардағы № 4 "Батыс Қазақстан облысы Ақжайық ауданы Қарауылтөбе ауылдық округінің Қарауылтөбе ауылы аумағына шектеу іс-шараларын енгізе отырып, карантин аймағының ветеринариялық режимін  белгілеу туралы" шешіміне өзгерістер енгізу туралы
