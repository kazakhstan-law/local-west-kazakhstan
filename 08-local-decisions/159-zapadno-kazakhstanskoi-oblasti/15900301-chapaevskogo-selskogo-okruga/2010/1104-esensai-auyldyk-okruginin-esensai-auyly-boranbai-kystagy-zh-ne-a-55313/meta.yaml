act_code: '55313'
requisite: Батыс Қазақстан облысы Ақжайық ауданы Есенсай ауылдық округі әкімінің 2010 жылғы 4 қарашадағы № 17 шешімі. Батыс Қазақстан облысы Ақжайық ауданы Әділет басқармасында 2010 жылғы 10 қарашада № 7-2-106 тіркелді. Күші жойылды - Батыс Қазақстан облысы Ақжайық ауданы Есенсай ауылдық округі әкімінің 2010 жылғы 3 желтоқсандағы № 20 шешімімен
title:
  rus: Есенсай ауылдық округінің Есенсай ауылы, "Боранбай" қыстағы және Ақшкөл елді мекені аумағында қарасан ауруы шығуына байланысты шектеу іс-шаралары енгізіліп, карантин аймағының ветеринариялық режимін белгілеу туралы
