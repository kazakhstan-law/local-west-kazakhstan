requisite: Батыс Қазақстан облысы Ақжайық ауданы Тайпақ ауылдық округі әкімінің 2010 жылғы 7 желтоқсандағы № 34 шешімі. Батыс Қазақстан облысы Ақжайық ауданы Әділет басқармасында 2010 жылғы 13 желтоқсанда № 7-2-112 тіркелді. Күші жойылды - Батыс Қазақстан облысы Ақжайық ауданы Тайпақ ауылдық округі әкімінің 2010 жылғы 29 желтоқсандағы № 38 шешімімен
