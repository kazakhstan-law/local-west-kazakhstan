act_code: '55666'
requisite: Батыс Қазақстан облысы Ақжайық ауданы Есенсай ауылдық округі әкімінің 2010 жылғы 26 қарашадағы № 19 шешімі. Батыс Қазақстан облысы Ақжайық ауданы Әділет басқармасында 2010 жылғы 3 желтоқсанда № 7-2-109 тіркелді. Күші жойылды - Батыс Қазақстан облысы Ақжайық ауданы Есенсай ауылдық округі әкімінің 2010 жылғы 23 желтоқсандағы № 21 шешімімен
title:
  rus: Есенсай ауылдық округінің Тасоба елді мекеніне және Тама қыстағы аумағында қарасан ауруы шығуына байланысты шектеу іс-шаралары енгізіліп, карантин аймағының ветеринариялық режимін белгілеу туралы
