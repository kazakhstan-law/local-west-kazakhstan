act_code: '53981'
requisite: Батыс Қазақстан облысы Ақжайық ауданы Сарытоғай ауылдық округі әкімінің 2010 жылғы 30 шілдедегі № 3 шешімі. Батыс Қазақстан облысы Ақжайық ауданы әділет басқармасында 2010 жылғы 17 тамызда № 7-2-97 тіркелді
