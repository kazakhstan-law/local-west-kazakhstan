act_code: '55823'
requisite: Батыс Қазақстан облысы Ақжайық ауданы Сарытоғай ауылдық округі әкімінің 2010 жылғы 6 желтоқсандағы № 7 шешімі. Батыс Қазақстан облысы Ақжайық ауданы Әділет басқармасында 2010 жылғы 13 желтоқсанда № 7-2-113 тіркелді
