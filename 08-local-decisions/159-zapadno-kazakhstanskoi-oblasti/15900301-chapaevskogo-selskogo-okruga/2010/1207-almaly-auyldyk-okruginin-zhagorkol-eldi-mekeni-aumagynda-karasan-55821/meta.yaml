requisite: Батыс Қазақстан облысы Ақжайық ауданы Алмалы ауылдық округі әкімінің 2010 жылғы 7 желтоқсандағы № 17 шешімі. Батыс Қазақстан облысы Ақжайық ауданы Әділет басқармасында 2010 жылғы 13 желтоқсанда № 7-2-111 тіркелді. Күші жойылды - Батыс Қазақстан облысы Ақжайық ауданы Алмалы ауылдық округі әкімінің 2010 жылғы 30 желтоқсандағы № 20 шешімімен
title:
