act_code: '54923'
requisite: Батыс Қазақстан облысы Ақжайық ауданы Құрайлысай ауылдық округі әкімінің 2010 жылғы 14 қазандағы № 2 шешімі. Батыс Қазақстан облысы Ақжайық ауданы әділет басқармасында 2010 жылғы 19 қазанда № 7-2-101 тіркелді. Күші жойылды - Батыс Қазақстан облысы Ақжайық ауданы Құрайлысай ауылдық округі әкімінің 2010 жылғы 1 қарашадағы № 3 шешімімен
