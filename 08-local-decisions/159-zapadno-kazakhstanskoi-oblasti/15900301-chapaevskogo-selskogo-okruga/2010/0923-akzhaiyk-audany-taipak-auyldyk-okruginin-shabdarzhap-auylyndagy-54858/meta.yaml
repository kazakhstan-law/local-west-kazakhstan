act_code: '54858'
requisite: Батыс Қазақстан облысы Ақжайық ауданы Тайпақ ауылдық округі әкімінің 2010 жылғы 23 қыркүйектегі № 24 шешімі. Батыс Қазақстан облысы Ақжайық ауданы әділет басқармасында 2010 жылғы 14 қазанда № 7-2-100 тіркелді
