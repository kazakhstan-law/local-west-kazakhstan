act_code: '55532'
requisite: Батыс Қазақстан облысы Ақжайық ауданы Базаршолан ауылдық округі әкімінің 2010 жылғы 19 қарашадағы № 12 шешімі. Батыс Қазақстан облысы Ақжайық ауданы Әділет басқармасында 2010 жылғы 25 қарашада № 7-2-108 тіркелді. Күші жойылды - Батыс Қазақстан облысы Ақжайық ауданы Базаршолан ауылдық округі әкімінің 2010 жылғы 13 желтоқсандағы № 13 шешімімен
