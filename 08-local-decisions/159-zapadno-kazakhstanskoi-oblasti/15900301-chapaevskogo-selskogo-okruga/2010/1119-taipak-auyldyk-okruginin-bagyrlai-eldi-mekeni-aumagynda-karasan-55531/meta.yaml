act_code: '55531'
requisite: Батыс Қазақстан облысы Ақжайық ауданы Тайпақ ауылдық округі әкімінің 2010 жылғы 19 қарашадағы № 32 шешімі. Батыс Қазақстан облысы Ақжайық ауданы Әділет басқармасында 2010 жылғы 25 қарашада № 7-2-107 тіркелді. Күші жойылды - Батыс Қазақстан облысы Ақжайық ауданы Тайпақ ауылдық округі әкімінің 2010 жылғы 23 желтоқсандағы № 37 шешімімен
