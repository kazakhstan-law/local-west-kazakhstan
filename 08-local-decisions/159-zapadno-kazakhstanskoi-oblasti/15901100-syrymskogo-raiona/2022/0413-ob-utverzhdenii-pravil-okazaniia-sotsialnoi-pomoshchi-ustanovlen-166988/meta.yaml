  title:
    rus: О внесении изменений в решение Сырымского районного маслихата Западно-Казахстанской области от 13 апреля 2022 года №16-2 «Об утверждении Правил оказания социальной помощи, установления размеров и определения перечня отдельных категорий нуждающихся граждан Сырымского района»
    kaz: Батыс Қазақстан облысы Сырым аудандық мәслихатының 2022 жылғы 13 сәуірдегі №16-2 «Сырым ауданының әлеуметтік көмек көрсету, оның мөлшерлерін белгілеу және мұқтаж азаматтардың жекеленген санаттарының тізбесін айқындау қағидаларын бекіту туралы» шешіміне өзгерістер енгізу туралы
