requisite: Решение Сырымского районного маслихата Западно-Казахстанской области от 13 апреля 2022 года № 16-1. Зарегистрировано в Министерстве юстиции Республики Казахстан 3 мая 2022 года № 27843
title:
  rus: Об установлении повышенных на двадцать пять процентов должностных окладов и тарифных ставок специалистам в области социального обеспечения, культуры, спорта являющимся гражданскими служащими и работающим в сельской местности по Сырымскому району
  kaz: Сырым ауданы бойынша азаматтық қызметшілер болып табылатын және ауылдық жерде жұмыс істейтін әлеуметтiк қамсыздандыру, мәдениет, спорт саласындағы мамандарға жиырма бес пайызға жоғарылатылған лауазымдық айлықақылар мен тарифтік мөлшерлемелер белгілеу туралы
