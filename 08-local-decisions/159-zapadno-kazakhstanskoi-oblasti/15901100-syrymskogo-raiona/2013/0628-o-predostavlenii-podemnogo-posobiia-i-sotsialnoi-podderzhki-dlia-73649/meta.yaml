requisite: Решение Сырымского районного маслихата Западно-Казахстанской области от 28 июня 2013 года № 12-5. Зарегистрировано Департаментом юстиции Западно-Казахстанской области 24 июля 2013 года № 3323. Утратило силу решением Сырымского районного маслихата Западно-Казахстанской области от 30 апреля 2014 года № 19-2
title:
  rus: О предоставлении подъемного пособия и социальной поддержки для приобретения или строительства жилья специалистам здравоохранения, образования, социального обеспечения, культуры, спорта и ветеринарии, прибывшим для работы и проживания в сельские населенные пункты Сырымского района на 2013 год
  kaz: 2013 жылы Сырым ауданының ауылдық елдi мекендеріне жұмыс iстеуге және тұруға келген денсаулық сақтау, бiлiм беру, әлеуметтiк қамсыздандыру, мәдениет, спорт және ветеринария мамандарына көтерме жәрдемақы және тұрғын үй алу немесе салу үшін әлеуметтік қолдау көрсету туралы
