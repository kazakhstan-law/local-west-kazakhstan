  title:
    rus: О внесении изменений в решение акима Жосалинского сельского округа Сырымского района от 8 апреля 2013 года № 3 "Об установлении ветеринарного режима карантинной зоны с введением ограничительных мероприятий на территории населенных пунктов Коныр, Тамды Жосалинского сельского округа Сырымского района"
    kaz: Сырым ауданы Жосалы ауылдық округі әкімінің 2013 жылғы 8 сәуірдегі № 3 "Сырым ауданы Жосалы ауылдық округінің Қоңыр, Тамды елді-мекендері аумағында шектеу іс-шараларын енгізе отырып, карантин аймағының ветеринариялық режимін белгілеу туралы" шешіміне өзгерістер енгізу туралы
