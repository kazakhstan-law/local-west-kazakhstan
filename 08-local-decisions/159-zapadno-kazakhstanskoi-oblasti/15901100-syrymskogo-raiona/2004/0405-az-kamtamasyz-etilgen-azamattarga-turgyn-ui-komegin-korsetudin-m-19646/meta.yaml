requisite: Батыс Қазақстан облысы Cырым аудандық мәслихатының 2004 жылғы 6 сәуірдегі № 5-2 шешімі. Батыс Қазақстан облыстық Әділет департаментінде 2004 жылғы 29 сәуірде № 2654 тіркелген. Күші жойылды - Батыс Қазақстан облысы Сырым аудандық мәслихатының 2006 жылғы 25 желтоқсандағы № 30-17 шешімімен
