requisite: Батыс Қазақстан облысы Сырым ауданы әкімінің 2008 жылғы 10 желтоқсандағы № 77 шешімі. Батыс Қазақстан облысы Сырым ауданы Әділет басқармасында 2009 жылғы 20 қаңтарда № 7-10-56 тіркелді. Күші жойылды - Батыс Қазақстан облысы Сырым ауданы әкімдігінің 2009 жылғы 15 сәуірдегі № 77 қаулысымен
