act_code: '43401'
requisite: Батыс Қазақстан облысы Сырым аудандық мәслихатының 2008 жылғы 24 желтоқсандағы № 10-5 шешімі. Батыс Қазақстан облысы Сырым ауданы әділет басқармасында 2009 жылғы 14 қаңтарда № 7-10-54 тіркелді. Күші жойылды - Батыс Қазақстан облысы Сырым аудандық мәслихатының 2010 жылғы 15 сәуірдегі № 20-3 шешімімен
