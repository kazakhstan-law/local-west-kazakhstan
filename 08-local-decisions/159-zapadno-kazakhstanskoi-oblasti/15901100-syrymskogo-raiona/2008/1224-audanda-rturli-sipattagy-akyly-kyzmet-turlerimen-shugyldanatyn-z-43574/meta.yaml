act_code: '43574'
requisite: Батыс Қазақстан облысы Сырым аудандық мәслихатының 2008 жылғы 24 желтоқсандағы № 10-6 шешімі. Батыс Қазақстан облысы Сырым ауданы әділет басқармасында 2009 жылғы 20 қаңтарда № 7-10-55 тіркелді. Күші жойылды - Батыс Қазақстан облысы Сырым аудандық мәслихатының 2013 жылғы 28 маусымдағы № 12-11 шешімімен
title:
