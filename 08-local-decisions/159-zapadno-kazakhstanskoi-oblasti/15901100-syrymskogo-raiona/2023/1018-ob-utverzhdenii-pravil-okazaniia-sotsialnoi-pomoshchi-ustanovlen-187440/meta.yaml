  title:
    rus: О внесении изменений и дополнений в решение Сырымского районного маслихата от 18 октября 2023 года № 10-4 «Об утверждении Правил оказания социальной помощи, установления ее размеров и определения перечня отдельных категорий нуждающихся граждан Сырымского района»
    kaz: Сырым аудандық мәслихатының 2023 жылғы 18 қазандағы № 10-4 «Сырым ауданының әлеуметтік көмек көрсетудің, оның мөлшерлерін белгілеудің және мұқтаж азаматтардың жекелеген санаттарының тізбесін айқындаудың қағидаларын бекіту туралы» шешіміне өзгерістер мен толықтырулар енгізу туралы
