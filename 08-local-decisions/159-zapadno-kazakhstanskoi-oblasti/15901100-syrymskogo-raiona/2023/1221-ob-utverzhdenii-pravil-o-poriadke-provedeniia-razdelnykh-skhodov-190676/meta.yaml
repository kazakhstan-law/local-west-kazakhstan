title:
  rus: Об утверждении Правил о порядке проведения раздельных сходов местного сообщества и определения количества представителей жителей села, улицы, многоквартирного жилого дома для участия в сходе местного сообщества на территории Сырымского района
  kaz: Сырым ауданының аумағында жергiлiктi қоғамдастықтың бөлек жиындарын өткiзу және жергiлiктi қоғамдастықтың жиынына қатысу үшiн ауыл, көше, көппәтерлi тұрғын үй тұрғындары өкiлдерiнiң санын айқындау тәртiбi туралы Қағидасын бекiту туралы
