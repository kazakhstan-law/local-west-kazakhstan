act_code: '55700'
requisite: Батыс Қазақстан облысы Сырым аудандық мәслихатының 2010 жылғы 5 қарашадағы № 24-4 шешімі. Батыс Қазақстан облысы Сырым ауданы әділет басқармасында 2010 жылғы 3 желтоқсанда № 7-10-94 тіркелді. Күші жойылды - Батыс Қазақстан облысы Сырым аудандық мәслихатының 2012 жылғы 13 сәуірдегі № 2-4 шешімімен
