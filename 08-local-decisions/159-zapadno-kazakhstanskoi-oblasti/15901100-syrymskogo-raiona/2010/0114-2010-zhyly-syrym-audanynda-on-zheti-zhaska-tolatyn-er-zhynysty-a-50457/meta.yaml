act_code: '50457'
requisite: Батыс Қазақстан облысы Сырым ауданы әкімінің 2010 жылғы 14 қаңтардағы № 1 шешімі. Батыс Қазақстан облысы Сырым ауданы әділет басқармасында 2010 жылғы 4 ақпанда № 7-10-69 тіркелді. Күші жойылды - Батыс Қазақстан облысы Сырым ауданы әкімдігінің 2010 жылғы 27 сәуірдегі № 12 шешімімен
