act_code: '98408'
requisite: Решение Сырымского районного маслихата Западно-Казахстанской области от 24 декабря 2015 года № 33-3. Зарегистрировано Департаментом юстиции Западно-Казахстанской области 22 января 2016 года № 4245. Утратило силу решением Сырымского районного маслихата Западно-Казахстанской области от 10 марта 2017 года № 12-4
title:
  rus: О предоставлении мер социальной поддержки специалистам в области здравоохранения, образования, социального обеспечения, культуры, спорта и агропромышленного комплекса, прибывшим для работы и проживания в сельские населенные пункты Сырымского района в 2016 году
  kaz: 2016 жылы Сырым ауданының ауылдық елді мекендеріне жұмыс істеу және тұру үшін келген денсаулық сақтау, білім беру, әлеуметтік қамсыздандыру, мәдениет, спорт және агроөнеркәсіптік кешен саласындағы мамандарға әлеуметтік қолдау шараларын беру туралы
