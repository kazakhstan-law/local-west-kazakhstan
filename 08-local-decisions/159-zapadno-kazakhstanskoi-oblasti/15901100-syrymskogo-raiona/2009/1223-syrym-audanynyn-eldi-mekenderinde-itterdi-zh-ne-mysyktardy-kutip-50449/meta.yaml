act_code: '50449'
requisite: Батыс Қазақстан облысы Сырым аудандық мәслихатының 2009 жылғы 23 желтоқсандағы № 17-3 шешімі. Батыс Қазақстан облысы Сырым ауданы әділет басқармасында 2010 жылғы 4 ақпанда № 7-10-68 тіркелді. Күші жойылды - Батыс Қазақстан облысы Сырым аудандық мәслихатының 2012 жылғы 27 мамырдағы № 4-3 шешімімен
