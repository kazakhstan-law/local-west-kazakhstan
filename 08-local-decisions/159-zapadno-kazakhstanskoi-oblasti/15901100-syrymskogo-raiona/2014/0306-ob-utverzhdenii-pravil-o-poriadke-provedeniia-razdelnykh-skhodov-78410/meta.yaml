requisite: Решение Сырымского районного маслихата Западно-Казахстанской области от 6 марта 2014 года № 17-4. Зарегистрировано Департаментом юстиции Западно-Казахстанской области 2 апреля 2014 года № 3471. Утратило силу решением Сырымского районного маслихата Западно-Казахстанской области от 18 октября 2023 года № 10-5 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: Об утверждении Правил о порядке проведения раздельных сходов местного сообщества и определения количества представителей жителей села, улицы, многоквартирного жилого дома для участия в сходе местного сообщества на территории Сырымского района
  kaz: Сырым ауданының аумағында жергілікті қоғамдастықтың бөлек жиындарын өткізу және жергілікті қоғамдастық жиынына қатысу үшін ауыл, көше, көппәтерлі тұрғын үй тұрғындары өкілдерінің санын айқындау тәртібі туралы қағидасын бекіту туралы
