  title:
    rus: О внесении изменений в решение Сырымского районного маслихата от 6 марта 2014 года № 17-4 «Об утверждении Правил о порядке проведения раздельных сходов местного сообщества и определения количества представителей жителей села, улицы, многоквартирного жилого дома для участия в сходе местного сообщества на территории Сырымского района»
    kaz: Сырым аудандық мәслихатының 2014 жылғы 6 наурыздағы № 17-4 «Сырым ауданының аумағында бөлек жергiлiктi қоғамдастық жиындарын өткiзу және жергiлiкті қоғамдастық жиынына қатысу үшiн ауыл, көше, көппәтерлi тұрғын үй тұрғындары өкiлдерiнiң санын айқындау тәртiбi туралы қағидасын бекіту туралы» шешіміне өзгерістер енгізу туралы
