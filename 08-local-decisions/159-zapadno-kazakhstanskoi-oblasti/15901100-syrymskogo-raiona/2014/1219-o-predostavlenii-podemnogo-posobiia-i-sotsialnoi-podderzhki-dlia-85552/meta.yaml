requisite: Решение Сырымского районного маслихата Западно-Казахстанской области от 19 декабря 2014 года № 25-3. Зарегистрировано Департаментом юстиции Западно-Казахстанской области 30 декабря 2014 года № 3746. Утратило силу решением Сырымского районного маслихата Западно-Казахстанской области от 24 декабря 2015 года № 33-3
title:
  rus: О предоставлении подъемного пособия и социальной поддержки для приобретения или строительства жилья специалистам в области здравоохранения, образования, социального обеспечения, культуры, спорта и агропромышленного комплекса, прибывшим для работы и проживания в сельские населенные пункты Сырымского района в 2015 году
  kaz: 2015 жылы Сырым ауданының ауылдық елдi мекендеріне жұмыс iстеуге және тұруға келген денсаулық сақтау, бiлiм беру, әлеуметтiк қамсыздандыру, мәдениет, спорт және агроөнеркәсіптік кешен саласындағы мамандарына көтерме жәрдемақы және тұрғын үй алу немесе салу үшін әлеуметтік қолдау көрсету туралы
