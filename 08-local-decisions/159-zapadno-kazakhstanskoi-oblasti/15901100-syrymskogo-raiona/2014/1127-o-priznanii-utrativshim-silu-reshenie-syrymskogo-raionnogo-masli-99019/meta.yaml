act_code: '99019'
requisite: Решение Сырымского районного маслихата Западно-Казахстанской области от 27 ноября 2014 года № 24-3
title:
  rus: О признании утратившим силу решение Сырымского районного маслихата от 30 апреля 2014 года №19-2 «О предоставлении подъемного пособия и социальной поддержки для приобретения или строительства жилья специалистам в области здравоохранения, образования, социального обеспечения, культуры, спорта и агропромышленного комплекса, прибывшим для работы и проживания в сельские населенные пункты Сырымского района на 2014 год»
  kaz: Сырым аудандық мәслихатының 2014 жылғы 30 сәуірдегі №19-2 «2014 жылы Сырым ауданының ауылдық елдi мекендеріне жұмыс iстеуге және тұруға келген денсаулық сақтау, бiлiм беру, әлеуметтiк қамсыздандыру, мәдениет, спорт және агроөнеркәсіптік кешен саласындағы мамандарына көтерме жәрдемақы және тұрғын үй алу немесе салу үшін әлеуметтік қолдау көрсету туралы» шешімінің күшін жою туралы
