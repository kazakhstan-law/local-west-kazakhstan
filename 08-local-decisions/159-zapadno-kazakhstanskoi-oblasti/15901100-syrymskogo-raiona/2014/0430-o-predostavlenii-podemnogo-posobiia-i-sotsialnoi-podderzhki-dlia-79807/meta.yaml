requisite: Решение Сырымского районного маслихата Западно-Казахстанской области от 30 апреля 2014 года № 19-2. Зарегистрировано Департаментом юстиции Западно-Казахстанской области 14 мая 2014 года № 3525. Утратило силу решением Сырымского районного маслихата Западно-Казахстанской области от 27 ноября 2014 года № 24-3
title:
  rus: О предоставлении подъемного пособия и социальной поддержки для приобретения или строительства жилья специалистам в области здравоохранения, образования, социального обеспечения, культуры, спорта и агропромышленного комплекса, прибывшим для работы и проживания в сельские населенные пункты Сырымского района на 2014 год
  kaz: 2014 жылы Сырым ауданының ауылдық елдi мекендеріне жұмыс iстеуге және тұруға келген денсаулық сақтау, бiлiм беру, әлеуметтiк қамсыздандыру, мәдениет, спорт және агроөнеркәсіптік кешен саласындағы мамандарына көтерме жәрдемақы және түрғын үй алу немесе салу үшін әлеуметтік қолдау көрсету туралы
