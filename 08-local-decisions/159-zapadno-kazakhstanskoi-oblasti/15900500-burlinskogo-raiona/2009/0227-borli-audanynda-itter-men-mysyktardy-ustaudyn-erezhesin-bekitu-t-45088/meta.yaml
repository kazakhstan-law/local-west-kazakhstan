act_code: '45088'
requisite: Батыс Қазақстан облысы Бөрлі аудандық мәслихаттың 2009 жылғы 27 ақпандағы № 10-5 шешімі. Батыс Қазақстан облысы Бөрлі ауданы әділет басқармасында 2009 жылғы 27 наурызда № 7-3-76 тіркелді. Күші жойылды - Батыс Қазақстан облысы Бөрлі аудандық мәслихаттың 2012 жылғы 18 шілдедегі № 5-9 шешімімен
