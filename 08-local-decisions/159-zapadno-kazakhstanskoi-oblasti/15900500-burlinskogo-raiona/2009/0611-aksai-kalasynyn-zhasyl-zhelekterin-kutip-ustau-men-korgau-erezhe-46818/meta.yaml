requisite: Батыс Қазақстан облысы Бөрлі аудандық мәслихаттың 2008 жылғы 11 маусымдағы № 12-2 шешімі. Батыс Қазақстан облысы Бөрлі ауданы әділет басқармасында 2009 жылғы 22 маусымда № 7-3-81 тіркелді. Күші жойылды - Батыс Қазақстан облысы Бөрлі аудандық мәслихаттың 2012 жылғы 18 шілдедегі № 5-9 шешімімен
