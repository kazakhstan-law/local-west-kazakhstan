act_code: '44532'
requisite: Батыс Қазақстан облысы Бөрлі ауданы әкімінің 2009 жылғы 9 қаңтардағы № 2 шешімі. Батыс Қазақстан облысы Бөрлі ауданы әділет басқармасында 2009 жылғы 11 ақпанда № 7-3-73 тіркелді. Күші жойылды - Батыс Қазақстан облысы Бөрлі ауданы әкімінің 2009 жылғы 25 желтоқсандағы № 51 шешімімен
