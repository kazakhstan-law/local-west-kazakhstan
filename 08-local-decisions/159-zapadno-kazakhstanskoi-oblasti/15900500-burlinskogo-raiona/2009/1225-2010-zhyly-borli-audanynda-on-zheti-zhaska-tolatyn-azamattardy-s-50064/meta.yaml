act_code: '50064'
requisite: Батыс Қазақстан облысы Бөрлі ауданы әкімінің 2009 жылғы 25 желтоқсандағы № 51 шешімі. Батыс Қазақстан облысы Бөрлі ауданы әділет басқармасында 2010 жылғы 18 қаңтарда № 7-3-88 тіркелді. Күші жойылды - Батыс Қазақстан облысы Бөрлі ауданы әкімінің 2010 жылғы 19 мамырдағы № 26 шешімімен
