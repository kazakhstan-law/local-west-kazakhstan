title:
  rus: Об определении специализированных мест для организации и проведения мирных собраний, порядка их использования, норм их предельной заполняемости, требований к их материально-техническому и организационному обеспечению, границ прилегающих территорий, в которых запрещено проведение пикетирования по Бурлинскому району
  kaz: Бөрлі ауданы бойынша бейбіт жиналыстарды ұйымдастыру және өткізу үшін арнайы орындарды, оларды пайдалану тәртібі, шекті толтырылу нормалары, олардың материалдық-техникалық және ұйымдастырушылық қамтамасыз етуге қойылатын талаптары, пикет жүргізуге тыйым салынған іргелес аумақтардың шекараларын айқындау туралы
