  title:
    rus: О внесении изменений в решение Бурлинского районного маслихата от 4 августа 2020 года №52-1 «Об определении специализированных мест для организации и проведения мирных собраний, порядка их использования, норм их предельной заполняемости, требований к их материально-техническому и организационному обеспечению, границ прилегающих территорий, в которых запрещено проведение пикетирования по Бурлинскому району»
    kaz: Бөрлі аудандық мәслихатының 2020 жылғы 4 тамыздағы №52-1 «Бөрлі ауданы бойынша бейбіт жиналыстарды ұйымдастыру және өткізу үшін арнайы орындарды, оларды пайдалану тәртібі, шекті толтырылу нормалары, олардың материалдық-техникалық және ұйымдастырушылық қамтамасыз етуге қойылатын талаптары, пикет жүргізуге тыйым салынған іргелес аумақтардың шекараларын айқындау  туралы» шешіміне өзгерістер енгізу туралы
