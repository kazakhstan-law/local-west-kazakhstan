  title:
    rus: О внесении изменений в решение Бурлинского районного маслихата от 22 декабря 2020 года №57-2 «Об утверждении Правил оказания социальной помощи, установления размеров и определения перечня отдельных категорий нуждающихся граждан Бурлинского района»
    kaz: Бөрлі аудандық мәслихатының 2020 жылғы 22 желтоқсандағы №57-2 «Бөрлі ауданының әлеуметтік көмек көрсету, оның мөлшерлерін белгілеу және мұқтаж азаматтардың жекелеген санаттарының тізбесін айқындау қағидаларын бекіту туралы» шешіміне өзгерістер енгізу туралы
