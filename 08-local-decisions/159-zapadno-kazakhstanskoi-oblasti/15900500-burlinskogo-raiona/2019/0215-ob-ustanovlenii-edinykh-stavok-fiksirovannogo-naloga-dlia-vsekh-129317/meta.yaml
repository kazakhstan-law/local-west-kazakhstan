requisite: Решение Бурлинского районного маслихата Западно-Казахстанской области от 15 февраля 2019 года № 35-3. Зарегистрировано Департаментом юстиции Западно-Казахстанской области 20 февраля 2019 года № 5543. Утратило силу решением Бурлинского районного маслихата Западно-Казахстанской области от 6 июня 2024 года № 15-6 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: Об установлении единых ставок фиксированного налога для всех налогоплательщиков, осуществляющих деятельность на территории Бурлинского района
