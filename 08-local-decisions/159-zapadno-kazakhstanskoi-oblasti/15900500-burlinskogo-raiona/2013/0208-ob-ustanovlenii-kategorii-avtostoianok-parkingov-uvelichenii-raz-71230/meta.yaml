act_code: '71230'
requisite: Решение Бурлинского районного маслихата Западно-Казахстанской области от 8 февраля 2013 года № 9-2. Зарегистрировано Департаментом юстиции Западно-Казахстанской области 4 марта 2013 года № 3194. Утратило силу решением Бурлинского районного маслихата Западно-Казахстанской области от 13 апреля 2018 года № 23-9
title:
  rus: Об установлении категории автостоянок (паркингов), увеличений размеров базовых ставок налога на земли, выделенные под автостоянки (паркинги) и единых ставок фиксированного налога в Бурлинском районе
  kaz: Бөрлі ауданында автотұрақтардың (паркингтердің) санаттарын белгілеу, автотұрақтар (паркингтер) үшін бөлінген жерлерге базалық салық ставкаларының мөлшерін ұлғайту және бірыңғай тіркелген салық ставкаларын белгілеу туралы
