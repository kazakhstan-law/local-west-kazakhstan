    kaz: Бөрлі аудандық мәслихатының 2013 жылғы 24 желтоқсандағы № 17-3 «Бөрлі ауданының әлеуметтік көмек көрсету, оның мөлшерлерін белгілеу және мұқтаж азаматтардың жекелеген санаттарының тізбесін айқындау қағидасын бекіту туралы» шешіміне өзгерістер енгізу туралы
