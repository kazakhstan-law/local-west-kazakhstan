  title:
    rus: О внесении изменения в решение Бурлинского районного маслихата от 24 декабря 2013 года №17-3 «Об утверждении Правил оказания социальной помощи, установления размеров и определения перечня отдельных категорий нуждающихся граждан Бурлинского района»
    kaz: Бөрлі аудандық мәслихатының 2013 жылғы 24 желтоқсандағы №17-3 «Бөрлі ауданының әлеуметтік көмек көрсету, оның мөлшерлерін белгілеу және мұқтаж азаматтардың жекелеген санаттарының тізбесін айқындау қағидасын бекіту туралы» шешіміне өзгеріс енгізу туралы
