requisite: Решение Бурлинского районного маслихата Западно-Казахстанской области от 27 февраля 2014 года № 18-6. Зарегистрировано Департаментом юстиции Западно-Казахстанской области 2 апреля 2014 года № 3474. Утратило силу решением Бурлинского районного маслихата Западно-Казахстанской области от 29 апреля 2022 года № 17-17 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: Об утверждении Правил о порядке проведения раздельных сходов местного сообщества и определения количества представителей жителей села, улицы, многоквартирного жилого дома для участия в сходе местного сообщества на территории Бурлинского района
  kaz: Бөрлі ауданының аумағында бөлек жергiлiктi қоғамдастық жиындарын өткiзу және жергiлiктi қоғамдастық жиынына қатысу үшiн ауыл, көше, көппәтерлi тұрғын үй тұрғындары өкiлдерiнiң санын айқындау тәртiбi туралы қағидасын бекiту туралы
