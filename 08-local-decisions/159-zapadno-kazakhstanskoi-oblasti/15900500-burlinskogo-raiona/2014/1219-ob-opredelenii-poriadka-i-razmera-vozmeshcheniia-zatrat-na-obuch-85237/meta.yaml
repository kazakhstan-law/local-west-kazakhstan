requisite: Решение Бурлинского районного маслихата Западно-Казахстанской области от 19 декабря 2014 года № 23-4. Зарегистрировано Департаментом юстиции Западно-Казахстанской области 24 декабря 2014 года № 3728. Утратило силу решением Бурлинского районного маслихата Западно-Казахстанской области от 22 декабря 2023 года № 9-3 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: Об определении порядка и размера возмещения затрат на обучение на дому детей с ограниченными возможностями из числа детей с инвалидностью по индивидуальному учебному плану
  kaz: Жеке оқыту жоспары бойынша мүгедектігі бар балалар қатарындағы кемтар балаларды үйде оқытуға жұмсалған шығындарды өтеу тәртібі мен мөлшерін айқындау туралы
