  title:
    rus: О внесении изменений и дополнения в решение Бурлинского районного маслихата от 19 декабря 2014 года № 23-4 «Об определении порядка и размера возмещения затрат на обучение на дому детей с ограниченными возможностями из числа инвалидов по индивидуальному учебному плану»
    kaz: Бөрлі аудандық мәслихатының 2014 жылғы 19 желтоқсандағы № 23-4 «Мүгедектер қатарындағы кемтар балаларды жеке оқыту жоспары бойынша үйде оқытуға жұмсаған шығындарын өндіріп алу тәртібі мен мөлшерін айқындау туралы» шешіміне өзгерістер мен толықтыру енгізу туралы
