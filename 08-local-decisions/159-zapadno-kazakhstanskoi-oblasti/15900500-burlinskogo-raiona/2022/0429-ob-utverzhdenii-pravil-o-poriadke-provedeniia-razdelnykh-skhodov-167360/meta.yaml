requisite: Решение Бурлинского районного маслихата Западно-Казахстанской области от 29 апреля 2022 года № 17-17. Утратило силу решением Бурлинского районного маслихата Западно-Казахстанской области от 16 октября 2023 года № 7-6 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: Об утверждении Правил о порядке проведения раздельных сходов местного сообщества и определения количества представителей жителей села, улицы, многоквартирного жилого дома для участия в сходе местного сообщества на территории Бурлинского района
  kaz: Бөрлі ауданының аумағында бөлек жергілікті қоғамдастық жиындарын өткізу және жергілікті қоғамдастық жиынына қатысу үшін ауыл, көше, көппәтерлі тұрғын үй тұрғындары өкілдерінің санын айқындау тәртібі туралы қағидасын бекіту туралы
