act_code: '127430'
requisite: Решение Бурлинского районного маслихата Западно-Казахстанской области от 19 декабря 2018 года № 32-8. Зарегистрировано Департаментом юстиции Западно-Казахстанской области 21 декабря 2018 года № 5448
title:
  rus: Об установлении категории автостоянок (паркингов), увеличений размеров базовых ставок налога на земли, выделенные под автостоянки (паркинги), определении близлежащего населенного пункта, базовые ставки на земли которого будут применяться при начислении налога по Бурлинскому району
  kaz: Бөрлі ауданы бойынша автотұрақтардың (паркингтердің) санаттарын белгілеу, автотұрақтар (паркингтер) үшін бөлінген жерлерге базалық салық мөлшерлемелерінің мөлшерін ұлғайту, салықты есептеу кезінде жеріне базалық мөлшерлемелер қолданылатын жақын орналасқан елді мекенді айқындау туралы
