act_code: '41396'
requisite: Батыс Қазақстан облысы Бөрлі аудандық мәслихаттың 2008 жылғы 14 тамыздағы № 7-8 шешімі. Батыс Қазақстан облысы Бөрлі ауданы әділет басқармасында 2008 жылғы 3 қыркүйекте № 7-3-61 тіркелді. Күші жойылды - Батыс Қазақстан облысы Бөрлі аудандық мәслихатының 2010 жылғы 29 қаңтардағы № 17-5 шешімімен
