act_code: '43861'
requisite: Батыс Қазақстан облысы Бөрлі аудандық мәслихаттың 2008 жылғы 25 желтоқсандағы № 9-5 шешімі. Батыс Қазақстан облысы Бөрлі ауданы әділет басқармасында 2009 жылғы 29 қаңтарда № 7-3-72 тіркелді. Күші жойылды - Батыс Қазақстан облысы Бөрлі аудандық мәслихатының 2009 жылғы 25 желтоқсандағы № 16-4 шешімімен
