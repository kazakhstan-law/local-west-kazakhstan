requisite: Батыс Қазақстан облысы Бөрлі аудандық мәслихаттың 2008 жылғы 14 тамыздағы № 7-6 шешімі. Батыс Қазақстан облысы Бөрлі ауданы әділет басқармасында 2008 жылғы 19 қыркүйекте № 7-3-62 тіркелді. Күші жойылды - Батыс Қазақстан облысы Бөрлі аудандық мәслихаттың 2012 жылғы 18 шілдедегі № 5-9 шешімімен
