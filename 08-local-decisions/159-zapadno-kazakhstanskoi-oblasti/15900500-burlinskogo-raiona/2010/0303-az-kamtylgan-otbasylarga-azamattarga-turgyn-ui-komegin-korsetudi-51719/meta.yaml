requisite: Батыс Қазақстан облысы Бөрлі аудандық мәслихатының 2010 жылғы 3 наурыздағы № 18-10 шешімі. Батыс Қазақстан облысы Бөрлі ауданы әділет басқармасында 2010 жылғы 9 сәуірде № 7-3-92 тіркелді. Күші жойылды - Батыс Қазақстан облысы Бөрлі аудандық мәслихатының 2010 жылғы 11 тамыздағы № 21-5 шешімімен
