  title:
    rus: О внесении изменений в решение Бурлинского районного маслихата от 19 июля 2012 года № 5-5 «Об определении категории граждан, расходы которых по арендной плате за пользование жилищем в частном жилищном фонде и арендных домах возлагаются на местный бюджет»
    kaz: Бөрлі аудандық мәслихатының 2012 жылғы 19 шілдедегі № 5-5 «Жеке тұрғын үй қорындағы және жалға берілген тұрғын үйлердегі тұрғын үйді пайдаланғаны үшін жалдау ақысының шығыстары жергілікті бюджетке жүктелетін азаматтар санатын белгілеу туралы» шешіміне өзгерістер енгізу туралы
