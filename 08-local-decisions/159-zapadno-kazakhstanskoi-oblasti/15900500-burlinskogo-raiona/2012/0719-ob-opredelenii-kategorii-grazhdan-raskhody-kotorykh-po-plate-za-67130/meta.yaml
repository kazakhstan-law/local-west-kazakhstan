title:
  rus: Об определении категории граждан, расходы которых по плате за пользование жилищем в частном жилищном фонде и арендных домах, возлагаются на местный бюджет
  kaz: Жеке тұрғын үй қорындағы және жалға берiлетін үйлердегі тұрғынжайды пайдаланғаны үшiн төлемақы төлеу жөніндегі шығыстар жергілікті бюджетке жүктелетін азаматтар санатын айқындау туралы
