    kaz: Мәслихаттың 2021 жылғы 22 қыркүйектегі № 8-4 «Орал қаласы бойынша мүгедектер қатарындағы кемтар балаларды жеке оқыту жоспары бойынша үйде оқытуға жұмсаған шығындарын өндіріп алу тәртібі және мөлшерін айқындау туралы» шешіміне өзгерістер енгізу туралы
