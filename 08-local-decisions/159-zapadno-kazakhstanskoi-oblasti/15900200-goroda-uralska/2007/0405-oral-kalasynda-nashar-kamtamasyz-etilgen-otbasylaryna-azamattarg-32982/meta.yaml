act_code: '32982'
requisite: Батыс Қазақстан облысы Орал қалалық мәслихаттың 2007 жылғы 5 сәуірдегі № 43-6 шешімі. Батыс Қазақстан облысы Орал қаласының әділет басқармасында 2007 жылғы 24 сәуірде № 7-1-67 тіркелді. Күші жойылды - Батыс Қазақстан облысы Орал қалалық мәслихаттың 2010 жылғы 12 наурыздағы № 27-12 шешімімен
