act_code: '145502'
requisite: Решение Уральского городского маслихата Западно-Казахстанской области от 14 августа 2020 года № 49-2. Зарегистрировано Департаментом юстиции Западно-Казахстанской области 14 августа 2020 года № 6341
title:
  rus: Об определении специализированных мест для организации и проведения мирных собраний, порядка их использования, норм их предельной заполняемости, требований к их материально-техническому и организационному обеспечению, границ прилегающих территорий, в которых запрещено проведение пикетирования в городе Уральск
  kaz: Орал қаласында бейбіт жиналыстарды ұйымдастыру және өткізу үшін арнайы орындарды, оларды пайдалану тәртібі, шекті толтырылу нормалары, олардың материалдық-техникалық және ұйымдастырушылық қамтамасыз етуге қойылатын талаптары, пикеттеуді өткізуге тыйым салынған іргелес аумақтардың шекараларын айқындау туралы
