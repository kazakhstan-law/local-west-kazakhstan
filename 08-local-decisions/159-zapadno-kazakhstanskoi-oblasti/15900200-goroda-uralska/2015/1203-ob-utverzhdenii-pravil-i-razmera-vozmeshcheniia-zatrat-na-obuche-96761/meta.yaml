  title:
    rus: О внесении изменений в решение Уральского городского маслихата от 3 декабря 2015 года №39-4 «Об утверждении Правил и размера возмещения затрат на обучение на дому детей с ограниченными возможностями из числа инвалидов по индивидуальному учебному плану»
    kaz: Орал қалалық мәслихатының 2015 жылғы 3 желтоқсандағы № 39-4 «Мүгедектер қатарындағы кемтар балаларды жеке оқыту жоспары бойынша үйде оқытуға жұмсаған шығындарын өндіріп алу қағидасы мен мөлшерін бекіту туралы» шешіміне өзгерістер енгізу туралы
