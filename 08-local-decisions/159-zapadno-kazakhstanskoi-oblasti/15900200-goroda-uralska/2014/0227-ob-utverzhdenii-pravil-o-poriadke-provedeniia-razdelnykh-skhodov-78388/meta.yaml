requisite: Решение Уральского городского маслихата Западно-Казахстанской области от 27 февраля 2014 года № 20-3. Зарегистрировано Департаментом юстиции Западно-Казахстанской области 2 апреля 2014 года № 3472. Утратило силу решением Уральского городского маслихата Западно-Казахстанской области от 20 сентября 2023 года № 5-9 (вводится в действие по истечении десяти календарных дней после дня первого официального опубликования)
title:
  rus: Об утверждении Правил о порядке проведения раздельных сходов местного сообщества и определения количества представителей жителей села, улицы, многоквартирного жилого дома для участия в сходе местного сообщества на территории города Уральск
  kaz: Орал қаласының аумағында жергiлiктi қоғамдастық бөлек жиындарын өткiзу және жергiлiктi қоғамдастық жиынына қатысу үшiн ауыл, көше, көппәтерлi тұрғын үй тұрғындары өкiлдерiнiң санын айқындау тәртiбi туралы қағидаларын бекiту туралы
