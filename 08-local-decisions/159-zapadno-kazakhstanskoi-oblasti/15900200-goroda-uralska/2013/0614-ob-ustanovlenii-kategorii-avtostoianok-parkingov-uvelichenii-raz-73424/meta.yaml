requisite: Решение Уральского городского маслихата Западно-Казахстанской области от 14 июня 2013 года № 14-9. Зарегистрировано Департаментом юстиции Западно-Казахстанской области 12 июля 2013 года № 3306. Утратило силу решением Уральского городского маслихата Западно-Казахстанской области от 14 декабря 2018 года № 27-7
title:
  rus: Об установлении категории автостоянок (паркингов), увеличений размеров базовых ставок налога на земли, выделенные под автостоянки (паркинги) и единых ставок фиксированного налога в городе Уральск
  kaz: Орал қаласында автотұрақтардың (паркингтердің) санаттарын белгілеу, автотұрақтар (паркингтер) үшін бөлінген жерлерге базалық салық ставкаларының мөлшерін ұлғайту және бірыңғай тіркелген салық ставкаларын белгілеу туралы
