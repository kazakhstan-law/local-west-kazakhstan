requisite: Батыс Қазақстан облысы Орал қаласы әкімдігінің 2008 жылғы 10 сәуірдегі № 993 қаулысы. Батыс Қазақстан облысы Орал қаласының Әділет басқармасында 2008 жылғы 21 мамырда № 7-1-89 тіркелді. Күші жойылды - Батыс Қазақстан облысы Орал қаласы әкімдігінің 2010 жылғы 16 қыркүйектегі № 2201 қаулысымен
