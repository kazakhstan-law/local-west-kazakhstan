requisite: Батыс Қазақстан облысы Орал қаласы әкімдігінің 2008 жылғы 10 желтоқсандағы № 156 шешімі. Батыс Қазақстан облысы Орал қаласының Әділет басқармасында 2008 жылғы 24 желтоқсанда № 7-1-119 тіркелді. Күші жойылды - Батыс Қазақстан облысы Орал қаласы әкімінің 2009 жылғы 10 cәуірдегі № 48 шешімімен
