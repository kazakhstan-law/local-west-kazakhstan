requisite: Батыс Қазақстан облысы Орал қаласы әкімінің 2009 жылғы 7 желтоқсандағы № 190 шешімі. Батыс Қазақстан облысы Орал қаласының Әділет басқармасында 2009 жылғы 23 желтоқсанда № 7-1-159 тіркелді. Күші жойылды - Батыс Қазақстан облысы Орал қаласы әкімінің 2011 жылғы 16 ақпандағы № 11 шешімімен
