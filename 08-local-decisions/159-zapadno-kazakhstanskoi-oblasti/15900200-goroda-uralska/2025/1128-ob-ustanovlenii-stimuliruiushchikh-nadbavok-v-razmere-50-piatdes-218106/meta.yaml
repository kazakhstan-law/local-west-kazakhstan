act_code: '218106'
requisite: Решение Уральского городского маслихата Западно-Казахстанской области от 28 ноября 2025 года № 24-10
title:
  rus: Об установлении стимулирующих надбавок в размере 50 (пятьдесят) процентов к должностным окладам работников коммунального государственного учреждения «Информационно - аналитический и ресурсный центр по работе с молодежью города Уральск» отдела внутренней политики акимата города Уральск
  kaz: Орал қаласы әкімдігінің ішкі саясат бөліміне қарасты «Орал қаласының ақпараттық-талдау және жастармен жұмыс жөніндегі ресурстық орталығы» коммуналдық мемлекеттік мекемесі қызметкерлерінің лауазымдық айлықақыларына 50 (елу) пайыз көлемінде ынталандырушы үстемақылар белгілеудің тәртібі мен шарттарын белгілеу туралы
