requisite: Решение Уральского городского маслихата Западно-Казахстанской области от 24 мая 2024 года № 11-10
title:
  rus: Об утверждении порядка проведения раздельных сходов местного сообщества и определения количества представителей жителей села, микрорайона, улицы, многоквартирного жилого дома для участия в сходе местного сообщества на территории города Уральск
  kaz: Орал қаласының аумағындағы жергiлiктi қоғамдастықтың бөлек жиындарын өткiзудің және жергiлiктi қоғамдастық жиынына қатысу үшiн ауыл, шағын аудан, көше, көппәтерлi тұрғын үй тұрғындары өкiлдерiнiң санын айқындау тәртібін бекiту туралы
