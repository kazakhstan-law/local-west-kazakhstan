requisite: Решение акима Западно-Казахстанской области от 13 января 2004 года № 1. Зарегистрировано Департаментом юстиции Западно-Казахстанской области 27 января 2004 года № 2430. Утратило силу постановлением акимата Западно-Казахстанской области от 21 декабря 2005 года № 438
title:
  rus: О составе формирований сил и средств Гражданской обороны и чрезвычайных ситуаций для проведения действий по ликвидации последствий возможного разрушительного землетрясения в городе Алматы и Алматинской области
  kaz: Алматы қаласында және Алматы облысында болуы мүмкін қиратушы жер сілкіністері зардаптарын жою жөніндегі жұмыстарды жүргізу үшін Азаматтық қорғаныс және төтенше жағдайлар күштері мен құралдары құрылымдарының құрамы туралы
