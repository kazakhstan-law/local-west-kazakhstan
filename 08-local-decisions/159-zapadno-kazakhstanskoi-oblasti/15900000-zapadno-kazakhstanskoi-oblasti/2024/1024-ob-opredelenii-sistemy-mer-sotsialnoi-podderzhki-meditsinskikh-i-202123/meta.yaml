requisite: Решение Западно-Казахстанского областного маслихата от 24 октября 2024 года № 15-4. Зарегистрирован в Департаменте юстиции Западно-Казахстанской области 30 октября 2024 года № 7440-07
title:
  rus: Об определении системы мер социальной поддержки медицинских и фармацевтических работников, направленных для работы в сельской местности и поселки, города районного и областного значения Западно-Казахстанской области, а также порядка и размера оказания им социальной поддержки за счет бюджетных средств
  kaz: Батыс Қазақстан облысының ауылдық жерге және кенттерге, аудандық және облыстық маңызы бар қалаларға жұмысқа жіберілген медицина және фармацевтика қызметкерлерін әлеуметтік қолдау шараларының жүйесін, сондай-ақ оларға бюджет қаражаты есебінен әлеуметтік қолдау көрсету тәртібі мен мөлшерін айқындау туралы
