act_code: '15370'
requisite: Решение Западно-Казахстанского областного маслихата от 11 февраля 2003 года № 29-1. Зарегистрировано Управлением юстиции Западно-Казахстанской области 3 марта 2003 года № 2002. Утратило силу решением Западно-Казахстанского областного маслихата от 18 февраля 2006 года № 25-2
title:
  rus: О состоянии и мерах по усилению борьбы с бедностью, безработицей и совершенствованию форм и методов оказания адресной социальной помощи нуждающимся. Об утверждении областной Программы по снижению бедности на 2003-2005 годы и плана мероприятий по ее выполнению
  kaz: Жұмыссыздық пен кедейшіліктің жағдайы мен оған қарсы кұресті күшейту шаралары және мұқтаждарға атаулы элеуметтік көмекті көрсетудің әдістерін жетілдіру туралы. Облыстық кедейшілікті азайту жөніндегі 2003-2005 жылдарға арналған бағдарламаны бекіту туралы
