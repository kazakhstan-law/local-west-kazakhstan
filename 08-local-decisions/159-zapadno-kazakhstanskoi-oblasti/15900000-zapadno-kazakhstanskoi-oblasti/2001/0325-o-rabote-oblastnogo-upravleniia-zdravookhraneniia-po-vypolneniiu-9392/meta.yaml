requisite: Решение Западно-Казахстанского областного маслихата от 25 марта 2001 года № 10-2. Зарегистрировано Управлением юстиции Западно-Казахстанской области 8 мая 2001 года № 833. Утратило силу решением Западно-Казахстанского областного маслихата от 29 мая 2004 года № 8-18
title:
  rus: О работе областного управления здравоохранения по выполнению Закона «Об охране здоровья граждан Республики Казахстан». Утверждение комплексной программы «Охрана здоровья населения Западно-Казахстанской области на 2001-2005 годы» и плана мероприятий по ее выполнению
  kaz: Облыстық денсаулық сақта басқармасының «Қазақстан Республикасы азаматтарының денсаулығын қорғау туралы» Заңды орындау барысы туралы. «2001-2205 жылдары Батыс Қазақстан облысы халқының денсаулығын қорғау» кешенді бағдарламасы және оны орындау жөніндегі шаралар жоспарын бекіту
