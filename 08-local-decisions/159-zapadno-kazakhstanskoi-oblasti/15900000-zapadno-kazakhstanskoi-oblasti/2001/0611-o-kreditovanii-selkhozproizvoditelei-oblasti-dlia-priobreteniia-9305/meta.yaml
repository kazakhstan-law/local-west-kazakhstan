act_code: '9305'
requisite: Решение акима Западно-Казахстанской области от 12 июня 2001 года № 144. Зарегистрировано Управлением юстиции Западно-Казахстанской области 20 июня 2001 года № 907. Утратило силу решением акима Западно-Казахстанской области от 16 января 2002 года № 9
title:
  rus: О кредитовании сельхозпроизводителей области для приобретения горюче-смазочных материалов, семян, удобрений гербицидов, запасных частей для сельскохозяйственных машин, аренды или покупки сельскохозяйственной техники, на проведение уборочных работ 2001 г.
  kaz: 2001 жылдың егін орағын өткізу үшін облысқа керекті жану-жағар майларын тұқым, тыңайтқыш, гербицид, ауыл шаруашылығы машиналары үшін керекті бөлшектерді, жерді арендаға пайдалану және ауыл шаруашылығы техникаларын сатып алуға ауыл шаруашылығы тауар өндірушілеріне несие беру туралы
