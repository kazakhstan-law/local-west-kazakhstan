act_code: '226077'
requisite: Решение Западно-Казахстанского областного маслихата от 4 июня 2026 года № 25-5
title:
  rus: Об установлении стимулирующих надбавок в размере 50 (пятьдесят) процентов к должностным окладам работников государственного коммунального казенного предприятия «Западно-Казахстанская областная академическая филармония имени Г.Курмангалиева управления культуры, развития языков и архивного дела акимата Западно-Казахстанской области»
  kaz: «Батыс Қазақстан облысының әкімдігі мәдениет, тілдерді дамыту және архив ісі басқармасының Ғ.Құрманғалиев атындағы Батыс Қазақстан облыстық академиялық филармониясы» мемлекеттік коммуналдық қазыналық кәсіпорны қызметкерлерінің лауазымдық жалақыларына 50 (елу) пайыз мөлшерінде ынталандырушы үстемақылар белгілеу туралы
