title:
  rus: Об утверждении размера платы за один кубический метр питьевой воды, поданной из систем водоснабжения, включенных в перечень систем водоснабжения Западно-Казахстанской области, стоимость услуг по подаче питьевой воды которых подлежит субсидированию
  kaz: Батыс Қазақстан облысы бойынша ауызсуды беру жөніндегі қызметтердің құны субсидиялауға жататын сумен жабдықтау жүйелерінің тізбесіне енгізілген сумен жабдықтау жүйелерінен берілген ауызсудың бір текше метріне төлемақы мөлшерін бекіту туралы
