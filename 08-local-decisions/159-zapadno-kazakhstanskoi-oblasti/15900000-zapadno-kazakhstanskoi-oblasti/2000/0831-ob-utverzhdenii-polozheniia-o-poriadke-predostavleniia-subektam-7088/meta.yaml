requisite: Решение акима Западно-Казахстанской области от 1 сентября 2000 года № 164. Зарегистрировано Управлением юстиции Западно-Казахстанской области 1 сентября 2000 года № 489. Утратило силу постановлением акимата Западно-Казахстанской области от 19 февраля 2007 года № 28
title:
  rus: Об утверждении Положения о порядке предоставления субъектам малого предпринимательства в аренду или доверительное управление с правом последующей передачи в собственность неиспользуемых производственных (офисных) помещений и объектов коммунальной собственности на основании представленной ими информации и Правил предоставления в аренду объектов коммунальной собственности
  kaz: Шағын кәсіпкерлік субъектілеріне олардың берген ақпараты негізінде коммуналдық меншік объектілерін және бос тұрған өңдірістік (офистік) ғимараттарды кейіннен меншігіне беру құқығымен жалға немесе сенімді басқаруға берудің тәртібі туралы Ережені және коммуналдық меншік объектілерін жалға берудің Ережесін бекіту туралы
