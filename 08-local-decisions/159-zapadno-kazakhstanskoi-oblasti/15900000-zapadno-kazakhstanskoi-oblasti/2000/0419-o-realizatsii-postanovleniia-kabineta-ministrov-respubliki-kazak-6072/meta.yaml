requisite: Решение акима Западно-Казахстанской области от 20 апреля 2000 года № 86. Зарегистрировано Управлением юстиции Западно-Казахстанской области 3 мая 2000 года № 279. Утратило силу постановлением акимата Западно-Казахстанской области от 21 февраля 2005 года № 59
title:
  rus: О реализации постановления Кабинета Министров Республики Казахстан от 22.04.94г. N 430 "О порядке организации Государственной противопожарной службы Агентства Республики Казахстан по чрезвычайным ситуациям" с дополнениями и изменениями, внесенными постановлением Правительства Республики Казахстан от 22.05.95г. N 616, и организации пожаротушения в сельской местности
  kaz: Қазақстан Республикасы Министрлер кабинетінің "Қазақстан Республикасының төтенше жағдайлар жөніндегі Мемлекеттік өртке қарсы қызмет комитетін ұйымдастырудың тәртібі туралы" 1994 жылғы 22 сәуірдегі қаулысын, Қазақстан Республикасы Үкіметінің 1999 жылғы 22 мамырдағы N 616 қаулысының қосымшаларымен және өзгерістермен іске асыру және ауылдық жерлерде өрт сөндіруді ұйымдастыру туралы
