title:
  rus: Об установления стимулирующих надбавок в размере 50 (пятидесяти) процентов к должностным окладам сотрудников коммунального государственного учреждения «Областной методический Центр психологической поддержки», подведомственного управлению образования акимата Западно-Казахстанской области
  kaz: Батыс Қазақстан облысы әкімдігі білім басқармасының «Облыстық әдістемелік психологиялық қолдау көрсету орталығы» коммуналдық мемлекеттік мекемесі қызметкерлерінің лауазымдық айлықақыларына 50 (елу) пайыз мөлшерінде ынталандырушы үстемеақылар белгілеу туралы
