title:
  rus: Об установлении стимулирующих надбавок в размере 100 (сто) процентов к должностным окладам работников коммунального государственного учреждения «Батысирригация» Управления природных ресурсов и регулирования природопользования акимата Западно-Казахстанской области
  kaz: Батыс Қазақстан облысы әкімдігі табиғи ресурстар және табиғат пайдалануды реттеу басқармасының «Батысирригация» коммуналдық мемлекеттік мекемесі қызметкерлерінің лауазымдық айлықақыларына 100 (жүз) пайыз мөлшерінде ынталандырушы үстемеақылар белгілеу туралы
