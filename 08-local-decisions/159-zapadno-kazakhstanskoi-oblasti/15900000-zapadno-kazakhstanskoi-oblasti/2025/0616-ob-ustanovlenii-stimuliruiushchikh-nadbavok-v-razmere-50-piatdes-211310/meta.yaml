title:
  rus: Об установлении стимулирующих надбавок в размере 50 (пятьдесят) процентов к должностным окладам работников коммунальных государственных учреждений подведомственных организаций управления общественного развития акимата Западно-Казахстанской области
  kaz: Батыс Қазақстан облысының әкімдігі қоғамдық даму басқармасына қарасты коммуналдық мемлекеттік мекемелері қызметкерлерінің лауазымдық айлықақыларына 50 (елу) пайыз көлемінде ынталандырушы үстемақылар белгілеу туралы
