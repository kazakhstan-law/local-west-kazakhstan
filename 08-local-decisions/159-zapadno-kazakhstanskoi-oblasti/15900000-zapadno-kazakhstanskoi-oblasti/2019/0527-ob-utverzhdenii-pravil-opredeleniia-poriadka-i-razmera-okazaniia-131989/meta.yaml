title:
  rus: Об утверждении Правил определения порядка и размера оказания социальной поддержки медицинским и фармацевтическим работникам, направленным для работы в сельскую местность Западно-Казахстанской области за счет бюджетных средств
  kaz: Батыс Қазақстан облысының ауылдық жерiне жұмысқа жiберiлген медицина және фармацевтика қызметкерлерiне бюджет қаражаты есебінен әлеуметтiк қолдау көрсетудің тәртібі мен мөлшерін айқындау қағидасын бекіту туралы
