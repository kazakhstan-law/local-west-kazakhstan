  title:
    rus: О внесении изменения в решение Западно-Казахстанского областного маслихата от 27 мая  2019  года №25-7 «Об утверждении Правил определения порядка и размера оказания социальной поддержки медицинским и фармацевтическим работникам, направленным для работы в сельскую местность Западно-Казахстанской области за счет бюджетных средств»
    kaz: Батыс Қазақстан облыстық мәслихатының 2019 жылғы 27 мамырдағы № 25-7 «Батыс Қазақстан облысының ауылдық жерiне жұмысқа жiберiлген медицина және фармацевтика қызметкерлерiне бюджет қаражаты есебінен әлеуметтiк қолдау көрсетудің тәртібі мен мөлшерін айқындау қағидасын бекіту туралы» шешіміне өзгеріс енгізу туралы
