  title:
    rus: О внесении изменения в решение Западно-Казахстанского областного маслихата от 23 декабря 2020 года № 40-11 «Об утверждении Правил определения порядка и размера оказания социальной поддержки медицинским и фармацевтическим работникам, направленным для работы в сельскую местность и поселок, города районного и областного значения Западно-Казахстанской области за счет бюджетных средств»
    kaz: Батыс Қазақстан облыстық мәслихатының «Батыс Қазақстан облысының ауылдық жерге және кенттерге, аудандық және облыстық маңызы бар қалаларға жұмысқа жіберілген медицина және фармацевтика қызметкерлеріне бюджет қаражаты есебінен әлеуметтiк қолдау көрсетудің тәртібі мен мөлшерін айқындау қағидасын бекіту туралы» 2020 жылғы 23 желтоқсандағы № 40-11 шешіміне өзгеріс енгізу туралы
