  title:
    rus: О внесении изменений и дополнения в решение Западно-Казахстанского областного маслихата от 30 сентября 2020 года № 38-3 «О дополнительном предоставлении гарантированного объема бесплатной медицинской помощи, в том числе лекарственных средств, специализированных лечебных продуктов, медицинских изделий, отдельным категориям граждан Западно-Казахстанской области при амбулаторном лечении бесплатно»
    kaz: Батыс Қазақстан облыстық мәслихатының 2020 жылғы 30 қыркүйектегі № 38-3 «Азаматтардың жекелеген санаттарына амбулаториялық емделу кезінде тегін және жеңілдікті шарттармен дәрілік заттар, медициналық бұйымдар және мамандандырылған емдік өнімдерді қосымша беру туралы» шешіміне өзгерістер мен толықтыру енгізу туралы
