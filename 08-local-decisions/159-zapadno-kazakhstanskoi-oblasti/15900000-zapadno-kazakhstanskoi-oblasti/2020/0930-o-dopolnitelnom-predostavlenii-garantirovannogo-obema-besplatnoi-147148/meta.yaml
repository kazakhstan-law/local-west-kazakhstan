  title:
    rus: О внесении изменений и дополнений в решение Западно-Казахстанского областного маслихата от 30 сентября 2020 года № 38-3 «О дополнительном предоставлении лекарственных средств, медицинских изделий и специализированных лечебных продуктов отдельным категориям граждан при амбулаторном лечении бесплатно и на льготных условиях»
    kaz: Батыс Қазақстан облыстық мәслихатының 2020 жылғы 30 қыркүйектегі № 38-3 «Азаматтардың жекелеген санаттарына амбулаториялық емделу кезінде тегін және жеңілдікті шарттармен дәрілік заттар, медициналық бұйымдар және мамандандырылған емдік өнімдерді қосымша беру туралы» шешіміне өзгерістер пен толықтырулар енгізу туралы
