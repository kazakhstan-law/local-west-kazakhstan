  title:
    rus: О внесении дополнений в решение Западно-Казахстанского областного маслихата от 30 сентября 2020 года № 38-3 «О дополнительном предоставлении гарантированного объема бесплатной медицинской помощи, в том числе лекарственных средств, специализированных лечебных продуктов, медицинских изделий, отдельным категориям граждан Западно-Казахстанской области при амбулаторном лечении бесплатно»
    kaz: Батыс Қазақстан облыстық мәслихатының 2020 жылғы 30 қыркүйектегі № 38-3 «Батыс Қазақстан облысы азаматтарының жекелеген санаттарына амбулаториялық емдеу кезінде тегін медициналық көмектің кепілдік берілген көлемін, оның ішінде дәрілік заттарды, арнайы емдік өнімдерді, медициналық бұйымдарды қосымша тегін беру туралы» шешіміне толықтырулар енгізу туралы
