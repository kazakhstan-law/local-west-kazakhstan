title:
  rus: Об утверждении Правил определения порядка и размера оказания социальной поддержки по оплате коммунальных услуг и приобретению топлива за счет бюджетных средств педагогам, осуществляющие профессиональную деятельность в сельском населенном пункте
  kaz: Ауылдық елді мекенде кәсіптік қызметін жүзеге асыратын педагогтерге бюджет қаражаты есебінен коммуналдық көрсетілетін қызметтерге ақы төлеу және отын сатып алу бойынша әлеуметтік қолдау көрсетудің тәртібі мен мөлшерін айқындау қағидасын бекіту туралы
