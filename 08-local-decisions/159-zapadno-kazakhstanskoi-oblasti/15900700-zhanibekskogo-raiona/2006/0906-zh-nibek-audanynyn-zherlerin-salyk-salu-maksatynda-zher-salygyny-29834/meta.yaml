act_code: '29834'
requisite: Батыс Қазақстан облысы Жәнібек аудандық мәслихатының 2006 жылғы 6 қыркүйектегі № 28-3 шешімі. Батыс Қазақстан облысы Жәнібек ауданы әділет басқармасында 2006 жылғы 19 қыркүйекте № 7-6-33 тіркелді. Күші жойылды - Батыс Қазақстан облысы Жәнібек аудандық мәслихатының 2023 жылғы 5 қыркүйектегі № 10-10 (оның алғашқы ресми жарияланған күнінен кейін күнтізбелік он күн өткен соң қолданысқа енгізіледі) шешімімен
title:
