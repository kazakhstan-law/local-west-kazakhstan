requisite: Решение Жанибекского районного маслихата Западно-Казахстанской области от 4 апреля 2018 года № 20-10. Зарегистрировано Департаментом юстиции Западно-Казахстанской области 16 апреля 2018 года № 5160. Утратило силу решением Жанибекского районного маслихата Западно-Казахстанской области от 20 марта 2019 года № 30-2
title:
  rus: О предоставлении подъемного пособия и бюджетного кредита для приобретения или строительства жилья специалистам в области здравоохранения, образования, социального обеспечения, культуры, спорта и агропромышленного комплекса, прибывшим для работы и проживания в сельские населенные пункты Жанибекского района в 2018 году
  kaz: 2018 жылы Жәнібек ауданының ауылдық елді мекендеріне жұмыс істеу және тұру үшін келген денсаулық сақтау, білім беру, әлеуметтік қамсыздандыру, мәдениет, спорт және агроөнеркәсіптік кешен саласындағы мамандарға көтерме жәрдемақы және тұрғын үй сатып алу немесе салу үшін бюджеттік кредит беру туралы
