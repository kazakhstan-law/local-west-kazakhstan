  title:
    rus: О внесении изменения в решение маслихата Жанибекского района от 9 февраля 2021 года №3-1 «Об утверждении Правил оказания социальной помощи, установления размеров и определения перечня отдельных категорий нуждающихся граждан Жанибекского района»
    kaz: Жәнібек аудандық мәслихатының 2021 жылғы 9 ақпандағы №3-1 «Жәнібек ауданының әлеуметтік көмек көрсету, оның мөлшерлерін белгілеу және мұқтаж азаматтардың жекелеген санаттарының тізбесін айқындау қағидаларын бекіту туралы» шешіміне өзгеріс енгізу туралы
