  title:
    rus: О внесении изменений в решение Жанибекского районного маслихата от 9 февраля 2021 года № 3-1 «Об утверждении Правил оказания социальной помощи, установления размеров и определения перечня отдельных категорий нуждающихся граждан Жанибекского района»
    kaz: Жәнібек аудандық мәслихатының 2021 жылғы 9 ақпандағы № 3-1 «Жәнібек ауданының әлеуметтік көмек көрсету, оның мөлшерлерін белгілеу және мұқтаж азаматтардың жекелеген санаттарының тізбесін айқындау қағидаларын бекіту туралы» шешіміне өзгерістер енгізу туралы
