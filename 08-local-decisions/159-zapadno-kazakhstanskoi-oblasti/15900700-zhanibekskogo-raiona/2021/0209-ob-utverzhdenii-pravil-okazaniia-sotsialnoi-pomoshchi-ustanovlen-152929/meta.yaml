act_code: '152929'
requisite: Решение Жанибекского районного маслихата Западно-Казахстанской области от 9 февраля 2021 года № 3-1. Зарегистрировано Департаментом юстиции Западно-Казахстанской области 17 февраля 2021 года № 6824. Утратило силу решением Жанибекского районного маслихата Западно-Казахстанской области от 5 сентября 2023 года № 10-10 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
