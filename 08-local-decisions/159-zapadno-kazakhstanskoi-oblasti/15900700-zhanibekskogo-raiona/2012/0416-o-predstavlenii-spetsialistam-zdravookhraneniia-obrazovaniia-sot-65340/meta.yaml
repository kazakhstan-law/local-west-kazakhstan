act_code: '65340'
requisite: Решение Жанибекского районного маслихата Западно-Казахстанской области от 16 апреля 2012 года № 3-3. Зарегистрировано Департаментом юстиции Западно-Казахстанской области 4 мая 2012 года № 7-6-139. Утратило силу - решением Жанибекского районного маслихата Западно-Казахстанской области от 30 января 2013 года № 10-2
title:
  rus: О представлении специалистам здравоохранения, образования, социального обеспечения, культуры, спорта и ветеринарии, прибывшим для работы и проживания в Жанибекском районе, подъемного пособия и социальной поддержки для приобретения или строительства жилья на 2012 год
  kaz: Жәнібек ауданына жұмыс істеуге және тұруға келген денсаулық сақтау, білім беру, әлеуметтік қамсыздандыру, мәдениет, спорт және ветеринария мамандарына 2012 жылға көтерме жәрдемақы және тұрғын үй алу немесе салу үшін әлеуметтік қолдауды ұсыну туралы
