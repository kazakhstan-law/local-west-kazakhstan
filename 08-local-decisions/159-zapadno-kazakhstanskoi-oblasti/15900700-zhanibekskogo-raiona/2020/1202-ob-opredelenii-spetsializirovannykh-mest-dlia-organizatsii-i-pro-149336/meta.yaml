act_code: '149336'
requisite: Решение Жанибекского районного маслихата Западно-Казахстанской области от 2 декабря 2020 года № 48-12. Зарегистрировано Департаментом юстиции Западно-Казахстанской области 4 декабря 2020 года № 6505
title:
  rus: Об определении специализированных мест для организации и проведения мирных собраний, порядка их использования, норм их предельной заполняемости, требований к их материально-техническому и организационному обеспечению, границ прилегающих территорий, в которых запрещено проведение пикетирования по Жанибекскому району
  kaz: Жәнібек ауданында бейбіт жиналыстарды ұйымдастыру және өткізу үшін арнайы орындарды, оларды пайдалану тәртібін, шекті толтырылу нормаларын, олардың материалдық-техникалық және ұйымдастырушылық қамтамасыз етуге қойылатын талаптарын, пикеттеуді өткізуге тыйым салынған іргелес аумақтардың шекараларын айқындау туралы
