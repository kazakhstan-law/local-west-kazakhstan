requisite: Решение Жанибекского районного маслихата Западно-Казахстанской области от 25 февраля 2020 года № 40-4. Зарегистрировано Департаментом юстиции Западно-Казахстанской области 28 февраля 2020 года № 6065. Утратило силу решением Жанибекского районного маслихата Западно-Казахстанской области от 31 марта 2021 года № 4-3 (вводится в действие со дня первого официального опубликования)
title:
  rus: О предоставлении подъемного пособия и бюджетного кредита на приобретение или строительство жилья специалистам в области здравоохранения, образования, социального обеспечения, культуры, спорта и агропромышленного комплекса, прибывшим для работы и проживания в сельские населенные пункты Жанибекского района в 2020 году
  kaz: 2020 жылға Жәнібек ауданының ауылдық елді мекендеріне жұмыс істеуге және тұруға келген денсаулық сақтау, білім беру, әлеуметтік қамсыздандыру, мәдениет, спорт және агроөнеркәсіптік кешен  саласындағы мамандарға көтерме жәрдемақы және тұрғын үй алу немесе салу үшін бюджеттік кредит беру туралы
