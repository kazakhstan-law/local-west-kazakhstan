act_code: '56777'
requisite: Решение Жанибекского районного маслихата Западно-Казахстанской области от 24 декабря 2010 года № 29-3. Зарегистрировано Управлением юстиции Жанибекского района Западно-Казахстанской области 31 декабря 2010 года № 7-6-116. Утратило силу решением Жанибекского районного маслихата Западно-Казахстанской области от 16 апреля 2012 года № 3-3
title:
  rus: О предоставлении в 2011 году специалистам здравоохранения, образования, социального обеспечения, культуры и спорта, проживающим и работающим в сельской местности Жанибекского района, подъемного пособия и социальной поддержки для приобретения жилья
  kaz: Жәнібек ауданының ауылдық елді мекендерінде жұмыс істейтін және тұратын денсаулық сақтау, білім беру, әлеуметтік қамсыздандыру, мәдениет және спорт мамандарына 2011 жылға көтерме жәрдемақы және тұрғын үй сатып алу үшін әлеуметтік қолдауды ұсыну туралы
