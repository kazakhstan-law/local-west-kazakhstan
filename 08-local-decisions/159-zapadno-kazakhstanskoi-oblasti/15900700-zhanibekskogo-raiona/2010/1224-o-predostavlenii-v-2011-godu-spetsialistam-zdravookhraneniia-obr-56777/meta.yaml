  title:
    rus: О внесении изменений в решение Жанибекского районного маслихата от 24 декабря 2010 года № 29-3 "О предоставлении в 2011 году специалистам здравоохранения, образования, социального обеспечения, культуры и спорта, проживающим и работающим в сельской местности Жанибекского района, подъемного пособия и социальной поддержки для приобретения жилья"
    kaz: Жәнібек аудандық мәслихаттың 2010 жылғы 24 желтоқсандағы № 29-3 "Жәнібек ауданының ауылдық елді мекендерінде жұмыс істейтін және тұратын денсаулық сақтау, білім беру, әлеуметтік қамсыздандыру, мәдениет және спорт мамандарына 2011 жылға көтерме жәрдемақы және тұрғын үй сатып алу үшін әлеуметтік қолдауды ұсыну туралы" шешіміне өзгерістер енгізу туралы
