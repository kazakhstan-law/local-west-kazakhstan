requisite: Батыс Қазақстан облысы Жәнібек аудандық мәслихатының 2010 жылғы 4 тамыздағы № 26-2 шешімі. Батыс Қазақстан облысы Жәнібек ауданы әділет басқармасында 2010 жылғы 31 тамызда № 7-6-112 тіркелді. Күші жойылды - Батыс Қазақстан облысы Жәнібек аудандық мәслихаттың 2012 жылғы 14 қарашадағы № 7-3 шешімімен
