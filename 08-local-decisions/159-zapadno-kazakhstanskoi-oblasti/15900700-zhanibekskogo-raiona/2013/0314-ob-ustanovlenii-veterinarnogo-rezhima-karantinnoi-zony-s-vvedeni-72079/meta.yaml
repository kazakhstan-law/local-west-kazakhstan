requisite: Решение акима Борсинского аульного округа Жанибекского района Западно-Казахстанской области от 14 марта 2013 года № 3. Зарегистрировано Департаментом юстиции Западно-Казахстанской области 17 апреля 2013 года № 3257. Утратило силу решением акима Борсинского аульного округа Жанибекского района Западно-Казахстанской области от 10 февраля 2014 года № 3
title:
