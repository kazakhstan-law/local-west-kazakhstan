act_code: '71049'
requisite: Решение Жанибекского районного маслихата Западно-Казахстанской области от 30 января 2013 года № 10-2. Зарегистрировано Департаментом юстиции Западно-Казахстанской области 21 февраля 2013 года № 3184. Утратило силу решением Жанибекского районного маслихата Западно-Казахстанской области от 26 февраля 2014 года № 21-5
title:
  rus: О предоставлении подъемного пособия и социальной поддержки для приобретения или строительства жилья специалистам здравоохранения, образования, социального обеспечения, культуры, спорта и ветеринарии, прибывшим для работы и проживания в сельские населенные пункты Жанибекского района на 2013 год
  kaz: 2013 жылы Жәнібек ауданының ауылдық елді мекендеріне жұмыс істеуге және тұруға келген денсаулық сақтау, білім беру, әлеуметтік қамсыздандыру, мәдениет, спорт және ветеринария мамандарына көтерме жәрдемақы және тұрғын үй алу немесе салу үшін әлеуметтiк қолдау көрсету туралы
