  title:
    rus: О внесении изменений и дополнений в решение Жанибекского районного маслихата от 20 декабря 2013 года №20-1 «Об утверждении Правил оказания социальной помощи, установления размеров и определения перечня отдельных категорий нуждающихся граждан Жанибекского района»
    kaz: Жәнібек аудандық мәслихатының 2013 жылғы 20 желтоқсандағы №20-1 «Жәнібек ауданының әлеуметтік көмек көрсету, оның мөлшерлерін белгілеу және мұқтаж азаматтардың жекелеген санаттарының тізбесін айқындау қағидасын бекіту туралы» шешіміне өзгерістер мен толықтырулар енгізу туралы
