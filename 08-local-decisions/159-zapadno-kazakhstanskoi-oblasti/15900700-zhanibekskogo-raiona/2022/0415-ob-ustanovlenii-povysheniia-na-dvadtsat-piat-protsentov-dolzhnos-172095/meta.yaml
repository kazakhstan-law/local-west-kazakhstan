act_code: '172095'
requisite: Решение Жанибекского районного маслихата Западно-Казахстанской области от 15 апреля 2022 года № 16-3. Зарегистрировано в Министерстве юстиции Республики Казахстан 20 апреля 2022 года № 27675. Утратило силу решением Жанибекского районного маслихата Западно-Казахстанской области от 26 июня 2023 года № 7-1 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования и распространяется на отношения, возникшие с 1 января 2023 года)
title:
  rus: Об установлении повышения на двадцать пять процентов должностных окладов и тарифных ставок специалистам в области социального обеспечения, культуры, являющимся гражданскими служащими и работающим в сельской местности
  kaz: Азаматтық қызметшілер болып табылатын және ауылдық жерде жұмыс iстейтiн әлеуметтiк қамсыздандыру, мәдениет саласындағы мамандарға жиырма бес пайызға жоғарылатылған лауазымдық айлықақылар мен тарифтiк мөлшерлемелер белгілеу туралы
