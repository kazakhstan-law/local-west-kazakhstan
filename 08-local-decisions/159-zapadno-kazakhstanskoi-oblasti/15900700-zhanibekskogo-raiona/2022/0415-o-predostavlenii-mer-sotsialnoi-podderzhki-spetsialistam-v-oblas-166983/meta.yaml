act_code: '166983'
requisite: Решение Жанибекского районного маслихата Западно-Казахстанской области от 15 апреля 2022 года № 16-4
title:
  rus: О предоставлении мер социальной поддержки специалистам в области здравоохранения, образования, социального обеспечения, культуры, спорта и агропромышленного комплекса, государственным служащим аппаратов акимов сел, поселков, сельских округов, прибывшим для работы и проживания в сельские населенные пункты Жанибекского района в 2022 году
  kaz: 2022 жылы Жәнібек ауданының ауылдық елді мекендеріне жұмыс істеу және тұру үшін келген, денсаулық сақтау, білім беру, әлеуметтік қамсыздандыру, мәдениет, спорт және агроөнеркәсіптік кешен саласындағы мамандарға, ауылдар, кенттер, ауылдық округтер әкімдері аппараттарының мемлекеттік қызметшілеріне әлеуметтік қолдау ұсыну туралы
