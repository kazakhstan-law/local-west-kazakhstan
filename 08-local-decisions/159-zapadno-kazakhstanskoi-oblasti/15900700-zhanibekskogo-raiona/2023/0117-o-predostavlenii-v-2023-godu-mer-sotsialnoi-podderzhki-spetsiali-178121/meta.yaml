act_code: '178121'
requisite: Решение Жанибекского районного маслихата Западно-Казахстанской области от 17 января 2023 года № 29-3
title:
  rus: О предоставлении в 2023 году мер социальной поддержки специалистам в области здравоохранения, образования, социального обеспечения, культуры, спорта и агропромышленного комплекса, государственным служащим аппаратов акимов сел, поселков, сельских округов, прибывшим для работы и проживания в сельские населенные пункты Жанибекского района, за исключением государственных служащих, занимающих руководящие должности, работающих и проживающих в сельских населенных пунктах
  kaz: Ауылдық елді мекендерге жұмыс істейтін және тұратын басшылық лауазымдарды атқаратын мемлекеттік әкімшілік қызметшілерін қоспағанда, 2023 жылы Жәнібек ауданының ауылдық елді мекендеріне жұмыс істеу және тұру үшін келген денсаулық сақтау, білім беру, әлеуметтік қамсыздандыру, мәдениет, спорт және агроөнеркәсіптік кешен саласындағы мамандарға, ауылдар, кенттер, ауылдық округтер әкімдері аппараттарының мемлекеттік қызметшілеріне әлеуметтік қолдау ұсыну туралы
