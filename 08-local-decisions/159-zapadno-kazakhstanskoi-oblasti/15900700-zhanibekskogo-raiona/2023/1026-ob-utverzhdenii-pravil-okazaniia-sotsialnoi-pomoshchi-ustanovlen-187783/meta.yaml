  title:
    rus: О внесении изменения в решение Жанибекского районного маслихата от 26 октября 2023 года № 11-3 «Об утверждении Правил оказания социальной помощи, установления ее размеров и определения перечня отдельных категорий нуждающихся граждан Жанибекского района»
    kaz: Жәнібек аудандық мәслихатының 2023 жылғы 26 қазандағы № 11-3 «Жәнібек ауданының әлеуметтік көмек көрсетудің, оның мөлшерлерін белгілеудің және мұқтаж азаматтардың жекелеген санаттарының тізбесін айқындаудың қағидаларын бекіту туралы» шешіміне өзгеріс енгізу туралы
