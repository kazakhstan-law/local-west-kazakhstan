act_code: '50093'
requisite: Батыс Қазақстан облысы Жәнібек ауданы әкімінің 2009 жылғы 31 желтоқсандағы № 45 шешімі. Батыс Қазақстан облысы Жәнібек ауданы әділет басқармасында 2010 жылғы 20 қаңтарда № 7-6-98 тіркелді. Күші жойылды - Батыс Қазақстан облысы Жәнібек ауданы әкімінің 2010 жылғы 19 мамырдағы № 6 шешімімен
