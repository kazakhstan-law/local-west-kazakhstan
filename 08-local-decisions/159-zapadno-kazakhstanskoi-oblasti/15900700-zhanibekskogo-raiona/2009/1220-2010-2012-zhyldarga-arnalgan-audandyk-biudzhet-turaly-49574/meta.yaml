requisite: Батыс Қазақстан облысы Жәнібек аудандық мәслихатының 2009 жылғы 20 желтоқсандағы № 21-2 шешімі. Батыс Қазақстан облысы Жәнібек ауданы әділет басқармасында 2009 жылғы 30 желтоқсанда № 7-6-96 тіркелді. Күші жойылды - Батыс Қазақстан облысы Жәнібек аудандық мәслихатының 2011 жылғы 1 ақпандағы № 30-5 шешімімен
