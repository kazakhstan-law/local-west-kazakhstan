act_code: '45017'
requisite: Батыс Қазақстан облысы Жәнібек аудандық мәслихатының 2009 жылғы 16 ақпандағы № 14-6 шешімі. Батыс Қазақстан облысы Жәнібек ауданы әділет басқармасында 2009 жылғы 17 наурызда № 7-6-83 тіркелді. Күші жойылды - Батыс Қазақстан облысы Жәнібек аудандық мәслихатының 2013 жылғы 30 қаңтардағы № 10-7 шешімімен
