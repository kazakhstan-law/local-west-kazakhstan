act_code: '50092'
requisite: Батыс Қазақстан облысы Жәнібек аудандық мәслихатының 2009 жылғы 20 желтоқсандағы № 21-4 шешімі. Батыс Қазақстан облысы Жәнібек ауданы әділет басқармасында 2010 жылғы 20 қаңтарда № 7-6-97 тіркелді. Күші жойылды - Батыс Қазақстан облысы Жәнібек аудандық мәслихатының 2010 жылғы 24 желтоқсандағы № 29-3 шешімімен
title:
  rus: Жәнібек ауданының ауылдық елді мекендерінде жұмыс істейтін және тұратын денсаулық сақтау, білім беру, әлеуметтік қамсыздандыру, мәдениет және спорт мамандарына 2010 жылға көтерме жәрдемақы ұсыну туралы
