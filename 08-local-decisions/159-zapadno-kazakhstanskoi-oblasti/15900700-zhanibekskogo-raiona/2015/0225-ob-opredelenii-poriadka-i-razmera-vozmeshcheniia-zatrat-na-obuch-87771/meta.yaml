  title:
    rus: О внесении изменений и дополнения в решение маслихата от 25 февраля 2015 года №31-2 «Об определении порядка и размера возмещения затрат на обучение на дому детей с ограниченными возможностями из числа инвалидов по индивидуальному учебному плану в Жанибекском районе»
    kaz: Жәнібек аудандық мәслихатының 2015 жылғы 25 ақпандағы № 31-2 «Мүгедектер қатарындағы кемтар балаларды жеке оқыту жоспары бойынша үйде оқытуға жұмсаған шығындарын өндіріп алу тәртібін және мөлшерін айқындау туралы» шешіміне өзгерістер мен толықтыру енгізу туралы
