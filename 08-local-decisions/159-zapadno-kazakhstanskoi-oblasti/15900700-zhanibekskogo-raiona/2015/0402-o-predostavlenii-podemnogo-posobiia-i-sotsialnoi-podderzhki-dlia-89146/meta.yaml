requisite: Решение Жанибекского районного маслихата Западно-Казахстанской области от 2 апреля 2015 года № 32-5. Зарегистрировано Департаментом юстиции Западно-Казахстанской области 22 апреля 2015 года № 3899. Утратило силу решением Жанибекского районного маслихата Западно-Казахстанской области от 17 февраля 2016 года № 43-1
title:
  rus: О предоставлении подъемного пособия и социальной поддержки для приобретения или строительства жилья специалистам в области здравоохранения, образования, социального обеспечения, культуры, спорта и агропромышленного комплекса, прибывшим для работы и проживания в сельские населенные пункты Жанибекского района на 2015 год
  kaz: 2015 жылы Жәнібек ауданының ауылдық елді мекендеріне жұмыс істеуге және тұруға келген денсаулық сақтау, білім беру, әлеуметтік қамсыздандыру, мәдениет, спорт және агроөнеркәсіптік кешен саласындағы мамандарына көтерме жәрдемақы және тұрғын үй алу немесе салу үшін әлеуметтік қолдау көрсету туралы
