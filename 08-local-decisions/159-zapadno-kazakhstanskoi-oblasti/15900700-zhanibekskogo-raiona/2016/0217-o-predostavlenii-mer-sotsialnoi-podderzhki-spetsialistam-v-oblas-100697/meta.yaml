act_code: '100697'
requisite: Решение Жанибекского районного маслихата Западно-Казахстанской области от 17 февраля 2016 года № 43-1. Зарегистрировано Департаментом юстиции Западно-Казахстанской области 14 марта 2016 года № 4291. Утратило силу решением Жанибекского районного маслихата Западно-Казахстанской области от 10 марта 2017 года № 12-5
title:
  rus: О предоставлении мер социальной поддержки специалистам в области здравоохранения, образования, социального обеспечения, культуры, спорта и агропромышленного комплекса, прибывшим для работы и проживания в сельские населенные пункты Жанибекского района на 2016 год
  kaz: 2016 жылы Жәнібек ауданының ауылдық елді мекендеріне жұмыс істеу және тұру үшін келген денсаулық сақтау, білім беру, әлеуметтік қамсыздандыру, мәдениет, спорт және агроөнеркәсіптік кешен саласындағы мамандарға әлеуметтік қолдау шараларын беру туралы
