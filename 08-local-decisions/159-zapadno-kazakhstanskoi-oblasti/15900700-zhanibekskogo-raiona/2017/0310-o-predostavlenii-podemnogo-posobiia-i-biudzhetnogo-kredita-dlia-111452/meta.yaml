requisite: Решение Жанибекского районного маслихата Западно-Казахстанской области от 10 марта 2017 года № 12-5. Зарегистрировано Департаментом юстиции Западно-Казахстанской области 14 апреля 2017 года № 4781. Утратило силу решением Жанибекского районного маслихата Западно-Казахстанской области от 4 апреля 2018 года № 20-10
title:
  rus: О предоставлении подъемного пособия и бюджетного кредита для приобретения или строительства жилья специалистам в области здравоохранения, образования, социального обеспечения, культуры, спорта и агропромышленного комплекса, прибывшим для работы и проживания в сельские населенные пункты Жанибекского района в 2017 году
  kaz: 2017 жылы Жәнібек ауданының ауылдық елді мекендеріне жұмыс істеу және тұру үшін келген денсаулық сақтау, білім беру, әлеуметтік қамсыздандыру, мәдениет, спорт және агроөнеркәсіптік кешен саласындағы мамандарға көтерме жардемақы және тұрғын үй сатып алу немесе салу үшін бюджеттік кредит беру туралы
