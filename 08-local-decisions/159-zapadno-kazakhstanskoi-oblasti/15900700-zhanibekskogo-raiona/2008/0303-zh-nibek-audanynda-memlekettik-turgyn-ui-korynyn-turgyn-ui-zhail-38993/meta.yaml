act_code: '38993'
requisite: Батыс Қазақстан облысы Жәнібек аудандық мәслихаттың 2008 жылғы 3 наурыздағы № 6-4 шешімі. Батыс Қазақстан облысы Жәнібек ауданы әділет басқармасында 2008 жылғы 4 сәуірде № 7-6-63 тіркелді. Күші жойылды - Батыс Қазақстан облысы Жәнібек аудандық мәслихаттың 2008 жылғы 20 қазандағы № 11-16 шешімімен
