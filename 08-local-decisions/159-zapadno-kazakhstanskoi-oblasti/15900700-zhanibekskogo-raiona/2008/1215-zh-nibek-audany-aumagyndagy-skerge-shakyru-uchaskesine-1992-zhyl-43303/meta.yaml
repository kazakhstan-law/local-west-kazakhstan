act_code: '43303'
requisite: Батыс Қазақстан облысы Жәнібек ауданы әкімінің 2008 жылғы 15 желтоқсандағы № 34 шешімі. Батыс Қазақстан облысы Жәнібек ауданы әділет басқармасында 2009 жылғы 8 қаңтарда № 7-6-80 тіркелді. Күші жойылды - Батыс Қазақстан облысы Жәнібек ауданы әкімінің 2009 жылғы 16 ақпандағы № 7 шешімімен
