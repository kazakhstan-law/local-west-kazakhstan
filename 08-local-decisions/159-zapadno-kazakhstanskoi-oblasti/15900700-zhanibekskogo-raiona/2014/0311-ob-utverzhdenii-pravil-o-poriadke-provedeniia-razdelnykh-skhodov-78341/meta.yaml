requisite: Решение Жанибекского районного маслихата Западно-Казахстанской области от 11 марта 2014 года № 22-1. Зарегистрировано Департаментом юстиции Западно-Казахстанской области 1 апреля 2014 года № 3458. Утратило силу решением Жанибекского районного маслихата Западно-Казахстанской области от 5 сентября 2023 года № 10-10 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: Об утверждении Правил о порядке проведения раздельных сходов местного сообщества и определения количества представителей жителей села, улицы, многоквартирного жилого дома для участия в сходе местного сообщества на территории Жанибекского района
  kaz: Жәнібек ауданының аумағында бөлек жергiлiктi қоғамдастық жиындарын өткiзу және жергiлiктi қоғамдастық жиынына қатысу үшiн ауыл, көше, көппәтерлi тұрғын үй тұрғындары өкiлдерiнiң санын айқындау тәртiбi туралы қағидасын бекiту туралы
