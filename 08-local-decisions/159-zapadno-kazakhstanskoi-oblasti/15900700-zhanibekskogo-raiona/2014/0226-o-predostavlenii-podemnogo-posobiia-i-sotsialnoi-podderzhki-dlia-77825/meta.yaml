requisite: Решение Жанибекского районного маслихата Западно-Казахстанской области от 26 февраля 2014 года № 21-2. Зарегистрировано Департаментом юстиции Западно-Казахстанской области 6 марта 2014 года № 3439. Утратило силу решением Жанибекского районного маслихата Западно-Казахстанской области от 13.10.2014 № 27-3
title:
  rus: О предоставлении подъемного пособия и социальной поддержки для приобретения или строительства жилья специалистам в области здравоохранения, образования, социального обеспечения, культуры, спорта и агропромышленного комплекса, прибывшим для работы и проживания в сельские населенные пункты Жанибекского района на 2014 год
  kaz: 2014 жылы Жәнібек ауданының ауылдық елді мекендеріне жұмыс істеуге және тұруға келген денсаулық сақтау, білім беру, әлеуметтік қамсыздандыру, мәдениет, спорт және агроөнеркәсіптік кешен саласындағы мамандарына көтерме жәрдемақы және тұрғын үй алу немесе салу үшін әлеуметтiк қолдау көрсету туралы
