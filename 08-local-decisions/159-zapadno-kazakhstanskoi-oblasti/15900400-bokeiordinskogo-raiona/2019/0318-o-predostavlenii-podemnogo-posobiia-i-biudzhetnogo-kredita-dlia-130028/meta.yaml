act_code: '130028'
requisite: Решение Бокейординского районного маслихата Западно-Казахстанской области от 18 марта 2019 года № 25-2. Зарегистрировано Департаментом юстиции Западно-Казахстанской области 1 апреля 2019 года № 5598. Утратило силу решением Бокейординского районного маслихата Западно-Казахстанской области от 4 марта 2020 года № 36-3 (вводится в действие со дня первого официального опубликования)
title:
  rus: О предоставлении подъемного пособия и бюджетного кредита для приобретения или строительства жилья специалистам в области здравоохранения, образования, социального обеспечения, культуры, спорта и агропромышленного комплекса, прибывшим для работы и проживания в сельские населенные пункты Бокейординского района в 2019 году
  kaz: 2019 жылы Бөкей ордасы ауданының ауылдық елді мекендеріне жұмыс істеу және тұру үшін келген денсаулық сақтау, білім беру, әлеуметтік қамсыздандыру, мәдениет, спорт және агроөнеркәсіптік кешен саласындағы мамандарға көтерме жәрдемақы және тұрғын үй сатып алу немесе салу үшін бюджеттік кредит беру туралы
