act_code: '43863'
requisite: Батыс Қазақстан облысы Бөкей ордасы ауданы әкімінің 2008 жылғы 31 желтоқсандағы № 21 шешімі. Батыс Қазақстан облысы Бөкей ордасы ауданы Әділет басқармасында 2009 жылғы 30 қаңтарда № 7-4-81 тіркелді. Күші жойылды - Батыс Қазақстан облысы Бөкей ордасы ауданы әкімінің 2009 жылғы 7 сәуірдегі № 4 шешімімен
