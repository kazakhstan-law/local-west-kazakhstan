act_code: '43484'
requisite: Батыс Қазақстан облысы Бөкей ордасы аудандық мәслихаттың 2008 жылғы 24 желтоқсандағы № 11-3 шешімі. Батыс Қазақстан облысы Бөкей ордасы ауданы әділет басқармасында 2009 жылғы 16 қаңтарда № 7-4-80 тіркелді. Күші жойылды - Батыс Қазақстан облысы Бөкей ордасы аудандық мәслихатының 2010 жылғы 26 ақпандағы № 20-3 шешімімен
