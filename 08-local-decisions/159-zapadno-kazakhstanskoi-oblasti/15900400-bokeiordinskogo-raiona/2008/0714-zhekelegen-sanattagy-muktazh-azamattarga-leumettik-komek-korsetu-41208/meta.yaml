act_code: '41208'
requisite: Батыс Қазақстан облысы Бөкей ордасы аудандық мәслихатының 2008 жылғы 14 шілдедегі № 7-3 шешімі. Батыс Қазақстан облысы Бөкей ордасы ауданы әділет басқармасында 2008 жылғы 11 тамызда № 7-4-68 тіркелді. Күші жойылды - Батыс Қазақстан облысы Бөкей ордасы аудандық мәслихаттың 2010 жылғы 26 ақпандағы № 20-4 шешімімен
