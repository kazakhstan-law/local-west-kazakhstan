  title:
    rus: О внесении изменений в решение Бокейординского районного маслихата от 31 марта 2021 года № 3-4 «Об утверждении Правил определения размера и порядка оказания жилищной помощи малообеспеченным семьям (гражданам) в Бокейординском районе»
    kaz: Бөкей ордасы аудандық мәслихатының 2021 жылғы 31 наурыздағы № 3-4 «Бөкей ордасы ауданында аз қамтамасыз етілген отбасыларға (азаматтарға) тұрғын үй көмегін көрсетудің мөлшерін және тәртібін айқындаудың қағидаларын бекіту туралы» шешіміне өзгерістер енгізу туралы
