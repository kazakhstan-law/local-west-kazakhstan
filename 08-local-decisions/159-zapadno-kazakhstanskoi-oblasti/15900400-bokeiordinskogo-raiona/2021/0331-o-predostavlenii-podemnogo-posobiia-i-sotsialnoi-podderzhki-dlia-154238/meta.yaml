act_code: '154238'
requisite: Решение Бокейординского районного маслихата Западно-Казахстанской области от 31 марта 2021 года № 3-2. Зарегистрировано Департаментом юстиции Западно-Казахстанской области 2 апреля 2021 года № 6921
title:
  rus: О предоставлении подъемного пособия и социальной поддержки для приобретение или строительство жилья специалистам в области здравоохранения, образования, социального обеспечения, культуры, спорта и агропромышленного комплекса, государственным служащим аппаратов акимов сел, сельских округов, прибывшим для работы и проживания в сельские населенные пункты Бокейординского района в 2021 году
  kaz: 2021 жылы Бөкей ордасы ауданының ауылдық елді мекендеріне жұмыс істеу және тұру үшін келген, денсаулық сақтау, білім беру, әлеуметтік қамсыздандыру, мәдениет, спорт және агроөнеркәсіптік кешен саласындағы мамандарға, ауылдар, ауылдық округтер әкімдері аппараттарының мемлекеттік қызметшілеріне көтерме жәрдемақы беру және тұрғын үй сатып алу немесе салу үшін әлеуметтік қолдау көрсету туралы
