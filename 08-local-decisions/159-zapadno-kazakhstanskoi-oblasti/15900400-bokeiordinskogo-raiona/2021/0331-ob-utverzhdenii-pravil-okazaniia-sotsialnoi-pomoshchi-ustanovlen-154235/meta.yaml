  title:
    rus: О внесении изменений в решение маслихата Бокейординского района Западно-Казахстанской области от 31 марта 2021 года № 3-3 «Об утверждении Правил оказания социальной помощи, установления размеров и определения перечня отдельных категорий нуждающихся граждан Бокейординского района»
    kaz: Батыс Қазақстан облысы Бөкей ордасы аудандық мәслихатының 2021 жылғы 31 наурыздағы № 3-3 «Бөкей ордасы ауданының әлеуметтік көмек көрсету, оның мөлшерлерін белгілеу және мұқтаж азаматтардың жекелеген санаттарының тізбесін айқындау қағидаларын бекіту туралы» шешіміне өзгерістер енгізу туралы
