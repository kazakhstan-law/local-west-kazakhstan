requisite: Решение Бокейординского районного маслихата Западно-Казахстанской области от 31 марта 2021 года № 3-3. Зарегистрировано Департаментом юстиции Западно-Казахстанской области 2 апреля 2021 года № 6920. Утратило силу решением Бокейординского районного маслихата Западно-Казахстанской области от 25 сентября 2023 года № 7-1 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: Об утверждении Правил оказания социальной помощи, установления размеров и определения перечня отдельных категорий нуждающихся граждан Бокейординского района
