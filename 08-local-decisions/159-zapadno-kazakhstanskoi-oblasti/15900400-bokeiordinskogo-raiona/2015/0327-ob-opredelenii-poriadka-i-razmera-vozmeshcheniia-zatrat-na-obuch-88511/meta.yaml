  title:
    rus: О внесении изменений и дополнения в решение Бокейординского районного маслихата от 27 марта 2015 года № 21-2 «Об определении порядка и размера возмещения затрат на обучениена дому детей с ограниченными возможностями из числа инвалидов по индивидуальному учебному плану»
    kaz: Бөкей ордасы аудандық мәслихатының 2015 жылғы 27 наурыздағы № 21-2 «Мүгедектер қатарындағы кемтар балаларды жеке оқыту жоспары бойынша үйде оқытуға жұмсаған шығындарын өндіріп алу тәртібін және мөлшерін айқындау туралы» шешіміне өзгерістер мен толықтыру енгізу туралы
