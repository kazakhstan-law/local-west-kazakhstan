act_code: '88511'
requisite: Решение Бокейординского районного маслихата Западно-Казахстанской области от 27 марта 2015 года №21-2. Зарегистрировано Департаментом юстиции Западно-Казахстанской области 9 апреля 2015 года №3877
title:
  rus: Об определении порядка и размера возмещения затрат на обучение на дому детей с ограниченными возможностями из числа детей с инвалидностью по индивидуальному учебному плану в Бокейординском районе
  kaz: Бөкей ордасы ауданында жеке оқыту жоспары бойынша мүгедектігі бар балалар қатарындағы кемтар балаларды үйде оқытуға жұмсалған шығындарды өтеу тәртібін және мөлшерін айқындау туралы
