  title:
    rus: О внесении изменений в решение Бокейординского районного маслихата от 27 марта 2015 года № 21-2 «Об определении порядка и размера возмещения затрат на обучение на дому детей с ограниченными возможностями из числа детей с инвалидностью по индивидуальному учебному плану в Бокейординском районе»
    kaz: Бөкей ордасы аудандық мәслихатының 2015 жылғы 27 наурыздағы № 21-2 «Бөкей ордасы ауданында мүгедектігі бар балалар қатарындағы кемтар балаларды жеке оқыту жоспары бойынша үйде оқытуға жұмсаған шығындарын өндіріп алу мен мөлшерін айқындау туралы» шешіміне өзгерістер енгізу туралы
