act_code: '100794'
requisite: Решение Бокейординского районного маслихата Западно-Казахстанской области от 19 февраля 2016 года № 29-1. Зарегистрировано Департаментом юстиции Западно-Казахстанской области 15 марта 2016 года № 4294. Утратило силу решением Бокейординского районного маслихата Западно-Казахстанской области от 9 марта 2017 года № 9-6
title:
  rus: О предоставлении подъемного пособия и бюджетного кредита для приобретения или строительства жилья специалистам в области здравоохранения, образования, социального обеспечения, культуры, спорта и агропромышленного комплекса, прибывшим для работы и проживания в сельские населенные пункты Бокейординского района в 2016 году
  kaz: 2016 жылы Бөкей ордасы ауданының ауылдық елді мекендеріне жұмыс істеу және тұру үшін келген денсаулық сақтау, білім беру, әлеуметтік қамсыздандыру, мәдениет, спорт және агроөнеркәсіптік кешен саласындағы мамандарға көтерме жәрдемақы және тұрғын үй сатып алу немесе салу үшін бюджеттік кредит беру туралы
