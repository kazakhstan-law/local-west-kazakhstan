  title:
    rus: О внесении изменения в решение Бокейординского районного маслихата от 23 октября 2023 года № 8-1 «Об утверждении Правил оказания социальной помощи, установления ее размеров и определения перечня отдельных категорий нуждающихся граждан Бокейординского района»
    kaz: Бөкей ордасы аудандық мәслихатының 2023 жылғы 23 қазандағы № 8-1 «Бөкей ордасы ауданының әлеуметтік көмек көрсетудің, оның мөлшерлерін белгілеудің және мұқтаж азаматтардың жекелеген санаттарының тізбесін айқындаудың қағидаларын бекіту туралы» шешіміне өзгеріс енгізу туралы
