act_code: '177855'
requisite: Решение Бокейординского районного маслихата Западно-Казахстанской области от 17 января 2023 года № 26-3. Утратило силу решением Бокейординского районного маслихата Западно-Казахстанской области от 25 сентября 2023 года № 7-3 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: О предоставлении подъемного пособия и социальной поддержки для приобретения или строительства жилья специалистам в области здравоохранения, образования, социального обеспечения, культуры, спорта и агропромышленного комплекса, государственным служащим аппаратов акимов сел, поселков, сельских округов прибывшим для работы и проживания в сельские населенные пункты Бокейординского района в 2023 году
  kaz: 2023 жылы Бөкей ордасы ауданының ауылдық елдi мекендеріне жұмыс iстеуге және тұруға келген денсаулық сақтау, бiлiм беру, әлеуметтiк қамсыздандыру, мәдениет, спорт және агроөнеркәсіптік кешен саласындағы мамандарға, ауылдар, кенттер, ауылдық округтер әкімдері аппараттарының мемлекеттік қызметшілеріне көтерме жәрдемақы және тұрғын үй алу немесе салу үшін әлеуметтік қолдау көрсету туралы
