  title:
    rus: О внесении изменения в решение Бокейординского районного маслихата от 4 марта 2020 года №36-2 «Об утверждении Правил оказания социальной помощи, установления размеров и определения перечня отдельных категорий нуждающихся граждан Бокейординского района»
    kaz: Бөкей ордасы аудандық мәслихатының 2020 жылғы 4 наурыздағы №36-2 «Бөкей ордасы ауданының әлеуметтік көмек көрсету, оның мөлшерлерін белгілеу және мұқтаж азаматтардың жекелеген санаттарының тізбесін айқындау қағидаларын бекіту туралы» шешіміне өзгеріс енгізу туралы
