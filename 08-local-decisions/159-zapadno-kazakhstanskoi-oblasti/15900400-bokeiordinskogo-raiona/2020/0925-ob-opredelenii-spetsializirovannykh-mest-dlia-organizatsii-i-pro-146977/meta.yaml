act_code: '146977'
requisite: Решение Бокейординского районного маслихата Западно-Казахстанской области от 25 сентября 2020 года № 45-2. Зарегистрировано Департаментом юстиции Западно-Казахстанской области 1 октября 2020 года № 6402
title:
  rus: Об определении специализированных мест для организации и проведения мирных собраний, порядка их использования, норм их предельной заполняемости, требований к их материально-техническому и организационному обеспечению, границ прилегающих территорий, в которых запрещено проведение пикетирования по Бокейординскому району
  kaz: Бөкей ордасы  ауданында бейбіт жиналыстарды ұйымдастыру және өткізу үшін арнайы орындарды, оларды пайдалану тәртібін, шекті толтырылу нормаларын, олардың материалдық-техникалық және ұйымдастырушылық қамтамасыз етуге қойылатын талаптарын, пикеттеуді өткізуге тыйым салынған іргелес аумақтардың шекараларын айқындау туралы
