act_code: '50065'
requisite: Батыс Қазақстан облысы Бөкей ордасы ауданы әкімінің 2009 жылғы 25 желтоқсандағы № 23 шешімі. Батыс Қазақстан облысы Бөкей ордасы ауданы әділет басқармасында 2010 жылғы 22 қаңтарда № 7-4-100 тіркелді. Күші жойылды - Батыс Қазақстан облысы Бөкей ордасы ауданы әкімінің 2010 жылғы 5 сәуірдегі № 7 шешімімен
