requisite: Батыс Қазақстан облысы Бөкей ордасы аудандық мәслихатының 2009 жылғы 4 наурыздағы № 12-3 шешімі. Батыс Қазақстан облысы Бөкей ордасы ауданы әділет басқармасында 2009 жылғы 19 наурызда № 7-4-83 тіркелді. Күші жойылды - Батыс Қазақстан облысы Бөкей ордасы аудандық мәслихатының 2013 жылғы 6 ақпандағы № 8-4 шешімімен
