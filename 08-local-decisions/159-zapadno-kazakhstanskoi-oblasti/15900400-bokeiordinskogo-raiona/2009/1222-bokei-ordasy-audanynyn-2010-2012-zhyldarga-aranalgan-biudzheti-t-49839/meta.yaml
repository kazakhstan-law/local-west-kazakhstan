act_code: '49839'
requisite: Батыс Қазақстан облысы Бөкей ордасы аудандық мәслихатының 2009 жылғы 22 желтоқсандағы № 19-2 шешімі. Батыс Қазақстан облысы Бөкей ордасы ауданы әділет басқармасында 2010 жылғы 14 қаңтарда № 7-4-99 тіркелді. Күші жойылды - Батыс Қазақстан облысы Бөкей ордасы аудандық мәслихатының 2012 жылғы 23 қаңтардағы № 1-4 шешімімен
