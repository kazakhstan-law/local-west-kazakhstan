act_code: '65635'
requisite: Решение Бокейординского районного маслихата Западно-Казахстанской области от 12 апреля 2012 года № 2-3. Зарегистрировано Департаментом юстиции Западно-Казахстанской области 16 мая 2012 года № 7-4-131. Утратило силу - решением Бокейординского районного маслихата Западно-Казахстанской области от 6 февраля 2013 года № 8-2
title:
  rus: О предоставлении специалистам здравоохранения, образоавния, социального обеспечения, культуры, спорта и ветеринарии, прибывшим для работы и проживания в Бокейординском районе, подъемного пособия и социальной поддержки для приобретения  или строительства жилья в 2012 году
  kaz: Бөкей ордасы ауданына жұмыс істеуге және тұруға келген денсаулық сақтау, білім беру, әлеуметтік қамсыздандыру, мәдениет, спорт және ветеринария мамандарына 2012 жылға көтерме жәрдемақы және тұрғын үй алу немесе cалу үшін әлеуметтік қолдау туралы
