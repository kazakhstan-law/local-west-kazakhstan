act_code: '76938'
requisite: Решение Бокейординского районного маслихата Западно-Казахстанской области от 28 декабря 2013 года № 14-9. Зарегистрировано Департаментом юстиции Западно-Казахстанской области 21 января 2014 года № 3413. Утратило силу решением Бокейординского районного маслихата Западно-Казахстанской области от 4 марта 2020 года № 36-2 (вводится в действие по истечении десяти календарных дней со дня первого официального опубликования)
title:
  rus: Об утверждении Правил оказания социальной помощи, установления размеров и определения перечня отдельных категорий нуждающихся граждан Бокейординского района
  kaz: Бөкей ордасы ауданының әлеуметтік көмек көрсету, оның мөлшерлерін белгілеу және мұқтаж азаматтардың жекелеген санаттарының тізбесін айқындау қағидасын бекіту туралы
