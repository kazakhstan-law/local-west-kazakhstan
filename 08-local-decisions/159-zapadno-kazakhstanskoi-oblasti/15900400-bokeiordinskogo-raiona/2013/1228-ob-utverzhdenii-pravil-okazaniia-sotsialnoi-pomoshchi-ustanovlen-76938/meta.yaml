  title:
    rus: О внесении изменений в решение Бокейординского районного маслихата от 28 декабря 2013 года № 14-9 «Об утверждении Правил оказания социальной помощи, установления размеров и определения перечня отдельных категорий нуждающихся граждан Бокейординского района»
    kaz: Бөкей ордасы аудандық мәслихатының 2013 жылғы 28 желтоқсандағы № 14-9 «Бөкей ордасы ауданының әлеуметтік көмек көрсету, оның мөлшерлерін белгілеу және мұқтаж азаматтардың жекелеген санаттарының тізбесін айқындау қағидасын бекіту туралы» шешіміне өзгерістер енгізу туралы
