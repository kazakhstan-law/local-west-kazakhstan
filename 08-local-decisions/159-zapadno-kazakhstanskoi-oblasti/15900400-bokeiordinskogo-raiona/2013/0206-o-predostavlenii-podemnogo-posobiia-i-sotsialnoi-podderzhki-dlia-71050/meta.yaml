act_code: '71050'
requisite: Решение Бокейординского районного маслихата Западно-Казахстанской области от 6 февраля 2013 года № 8-2. Зарегистрировано Департаментом юстиции Западно-Казахстанской области 21 февраля 2013 года № 3185. Утратило силу решением Бокейординского районного маслихата Западно-Казахстанской области от 12 марта 2014 года № 15-4
title:
  rus: О предоставлении подъемного пособия и социальной поддержки для приобретения или строительства жилья специалистам здравоохранения, образования, социального обеспечения, культуры, спорта и ветеринарии, прибывшим для работы и проживания в сельские населенные пункты Бокейординского района на 2013 год
  kaz: 2013 жылы Бөкей ордасы ауданының ауылдық елді мекендеріне жұмыс істеуге және тұруға келген денсаулық сақтау, білім беру, әлеуметтік қамсыздандыру, мәдениет, спорт және ветеринария мамандарына көтерме жәрдемақы және тұрғын үй алу немесе салу үшін әлеуметтiк қолдау көрсету туралы
