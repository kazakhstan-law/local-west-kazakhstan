act_code: '56384'
requisite: Батыс Қазақстан облысы Бөкей ордасы ауданы әкімінің 2010 жылғы 20 желтоқсандағы № 19 шешімі. Батыс Қазақстан облысы Бөкей ордасы ауданы әділет басқармасында 2010 жылғы 29 желтоқсанда № 7-4-115 тіркелді. Күші жойылды - Батыс Қазақстан облысы Бөкей ордасы ауданы әкімінің 2011 жылғы 3 мамырдағы № 7 шешімімен
