act_code: '51333'
requisite: Батыс Қазақстан облысы Бөкей ордасы аудандық мәслихатының 2010 жылғы 26 ақпандағы № 20-4 шешімі. Батыс Қазақстан облысы Бөкей ордасы ауданы әділет басқармасында 2010 жылғы 25 наурызда № 7-4-102 тіркелді. Күші жойылды - Батыс Қазақстан облысы Бөкей ордасы аудандық мәслихатының 2012 жылғы 12 сәуірдегі № 2-4 шешімімен
