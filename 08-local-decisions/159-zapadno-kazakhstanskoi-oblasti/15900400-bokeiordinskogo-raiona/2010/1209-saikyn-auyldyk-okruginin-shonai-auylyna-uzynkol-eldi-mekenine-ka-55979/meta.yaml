act_code: '55979'
requisite: Батыс Қазақстан облысы Бөкей ордасы ауданы Сайқын ауылдық округі әкімінің 2010 жылғы 9 желтоқсандағы № 50 шешімі. Батыс Қазақстан облысы Бөкей ордасы ауданы әділет басқармасында 2010 жылғы 15 желтоқсанда № 7-4-113 тіркелді. Күші жойылды - Батыс Қазақстан облысы Бөкей ордасы ауданы Сайқын ауылдық округі әкімінің 2010 жылғы 27 желтоқсандағы № 53 шешімімен
title:
