act_code: '52555'
requisite: Батыс Қазақстан облысы Бөкей ордасы аудандық мәслихатының 2010 жылғы 16 сәуірдегі № 21-2 шешімі. Батыс Қазақстан облысы Бөкей ордасы ауданы әділет басқармасында 2010 жылғы 17 мамырда № 7-4-106 тіркелді. Күші жойылды - Батыс Қазақстан облысы Бөкей ордасы аудандық мәслихатының 2013 жылғы 12 шілдедегі № 11-3 шешімімен
