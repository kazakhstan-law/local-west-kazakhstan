  title:
    rus: О внесении изменения в решение Бокейординского районного маслихата от 12 марта 2014 года № 15-4 "О предоставлении подъемного пособия и социальной поддержки для приобретения или строительства жилья специалистам здравоохранения, образования, социального обеспечения, культуры, спорта и агропромышленного комплекса, прибывшим для работы и проживания в сельские населенные пункты Бокейординского района на 2014 год"
    kaz: Бөкей ордасы аудандық мәслихатының 2014 жылғы 12 наурыздағы № 15-4 "2014 жылы Бөкей ордасы ауданының ауылдық елді мекендеріне жұмыс істеуге және тұруға келген денсаулық сақтау, білім беру, әлеуметтік қамсыздандыру, мәдениет, спорт және агроөнеркәсіптік кешен саласындағы мамандарына көтерме жәрдемақы және тұрғын үй алу немесе салу үшін әлеуметтiк қолдау көрсету туралы" шешіміне өзгеріс енгізу туралы
