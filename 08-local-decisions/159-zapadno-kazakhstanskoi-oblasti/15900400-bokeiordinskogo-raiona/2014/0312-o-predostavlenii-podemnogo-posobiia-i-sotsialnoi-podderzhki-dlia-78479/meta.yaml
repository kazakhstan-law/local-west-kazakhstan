act_code: '78479'
requisite: Решение Бокейординского районного маслихата Западно-Казахстанской области от 12 марта 2014 года № 15-4. Зарегистрировано Департаментом юстиции Западно-Казахстанской области 4 апреля 2014 года № 3487. Утратило силу решением Бокейординского районного маслихата Западно-Казахстанской области от 27 марта 2015 года № 21-6
title:
  rus: О предоставлении подъемного пособия и социальной поддержки для приобретения или строительства жилья специалистам в области здравоохранения, образования, социального обеспечения, культуры, спорта и агропромышленного комплекса, прибывшим для работы и проживания в сельские населенные пункты Бокейординского района на 2014 год
  kaz: 2014 жылы Бөкей ордасы ауданының ауылдық елді мекендеріне жұмыс істеуге және тұруға келген денсаулық сақтау, білім беру, әлеуметтік қамсыздандыру, мәдениет, спорт және агроөнеркәсіптік кешен саласындағы мамандарына көтерме жәрдемақы және тұрғын үй алу немесе салу үшін әлеуметтiк қолдау көрсету туралы
