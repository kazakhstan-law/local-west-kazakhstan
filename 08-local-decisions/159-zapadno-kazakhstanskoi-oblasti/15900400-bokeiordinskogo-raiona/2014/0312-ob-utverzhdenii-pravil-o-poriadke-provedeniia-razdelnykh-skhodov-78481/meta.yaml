requisite: Решение Бокейординского районного маслихата Западно-Казахстанской области от 12 марта 2014 года № 15-3. Зарегистрировано Департаментом юстиции Западно-Казахстанской области 4 апреля 2014 года № 3489. Утратило силу решением Бокейординского районного маслихата Западно-Казахстанской области от 25 сентября 2023 года № 7-2 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: Об утверждении Правил о порядке проведения раздельных сходов местного сообщества и определения количества представителей жителей села, улицы, многоквартирного жилого дома для участия в сходе местного сообщества на территории Бокейординского района
  kaz: Бөкей ордасы ауданының аумағында бөлек жергiлiктi қоғамдастық жиындарын өткiзу және жергiлiктi қоғамдастық жиынына қатысу үшiн ауыл, көше, көппәтерлi тұрғын ұй тұрғындары өкiлдерiнiң санын айқындау тәртiбi туралы қағидасын бекiту туралы
