title:
  rus: Об установлении стимулирующих надбавок к должностным окладам работников коммунального государственного учреждения «Ресурсный центр по работе с молодежью» отдела внутренней политики акимата Теректинского района, финансируемых из местного бюджета
  kaz: Жергілікті бюджеттен қаржыландырылатын Теректі ауданы әкімдігі аудандық ішкі саясат бөлімінің «Жастармен жұмыс жөніндегі ресурстық орталығы» коммуналдық мемлекеттік мекемесінің қызметкерлерінің лауазымдық айлықақыларына ынталандыру үстемеақыларын белгілеу туралы
