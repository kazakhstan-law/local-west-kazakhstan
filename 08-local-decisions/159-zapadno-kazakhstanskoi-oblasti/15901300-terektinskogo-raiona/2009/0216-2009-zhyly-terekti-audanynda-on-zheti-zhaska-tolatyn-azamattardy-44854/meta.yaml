requisite: Батыс Қазақстан облысы Теректі ауданы әкімінің 2009 жылғы 16 ақпандағы № 12 шешімі. Батыс Қазақстан облысы Теректі ауданы әділет басқармасында 2009 жылғы 5 наурызда № 7-12-75 тіркелді. Күші жойылды - Батыс Қазақстан облысы Теректі ауданы әкімінің 2009 жылғы 15 сәуірдегі № 37 шешімімен
