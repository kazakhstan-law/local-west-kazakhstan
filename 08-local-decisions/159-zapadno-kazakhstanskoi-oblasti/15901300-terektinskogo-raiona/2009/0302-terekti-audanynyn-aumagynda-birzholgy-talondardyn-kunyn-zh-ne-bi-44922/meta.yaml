act_code: '44922'
requisite: Батыс Қазақстан облысы Теректі аудандық мәслихатының 2009 жылғы 2 наурыздағы № 16-2 шешімі. Батыс Қазақстан облысы Теректі ауданы әділет басқармасында 2009 жылғы 17 наурызда № 7-12-77 тіркелді. Күші жойылды - Батыс Қазақстан облысы Теректі аудандық мәслихатының 2012 жылғы 16 қарашадағы № 6-2 шешімімен
