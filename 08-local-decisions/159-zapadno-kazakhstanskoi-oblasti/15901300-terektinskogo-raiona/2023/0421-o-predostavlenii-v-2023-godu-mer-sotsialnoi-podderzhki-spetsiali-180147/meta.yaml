  title:
    rus: О внесении изменения в решение Теректинского районного маслихата от 21 апреля 2023 года № 2-9 «О предоставлении в 2023 году мер социальной поддержки специалистам в области здравоохранения, образования, социального обеспечения, культуры, спорта и агропромышленного комплекса, государственным служащим аппаратов акимов сельских округов, прибывшим для работы и проживания в сельские населенные пункты Теректинского района»
    kaz: «Теректі ауданының ауылдық елді мекендеріне жұмыс істеуге және тұруға келген денсаулық сақтау, білім беру, әлеуметтік қамсыздандыру, мәдениет, спорт және агроөнеркәсіптік кешен саласындағы мамандарға, ауылдық округтер әкімдері аппаратының мемлекеттік қызметшілеріне 2023 жылы әлеуметтік қолдау шараларын көрсету туралы» 2023 жылғы 21 сәуірдегі № 2-9 Теректі аудандық мәслихатының шешіміне өзгеріс енгізу туралы
