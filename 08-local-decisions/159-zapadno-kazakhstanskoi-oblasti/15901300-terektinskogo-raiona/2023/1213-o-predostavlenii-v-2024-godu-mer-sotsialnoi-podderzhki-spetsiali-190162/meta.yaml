  title:
    rus: О внесении изменения в решение Теректинского районного маслихата от 13 декабря 2023 года № 10-3 «О предоставлении в 2024 году мер социальной поддержки специалистам в области здравоохранения, образования, социального обеспечения, культуры, спорта и агропромышленного комплекса, государственным служащим аппаратов акимов сельских округов, прибывшим для работы и проживания в сельские населенные пункты Теректинского района»
    kaz: Теректі аудандық мәслихатының 2023 жылғы 13 желтоқсандағы № 10-3 «2024 жылы Теректі ауданының ауылдық елді мекендеріне жұмыс істеуге және тұруға келген денсаулық сақтау, білім беру, әлеуметтік қамсыздандыру, мәдениет, спорт және агроөнеркәсіптік кешен саласындағы мамандарға, ауылдық округтер әкімдері аппаратының мемлекеттік қызметшілеріне әлеуметтік қолдау шараларын көрсету туралы» шешіміне өзгеріс енгізу туралы
  link: https://zan.gov.kz/client/#!/doc/202165/rus
