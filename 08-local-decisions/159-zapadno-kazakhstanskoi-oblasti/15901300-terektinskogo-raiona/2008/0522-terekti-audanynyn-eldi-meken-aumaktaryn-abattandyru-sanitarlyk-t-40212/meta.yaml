act_code: '40212'
requisite: Батыс Қазақстан облысы Теректі аудандық мәслихатының 2008 жылғы 22 мамырдағы № 9-2 шешімі. Батыс Қазақстан облысы Теректі ауданы әділет басқармасында 2008 жылғы 28 маусымда № 7-12-61 тіркелді. Күші жойылды - Батыс Қазақстан облысы Теректі аудандық мәслихатының 2012 жылғы 21 маусымдағы № 3-2 шешімімен
title:
