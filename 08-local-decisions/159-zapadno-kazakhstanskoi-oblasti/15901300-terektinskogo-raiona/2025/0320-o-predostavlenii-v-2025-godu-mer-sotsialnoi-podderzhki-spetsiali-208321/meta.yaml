act_code: '208321'
requisite: Решение Теректинского районного маслихата Западно-Казахстанской области от 20 марта 2025 года № 22-2
title:
  rus: О предоставлении в 2025 году мер социальной поддержки специалистам в области здравоохранения, образования, социального обеспечения, культуры, спорта и агропромышленного комплекса, государственным служащим аппаратов акимов сельских округов, прибывшим для работы и проживания в сельские населенные пункты Теректинского района
  kaz: 2025 жылы Теректі ауданының ауылдық елді мекендеріне жұмыс істеуге және тұруға келген денсаулық сақтау, білім беру, әлеуметтік қамсыздандыру, мәдениет, спорт және агроөнеркәсіптік кешен саласындағы мамандарға, ауылдық округтер әкімдері аппаратының мемлекеттік қызметшілеріне әлеуметтік қолдау шараларын көрсету туралы
