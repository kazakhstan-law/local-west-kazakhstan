act_code: '146656'
requisite: Решение Теректинского районного маслихата Западно-Казахстанской области от 22 сентября 2020 года № 45-6. Зарегистрировано Департаментом юстиции Западно-Казахстанской области 24 сентября 2020 года № 6381
title:
  rus: Об определении специализированных мест для организации и проведения мирных собраний, порядка их использования, норм их предельной заполняемости, требований к их материально-техническому и организационному обеспечению, границ прилегающих территорий, в которых запрещено проведение пикетирования по Теректинскому району
  kaz: Теректі ауданында бейбіт жиналыстарды ұйымдастыру және өткізу үшін арнайы орындарды, оларды пайдалану тәртібін, шекті толтырылу нормаларын, олардың материалдық-техникалық және ұйымдастырушылық қамтамасыз етуге қойылатын талаптарын, пикеттеуді өткізуге тыйым салынған іргелес аумақтардың шекараларын айқындау туралы
