    kaz: Теректі аудандық мәслихатының 2020 жылғы 28 желтоқсандағы № 48-2 «Теректі ауданының әлеуметтік көмек көрсетудің, оның мөлшерлерін белгілеу және мұқтаж азаматтардың жекелеген санаттарының тізбесін айқындаудың қағидаларын бекіту туралы» шешіміне өзгерістер енгізу туралы
