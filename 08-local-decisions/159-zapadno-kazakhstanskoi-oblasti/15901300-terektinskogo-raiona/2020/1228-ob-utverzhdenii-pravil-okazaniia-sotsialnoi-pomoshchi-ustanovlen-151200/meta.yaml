  title:
    rus: О внесении изменения в решение Теректинского районного маслихата от 28 декабря 2020 года № 48-2 «Об утверждении Правил оказания социальной помощи, установления размеров и определения перечня отдельных категорий нуждающихся граждан Теректинского района»
    kaz: Теректі аудандық мәслихатының 2020 жылғы 28 желтоқсандағы № 48-2 «Теректі ауданының әлеуметтік көмек көрсетудің, оның мөлшерлерін белгілеудің және мұқтаж азаматтардың жекелеген санаттарының тізбесін айқындаудың қағидаларын бекіту туралы» шешіміне өзгеріс енгізу туралы
