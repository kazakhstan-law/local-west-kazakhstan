  title:
    rus: О внесении изменения в решение Теректинского районного маслихата от 25 февраля 2015 года № 25-2 «Об определении порядка и размера возмещения затрат на обучение на дому детей с ограниченными возможностями из числа детей с инвалидностью по индивидуальному учебному плану в Теректинском районе»
    kaz: Теректі аудандық мәслихатының «Теректі ауданында жеке оқыту жоспары бойынша мүгедектігі бар балалар қатарындағы кемтар балаларды үйде оқытуға жұмсалған шығындарды өтеу тәртібі мен мөлшерін айқындау туралы» 2015 жылғы 25 ақпандағы № 25-2 шешіміне өзгеріс енгізу туралы
