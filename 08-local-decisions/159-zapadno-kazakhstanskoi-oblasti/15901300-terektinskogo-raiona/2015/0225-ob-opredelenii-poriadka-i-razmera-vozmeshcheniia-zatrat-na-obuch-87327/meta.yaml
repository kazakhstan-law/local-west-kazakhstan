    kaz: Теректі аудандық мәслихатының 2015 жылғы 25 ақпандағы № 25-2 «Теректі ауданында мүгедектер қатарындағы кемтар балаларды жеке оқыту жоспары бойынша үйде оқытуға жұмсаған шығындарын өндіріп алу тәртібін және мөлшерін айқындау туралы» шешіміне өзгерістер мен толықтыру енгізу туралы
