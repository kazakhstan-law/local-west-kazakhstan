  title:
    rus: О внесении изменений в решение Теректинского районного маслихата от 5 февраля 2014 года №18-3 «Об утверждении Правил оказания социальной помощи, установления размеров и определения перечня отдельных категорий нуждающихся граждан Теректинского района»
    kaz: Теректі аудандық мәслихатының 2014 жылғы 5 ақпандағы №18-3 «Теректі ауданының әлеуметтік көмек көрсету, оның мөлшерлерін белгілеу және мұқтаж азаматтардың жекелеген санаттарының тізбесін айқындау қағидасын бекіту туралы» шешіміне өзгерістер енгізу туралы
