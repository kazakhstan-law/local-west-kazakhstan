requisite: Решение Теректинского районного маслихата Западно-Казахстанской области от 5 марта 2014 года № 19-1. Зарегистрировано Департаментом юстиции Западно-Казахстанской области 2 апреля 2014 года № 3482. Утратило силу решением Теректинского районного маслихата Западно-Казахстанской области от 28 декабря 2021 года № 18-3 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: Об утверждении Правил о порядке проведения раздельных сходов местного сообщества и определения количества представителей жителей села, улицы, многоквартирного жилого дома для участия в сходе местного сообщества на территории Теректинского района
  kaz: Теректі ауданының аумағында бөлек жергiлiктi қоғамдастық жиындарын өткiзу және жергiлiктi қоғамдастық жиынына қатысу үшiн ауыл, көше, көппәтерлi тұрғын үй тұрғындары өкiлдерiнiң санын айқындау тәртiбi туралы қағидасын бекiту туралы
