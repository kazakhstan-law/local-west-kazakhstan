requisite: Батыс Қазақстан облысы Теректі аудандық мәслихатының 2010 жылғы 16 сәуірдегі № 28-2 шешімі. Батыс Қазақстан облысы Теректі ауданы әділет басқармасында 2010 жылғы 17 мамырда № 7-12-88 тіркелді. Күші жойылды - Батыс Қазастан облысы Теректі аудандық мәслихаттың 2012 жылғы 12 сәуірдегі № 2-7 шешімімен
