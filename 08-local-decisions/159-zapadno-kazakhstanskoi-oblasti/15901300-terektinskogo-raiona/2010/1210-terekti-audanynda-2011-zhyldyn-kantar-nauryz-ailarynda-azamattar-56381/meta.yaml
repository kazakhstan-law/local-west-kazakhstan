requisite: Батыс Қазақстан облысы Теректі ауданы әкімінің 2010 жылғы 10 желтоқсандағы № 210 шешімі. Батыс Қазақстан облысы Теректі ауданы әділет басқармасында 2010 жылғы 31 желтоқсанда № 7-12-103 тіркелді. Күші жойылды - Батыс Қазақстан облысы Теректі ауданы әкімінің 2011 жылғы 22 сәуірдегі № 68 шешімімен
