requisite: Решение маслихата района Бәйтерек Западно-Казахстанской области от 14 ноября 2022 года № 22-2. Зарегистрировано в Министерстве юстиции Республики Казахстан 16 ноября 2022 года № 30555. Утратило силу решением маслихата района Бәйтерек Западно-Казахстанской области от 4 декабря 2024 года № 19-2 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
