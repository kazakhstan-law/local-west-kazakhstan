  title:
    rus: О внесении изменения в решение Зеленовского районного маслихата от 26 декабря 2013 года № 20-3 «Об утверждении Правил оказания социальной помощи, установления размеров и определения перечня отдельных категорий нуждающихся граждан Зеленовского района»
    kaz: Зеленов аудандық мәслихатының 2013 жылғы 26 желтоқсандағы № 20- 3 «Зеленов ауданының әлеуметтік көмек көрсету, оның мөлшерлерін белгілеу және мұқтаж азаматтардың жекелеген санаттарының тізбесін айқындау қағидасын бекіту туралы» шешіміне өзгеріс енгізу туралы
