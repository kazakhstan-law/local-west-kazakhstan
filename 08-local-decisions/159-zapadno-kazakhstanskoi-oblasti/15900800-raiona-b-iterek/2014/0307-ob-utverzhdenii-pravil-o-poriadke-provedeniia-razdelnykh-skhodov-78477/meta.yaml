requisite: Решение Зеленовского районного маслихата Западно-Казахстанской области от 7 марта 2014 года № 22-1. Зарегистрировано Департаментом юстиции Западно-Казахстанской области 3 апреля 2014 года № 3485. Утратило силу решением маслихата района Бәйтерек Западно-Казахстанской области от 27 сентября 2023 года № 8-5 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: Об утверждении Правил о порядке проведения раздельных сходов местного сообщества и определения количества представителей жителей села, улицы, многоквартирного жилого дома для участия в сходе местного сообщества на территории района Бәйтерек
  kaz: Бәйтерек ауданының аумағында жергілікті қоғамдастықтың бөлек жиындарын өткізу және жергілікті қоғамдастық жиынына қатысу үшін ауыл, көше, көппәтерлі тұрғын үй тұрғындары өкілдерінің санын айқындау тәртібі туралы қағидаларын бекіту туралы
