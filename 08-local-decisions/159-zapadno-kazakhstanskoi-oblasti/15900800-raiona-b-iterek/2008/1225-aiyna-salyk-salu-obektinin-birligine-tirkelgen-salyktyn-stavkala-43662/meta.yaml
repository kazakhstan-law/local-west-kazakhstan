act_code: '43662'
requisite: Батыс Қазақстан облысы Зеленов аудандық мәслихаттың 2008 жылғы 25 желтоқсандағы № 10-8 шешімі. Батыс Қазақстан облысы Зеленов ауданы Әділет басқармасында 2009 жылғы 23 қаңтарда № 7-7-77 тіркелді. Күші жойылды - Батыс Қазақстан облысы Зеленов аудандық мәслихатының 2011 жылғы 17 қарашадағы № 38-11 шешімімен
