act_code: '43862'
requisite: Батыс Қазақстан облысы Зеленов ауданы әкімінің 2008 жылғы 24 желтоқсандағы № 45 шешімі. Батыс Қазақстан облысы Зеленов ауданы әділет басқармасында 2009 жылғы 30 қаңтарда № 7-7-79 тіркелді. Күші жойылды - Батыс Қазақстан облысы Зеленов ауданы әкімдігінің 2014 жылғы 10 қазандағы № 817 қаулысымен
