act_code: '44062'
requisite: Батыс Қазақстан облысы Зеленов аудандық мәслихаттың 2008 жылғы 25 желтоқсандағы № 10-12 шешімі. Батыс Қазақстан облысы Зеленов ауданы әділет басқармасында 2009 жылғы 4 ақпанда № 7-7-80 тіркелді. Күші жойылды - Батыс Қазақстан облысы Зеленов аудандық мәслихаттың 2012 жылғы 20 желтоқсандағы № 8-9 шешімімен
