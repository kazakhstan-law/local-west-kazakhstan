act_code: '43576'
requisite: Батыс Қазақстан облысы Зеленов аудандық мәслихаттың 2008 жылғы 25 желтоқсандағы № 10-2 шешімі. Батыс Қазақстан облысы Зеленов ауданы әділет басқармасында 2009 жылғы 19 қаңтарда № 7-7-76 тіркелді. Күші жойылды - Батыс Қазақстан облысы Зеленов аудандық мәслихаттың 2010 жылғы 31 наурыздағы № 21-11 шешімімен
