act_code: '44063'
requisite: Батыс Қазақстан облысы Зеленов аудандық мәслихаттың 2008 жылғы 25 желтоқсандағы № 10-10 шешімі. Батыс Қазақстан облысы Зеленов ауданы әділет басқармасында 2009 жылғы 5 ақпанда № 7-7-81 тіркелді. Күші жойылды - Батыс Қазақстан облысы Зеленов аудандық мәслихатының 2012 жылғы 19 сәуірдегі № 3-10 шешімімен
