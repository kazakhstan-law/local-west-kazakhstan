act_code: '41889'
requisite: Батыс Қазақстан облысы Зеленов аудандық мәслихаттың 2008 жылғы 3 қыркүйектегі № 8-4 шешімі. Батыс Қазақстан облысы Зеленов ауданы әділет басқармасында 2008 жылғы 9 қазанда № 7-7-72 тіркелген. Күші жойылды - Батыс Қазақстан облысы Зеленов аудандық мәслихатының 2012 жылғы 19 сәуірдегі № 3-3 шешімімен
