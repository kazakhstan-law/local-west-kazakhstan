act_code: '51958'
requisite: Батыс Қазақстан облысы Зеленов аудандық мәслихаттың 2010 жылғы 31 наурыздағы № 21-4 шешімі. Батыс Қазақстан облысы Зеленов ауданы әділет басқармасында 2010 жылғы 22 сәуірде № 7-7-106 тіркелді. Күші жойылды - Батыс Қазақстан облысы Зеленов аудандық мәслихатының 2014 жылғы 25 ақпандағы № 21-2 шешімімен
