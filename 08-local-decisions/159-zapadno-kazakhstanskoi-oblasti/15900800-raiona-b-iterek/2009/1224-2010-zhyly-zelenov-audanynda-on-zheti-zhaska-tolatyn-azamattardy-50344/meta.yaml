act_code: '50344'
requisite: Батыс Қазақстан облысы Зеленов ауданы әкімінің 2009 жылғы 24 желтоқсандағы № 264 шешімі. Батыс Қазақстан облысы Зеленов ауданы әділет басқармасында 2010 жылғы 1 ақпанда № 7-7-100 тіркелді. Күші жойылды - Батыс Қазақстан облысы Зеленов ауданы әкімінің 2010 жылғы 20 сәуірдегі № 14 шешімімен
