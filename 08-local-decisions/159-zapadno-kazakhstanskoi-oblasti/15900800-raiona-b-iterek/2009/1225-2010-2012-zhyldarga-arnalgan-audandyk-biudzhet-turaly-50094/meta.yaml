act_code: '50094'
requisite: Батыс Қазақстан облысы Зеленов аудандық мәслихаттың 2009 жылғы 25 желтоқсандағы № 19-1 шешімі. Батыс Қазақстан облысы Зеленов ауданы әділет басқармасында 2010 жылғы 15 қаңтарда № 7-7-99 тіркелді. Күші жойылды - Батыс Қазақстан облысы Зеленов аудандық мәслихатының 2011 жылғы 31 наурыздағы № 31-4 шешімімен
