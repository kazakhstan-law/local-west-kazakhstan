act_code: '120896'
requisite: Решение Зеленовского районного маслихата Западно-Казахстанской области от 28 марта 2018 года № 20-8. Зарегистрировано Департаментом юстиции Западно-Казахстанской области 17 апреля 2018 года № 5164. Утратило силу решением маслихата района Бәйтерек Западно-Казахстанской области от 7 июня 2024 года № 15-29 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: Об утверждении методики оценки деятельности административных государственных служащих корпуса «Б» государственного учреждения «Аппарат маслихата района Бәйтерек»
  kaz: «Бәйтерек ауданы мәслихатының аппараты» мемлекеттік мекемесінің «Б» корпусы мемлекеттік әкімшілік қызметшілерінің қызметін бағалау әдістемесін бекіту туралы
