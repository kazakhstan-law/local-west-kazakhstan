  title:
    rus: О внесении изменений в решение Зеленовского районного маслихата от 28 марта 2018 года № 20-8 «Об утверждении методики оценки деятельности административных государственных служащих корпуса "Б" государственного учреждения «Аппарат Зеленовского районного маслихата»
    kaz: Зеленов аудандық мәслихатының 2018 жылғы 28 наурыздағы №20-8 «Зеленов аудандық мәслихатының аппараты» мемлекеттік мекемесінің «Б» корпусының мемлекеттік әкімшілік қызметшілерінің қызметін бағалау әдістемесін бекіту туралы» шешіміне өзгерістер енгізу туралы
