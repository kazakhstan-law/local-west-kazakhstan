  title:
    rus: О внесении изменений в решение маслихата района Бәйтерек от 3 апреля 2020 года № 47-5 «Об утверждении Правил и размера возмещения затрат на обучение на дому детей с ограниченными возможностями из числа инвалидов по индивидуальному учебному плану»
    kaz: Бәйтерек аудандық мәслихатының 2020 жылғы 3 сәуірдегі № 47-5 «Мүгедектер қатарындағы кемтар балаларды жеке оқыту жоспары бойынша үйде оқытуға жұмсаған шығындарын өндіріп алу қағидасы мен мөлшерін бекіту туралы» шешіміне өзгерістер енгізу туралы
