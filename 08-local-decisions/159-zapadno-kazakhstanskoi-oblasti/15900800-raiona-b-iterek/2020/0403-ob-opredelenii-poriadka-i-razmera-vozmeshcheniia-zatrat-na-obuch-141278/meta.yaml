requisite: Решение маслихата района Бәйтерек Западно-Казахстанской области от 3 апреля 2020 года № 47-5. Зарегистрировано Департаментом юстиции Западно-Казахстанской области 8 апреля 2020 года № 6133
title:
  rus: Об определении порядка и размера возмещения затрат на обучение на дому детей с ограниченными возможностями из числа детей с инвалидностью по индивидуальному учебному плану по району Бәйтерек
  kaz: Бәйтерек ауданы бойынша жеке оқыту жоспары бойынша мүгедектігі бар балалар қатарындағы кемтар балаларды үйде оқытуға жұмсалған шығындарды өтеу тәртібі және мөлшерін айқындау туралы
