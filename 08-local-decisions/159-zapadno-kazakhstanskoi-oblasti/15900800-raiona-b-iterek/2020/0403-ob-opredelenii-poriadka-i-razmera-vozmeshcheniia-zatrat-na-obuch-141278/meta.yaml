  title:
    rus: О внесении изменения в решение маслихата района Бәйтерек от 3 апреля 2020 года № 47-5 «Об определении порядка и размера возмещения затрат на обучение на дому детей с ограниченными возможностями из числа детей с инвалидностью по индивидуальному учебному плану по району Бәйтерек»
    kaz: Бәйтерек ауданының мәслихатының «Бәйтерек ауданы бойынша жеке оқыту жоспары бойынша мүгедектігі бар балалар қатарындағы кемтар балаларды үйде оқытуға жұмсалған шығындарды өтеу тәртібі және мөлшерін айқындау туралы» 2020 жылғы 3 сәуірдегі № 47-5 шешіміне өзгеріс енгізу туралы
