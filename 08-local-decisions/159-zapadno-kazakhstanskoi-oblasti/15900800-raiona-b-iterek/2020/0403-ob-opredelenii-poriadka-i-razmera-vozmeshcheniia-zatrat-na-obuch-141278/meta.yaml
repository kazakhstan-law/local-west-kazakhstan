  title:
    rus: О внесении изменений в решение маслихата района Бәйтерек от 3 апреля 2020 года № 47-5 «Об определении порядка и размера возмещения затрат на обучение на дому детей ограниченными возможностями из числа детей с инвалидностью по индивидуальному учебному плану по району Бәйтерек»
    kaz: Бәйтерек аудандық мәслихатының 2020 жылғы 3 сәуірдегі № 47-5 «Бәйтерек ауданы бойынша мүгедектігі бар балалар қатарындағы кемтар балаларды жеке оқыту жоспары бойынша үйде оқытуға жұмсаған шығындарын өндіріп алу тәртібі мен мөлшерін айқындау туралы» шешіміне өзгерістер енгізу туралы
