act_code: '147287'
requisite: Решение маслихата района Бәйтерек Западно-Казахстанской области от 6 октября 2020 года № 55-3. Зарегистрировано Департаментом юстиции Западно-Казахстанской области 9 октября 2020 года № 6418
title:
  rus: Об определении специализированных мест для организации и проведения мирных собраний, порядка их использования, норм их предельной заполняемости, требований к их материально-техническому и организационному обеспечению, границ прилегающих территорий, в которых запрещено проведение пикетирования по району Бәйтерек
  kaz: Бәйтерек ауданында бейбіт жиналыстарды ұйымдастыру және өткізу үшін арнайы орындарды, оларды пайдалану тәртібін, шекті толтырылу нормаларын, олардың материалдық-техникалық және ұйымдастырушылық қамтамасыз етуге қойылатын талаптарын, пикеттеуді өткізуге тыйым салынған іргелес аумақтардың шекараларын айқындау туралы
