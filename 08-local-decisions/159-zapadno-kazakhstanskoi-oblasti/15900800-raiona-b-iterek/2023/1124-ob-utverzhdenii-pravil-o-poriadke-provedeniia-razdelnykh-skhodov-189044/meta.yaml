act_code: '189044'
requisite: Решение маслихата района Бәйтерек Западно-Казахстанской области от 24 ноября 2023 года № 9-26
title:
  rus: Об утверждении Правил о порядке проведения раздельных сходов местного сообщества и определения количества представителей жителей села, улицы, многоквартирного жилого дома для участия в сходе местного сообщества на территории района Бәйтерек
  kaz: Бәйтерек ауданының аумағында жергілікті қоғамдастықтың бөлек жиындарын өткізудің және жергілікті қоғамдастық жиынына қатысу үшін ауыл, көше, көппәтерлі тұрғын үй тұрғындары өкілдерінің санын  айқындау тәртібі туралы қағидаларын бекіту туралы
