act_code: '190421'
requisite: Решение маслихата района Бәйтерек Западно-Казахстанской области от 21 декабря 2023 года № 10-35 Зарегистрирован в Департаменте юстиции Западно-Казахстанской области 22 декабря 2023 года № 7296-07
title:
  rus: Об установлении категории автостоянок (паркингов), увеличений размеров базовых ставок налога на земли, выделенные под автостоянки (паркинги), определении близлежащего населенного пункта, базовые ставки на земли которого будут применяться при исчислении налога на земли других категорий, выделенные под автостоянки (паркинги), автозаправочные станции по району Бәйтерек
  kaz: Бәйтерек ауданы бойынша автотұрақтардың (паркингтердің) санаттарын белгілеу, автотұрақтар (паркингтер) үшін бөлінген жерлерге базалық салық мөлшерлемелерінің мөлшерін ұлғайту, автожанармай құю станциялары, автотұрақтар (паркингтер) үшін бөлінген басқа санаттағы жерлерге салықты есептеу кезінде жерлерге базалық мөлшерлемелер қолданылатын жақын орналасқан елді мекенді айқындау туралы
