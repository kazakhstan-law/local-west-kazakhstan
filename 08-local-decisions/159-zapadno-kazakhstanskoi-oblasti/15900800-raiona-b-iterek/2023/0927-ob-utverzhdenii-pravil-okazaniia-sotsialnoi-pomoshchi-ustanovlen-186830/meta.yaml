  title:
    rus: О внесении изменений в решение маслихата района Бәйтерек от 27 сентября 2023 года № 8-8 «Об утверждении Правил оказания социальной помощи, установления ее размеров и определения перечня отдельных категорий нуждающихся граждан района Бәйтерек»
    kaz: Бәйтерек ауданы мәслихатының 2023 жылғы 27 қыркүйектегі № 8-8 «Бәйтерек ауданының әлеуметтік көмек көрсетудің, оның мөлшерлерін белгілеудің және мұқтаж азаматтардың жекелеген санаттарының тізбесін айқындаудың қағидаларын бекіту туралы» шешіміне өзгерістер енгізу туралы
