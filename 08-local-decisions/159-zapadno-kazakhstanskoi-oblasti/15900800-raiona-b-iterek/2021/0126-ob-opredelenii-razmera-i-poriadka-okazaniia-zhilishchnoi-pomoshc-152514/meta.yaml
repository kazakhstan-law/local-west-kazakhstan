  title:
    rus: О внесении изменений в решение маслихата района Бәйтерек от 26 января 2021 года № 2-4 «Об утверждении Правил определения размера и порядка оказания жилищной помощи малообеспеченным семьям (гражданам) в районе Бәйтерек»
    kaz: Бәйтерек ауданы мәслихатының 2021 жылғы 26 қаңтардағы № 2-4 «Бәйтерек ауданында аз қамтамасыз етілген отбасыларға (азаматтарға) тұрғын үй көмегін көрсетудің мөлшерін және тәртібін айқындау қағидаларын бекіту туралы» шешіміне өзгерістер енгізу туралы
