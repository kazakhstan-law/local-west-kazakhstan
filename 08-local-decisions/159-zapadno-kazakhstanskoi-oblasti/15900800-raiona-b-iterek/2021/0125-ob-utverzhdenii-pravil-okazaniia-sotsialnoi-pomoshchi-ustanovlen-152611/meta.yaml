requisite: Решение маслихата района Бәйтерек Западно-Казахстанской области от 25 января 2021 года № 2-3. Зарегистрировано Департаментом юстиции Западно-Казахстанской области 2 февраля 2021 года № 6821. Утратило силу решением маслихата района Бәйтерек Западно-Казахстанской области от 7 сентября 2023 года № 7-2 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: Об утверждении Правил оказания социальной помощи, установления размеров и определения перечня отдельных категорий нуждающихся  граждан района Бәйтерек
  kaz: Бәйтерек ауданының әлеуметтік көмек көрсету, оның мөлшерлерін белгілеу және мұқтаж азаматтардың жекелеген санаттарының тізбесін   айқындау қағидаларын бекіту туралы
