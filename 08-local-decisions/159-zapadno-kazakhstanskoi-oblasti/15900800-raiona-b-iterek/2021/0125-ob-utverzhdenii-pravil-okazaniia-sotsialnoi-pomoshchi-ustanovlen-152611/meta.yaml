  requisite: Решение маслихата района Бәйтерек Западно-Казахстанской области от 14 ноября 2022 года № 22-3. Зарегистрировано в Министерстве юстиции Республики Казахстан 17 ноября 2022 года № 30581. Утратило силу решением маслихата района Бәйтерек Западно-Казахстанской области от 7 сентября 2023 года № 7-2 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
  title:
    rus: О внесении изменений в решение маслихата района Бәйтерек Западно-Казахстанской области от 25 января 2021 года № 2-3 «Об утверждении Правил оказания социальной помощи, установления размеров и определения перечня отдельных категорий нуждающихся граждан района Бәйтерек»
    kaz: Батыс Қазақстан облысы Бәйтерек аудандық мәслихатының 2021 жылғы 25 қаңтардағы № 2-3 «Бәйтерек ауданының әлеуметтік көмек көрсету, оның мөлшерлерін белгілеу және мұқтаж азаматтардың жекеленген санаттарының тізбесін айқындау қағидаларын бекіту туралы» шешіміне өзгерістер енгізу туралы
