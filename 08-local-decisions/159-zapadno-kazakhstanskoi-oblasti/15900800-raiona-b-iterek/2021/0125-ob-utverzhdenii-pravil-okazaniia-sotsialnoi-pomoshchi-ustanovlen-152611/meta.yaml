  title:
    rus: О внесении изменения в решение маслихата района Бәйтерек Западно-Казахстанской области от 25 января 2021 года №2-3 «Об утверждении Правил оказания социальной помощи, установления размеров и определения перечня отдельных категорий нуждающихся граждан района Бәйтерек»
    kaz: Батыс Қазақстан облысы Бәйтерек аудандық мәслихатының 2021 жылғы 25 қаңтардағы №2-3 «Бәйтерек ауданының әлеуметтік көмек көрсету, оның мөлшерлерін белгілеу және мұқтаж азаматтардың жекеленген санаттарының тізбесін айқындау қағидаларын бекіту туралы» шешіміне өзгеріс енгізу туралы
