  title:
    rus: О внесении изменений в решение маслихата района Бәйтерек от 25 января 2021 года № 2-3 «Об утверждении Правил оказания социальной помощи, установления размеров и определения перечня отдельных категорий нуждающихся граждан района Бәйтерек»
    kaz: Бәйтерек ауданы мәслихатының 2021 жылғы 25 қаңтардағы № 2-3 «Бәйтерек ауданының әлеуметтік көмек көрсету, оның мөлшерлерін белгілеу және мұқтаж азаматтардың жекелеген санаттарының тізбесін айқындау қағидаларын бекіту туралы» шешіміне өзгерістер енгізу туралы
