  title:
    rus: О внесении изменений и дополнения в решение Каратобинского районного маслихата от 24 декабря 2013 года № 19-13 «Об утверждении Правил оказания социальной помощи, установления размеров и определения перечня отдельных категорий нуждающихся граждан Каратобинского района»
    kaz: Қаратөбе аудандық мәслихатының 2013 жылғы 24 желтоқсандағы № 19-13 «Қаратөбе ауданының әлеуметтік көмек көрсету, оның мөлшерлерін белгілеу және мұқтаж азаматтардың жекелеген санаттарының тізбесін айқындау қағидасын бекіту туралы» шешіміне өзгерістер мен толықтыру енгізу туралы
