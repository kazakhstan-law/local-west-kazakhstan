  title:
    rus: О внесении изменений в решение Каратобинского районного маслихата от 26 марта 2013 года № 9-2 «Об утверждении Правил определения размера и порядка оказания жилищной помощи малообеспеченным семьям (гражданам) в Каратобинском районе»
    kaz: Қаратөбе аудандық мәслихатының 2013 жылғы 26 наурыздағы № 9-2 «Қаратөбе ауданында аз қамтамасыз етілген отбасыларға (азаматтарға) тұрғын үй көмегін көрсетудің мөлшерін және тәртібін айқындау Қағидасын бекіту туралы» шешіміне өзгерістер енгізу туралы
