act_code: '53184'
requisite: Батыс Қазақстан облысы Қаратөбе аудандық мәслихаттың 2010 жылғы 20 мамырдағы № 20-4 шешімі. Батыс Қазақстан облысы Қаратөбе ауданы әділет басқармасында 2010 жылғы 18 маусымда № 7-9-97 тіркелді. Күші жойылды - Батыс Қазақстан облысы Қаратөбе аудандық мәслихатының 2012 жылғы 17 сәуірдегі № 2-7 шешімімен
