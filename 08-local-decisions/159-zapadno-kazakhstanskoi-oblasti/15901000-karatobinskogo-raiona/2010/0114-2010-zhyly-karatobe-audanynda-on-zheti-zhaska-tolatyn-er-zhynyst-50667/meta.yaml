act_code: '50667'
requisite: Батыс Қазақстан облысы Қаратөбе ауданы әкімінің 2010 жылғы 14 қаңтардағы № 2 шешімі. Батыс Қазақстан облысы Қаратөбе ауданы әділет басқармасында 2010 жылғы 12 ақпанда № 7-9-91 тіркелді. Күші жойылды - Батыс Қазақстан облысы Қаратөбе ауданы әкімінің 2010 жылғы 9 сәуірдегі № 7 шешімімен
