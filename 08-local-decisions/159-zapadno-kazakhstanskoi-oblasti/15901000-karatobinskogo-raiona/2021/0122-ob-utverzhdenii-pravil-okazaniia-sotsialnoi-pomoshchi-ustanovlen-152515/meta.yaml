requisite: Решение Каратобинского районного маслихата Западно-Казахстанской области от 22 января 2021 года № 2-1. Зарегистрировано Департаментом юстиции Западно-Казахстанской области 28 января 2021 года № 6819. Утратило силу решением Каратобинского районного маслихата Западно - Казахстанской области от 8 сентября 2023 года № 7-10 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
