    kaz: Қаратөбе аудандық мәслихатының «Қаратөбе ауданының әлеуметтік көмек көрсетудің, оның мөлшерлерін белгілеудің және мұқтаж азаматтардың жекелеген санаттарының тізбесін айқындаудың қағидаларын бекіту туралы» 2023 жылғы 14 қарашадағы № 8-2 шешіміне өзгеріс енгізу туралы
