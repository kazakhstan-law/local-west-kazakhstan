act_code: '178001'
requisite: Решение Каратобинского районного маслихата Западно-Казахстанской области от 17 января 2023 года № 27-3. Утратило силу решением Каратобинского районного маслихата Западно-Казахстанской области от 14 ноября 2023 года № 8-4 (вводится в действие с 01.01.2023 года)
title:
  rus: О предоставлении специалистам в области здравоохранения, образования, социального обеспечения, культуры, спорта и агропромышленного комплекса, государственным служащим аппаратов акимов сельских округов, прибывшим для работы и проживания в сельские населенные пункты Каратобинского района подъемного пособия и социальной поддержки для приобретения или строительства жилья на 2023 год
  kaz: 2023 жылға Қаратөбе ауданының ауылдық елдi мекендеріне жұмыс iстеуге және тұруға келген денсаулық сақтау, бiлiм беру, әлеуметтiк қамсыздандыру, мәдениет, спорт және агроөнеркәсіптік кешен саласындағы мамандарға, ауылдық округтер әкімдері аппаратының мемлекеттік қызметшілеріне көтерме жәрдемақы және тұрғын үй сатып алу немесе салу үшін әлеуметтік қолдау көрсету туралы
