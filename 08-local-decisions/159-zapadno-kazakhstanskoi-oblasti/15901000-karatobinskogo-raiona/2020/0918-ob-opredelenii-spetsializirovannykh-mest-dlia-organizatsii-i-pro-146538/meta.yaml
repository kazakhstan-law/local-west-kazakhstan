act_code: '146538'
requisite: Решение Каратобинского районного маслихата Западно-Казахстанской области от 18 сентября 2020 года № 46-6. Зарегистрировано Департаментом юстиции Западно-Казахстанской области 22 сентября 2020 года № 6369
title:
  rus: Об определении специализированных мест для организации и проведения мирных собраний, порядка их использования, норм их предельной заполняемости, требований к их материально-техническому и организационному обеспечению, границ прилегающих территорий, в которых запрещено проведение пикетирования по Каратобинскому району
  kaz: Қаратөбе ауданында бейбіт жиналыстарды ұйымдастыру және өткізу үшін арнайы орындарды, оларды пайдалану тәртібін, шекті толтырылу нормаларын, олардың материалдық-техникалық және ұйымдастырушылық қамтамасыз етуге қойылатын талаптарын, пикеттеуді өткізуге тыйым салынған іргелес аумақтардың шекараларын айқындау туралы
