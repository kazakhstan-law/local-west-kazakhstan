requisite: Решение Каратобинского районного маслихата Западно-Казахстанской области от 3 марта 2014 года № 20-1. Зарегистрировано Департаментом юстиции Западно-Казахстанской области 2 апреля 2014 года № 3481. Утратило силу решением Каратобинского районного маслихата Западно - Казахстанской области от 8 сентября 2023 года № 7-10 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: Об утверждении Правил о порядке проведения раздельных сходов местного сообщества и определения количества представителей жителей села, улицы, многоквартирного жилого дома для участия в сходе местного сообщества на территории Каратобинского района
  kaz: Қаратөбе ауданының аумағында Жергілікті қоғамдастықтың бөлек жиындарын өткiзу және жергiлiктi қоғамдастық жиынына қатысу үшiн ауыл, көше, көппәтерлi тұрғын үй тұрғындары өкiлдерiнiң санын айқындау тәртiбi туралы қағидасын бекiту туралы
