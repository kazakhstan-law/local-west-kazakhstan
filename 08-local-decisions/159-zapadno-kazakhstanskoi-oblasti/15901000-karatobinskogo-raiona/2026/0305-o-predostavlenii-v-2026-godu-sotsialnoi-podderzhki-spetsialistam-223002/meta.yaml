act_code: '223002'
requisite: Решение Каратобинского районного маслихата Западно-Казахстанской области от 5 марта 2026 года № 37-1
title:
  rus: О предоставлении в 2026 году социальной поддержки специалистам здравоохранения, образования, социального обеспечения, культуры, спорта и агропромышленного комплекса, государственным служащим аппаратов акимов сел, поселка, сельских округов, прибывшим для работы и проживания в сельские населенные пункты Каратобинского района
  kaz: 2026 жылы Қаратөбе ауданының ауылдық елдi мекендерге жұмыс iстеуге және тұруға келген денсаулық сақтау, бiлiм беру, әлеуметтiк қамсыздандыру, мәдениет, спорт және агроөнеркәсіптік кешен саласындағы мамандарға, ауылдар, кенттер, ауылдық округтер әкімдері аппараттарының мемлекеттік қызметшілеріне әлеуметтік қолдау көрсету туралы
