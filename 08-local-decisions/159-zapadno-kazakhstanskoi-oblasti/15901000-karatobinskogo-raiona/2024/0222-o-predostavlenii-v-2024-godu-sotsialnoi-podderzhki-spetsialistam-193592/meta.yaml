act_code: '193592'
requisite: Решение Каратобинского районного маслихата Западно-Казахстанской области от 22 февраля 2024 года № 12-4. Утратило силу решением Каратобинского районного маслихата Западно-Казахстанской области от 20 декабря 2024 года № 22-8 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования и распространяется на правоотношения, возникшие с 1 января 2025 года)
title:
  rus: О предоставлении в 2024 году социальной поддержки специалистам здравоохранения, образования, социального обеспечения, культуры, спорта и агропромышленного комплекса, государственным служащим аппаратов акимов сел, поселка, сельских округов, прибывшим для работы и проживания в сельские населенные пункты Каратобинского района
  kaz: 2024 жылы Қаратөбе ауданының ауылдық елдi мекендерге жұмыс iстеуге және тұруға келген денсаулық сақтау, бiлiм беру, әлеуметтiк қамсыздандыру, мәдениет, спорт және агроөнеркәсіптік кешен саласындағы мамандарға, ауылдар, кенттер, ауылдық округтер әкімдері аппараттарының мемлекеттік қызметшілеріне әлеуметтік қолдау көрсету туралы
