act_code: '43184'
requisite: Батыс Қазақстан облысы Қаратөбе аудандық мәслихаттың 2008 жылғы 20 желтоқсандағы № 9-2/1 шешімі. Батыс Қазақстан облысы Қаратөбе ауданы әділет басқармасында 2009 жылғы 5 қаңтарда № 7-9-70 тіркелді. Күші жойылды - Батыс Қазақстан облысы Қаратөбе аудандық мәслихатының 2009 жылғы 22 желтоқсандағы № 16-7 шешімімен
