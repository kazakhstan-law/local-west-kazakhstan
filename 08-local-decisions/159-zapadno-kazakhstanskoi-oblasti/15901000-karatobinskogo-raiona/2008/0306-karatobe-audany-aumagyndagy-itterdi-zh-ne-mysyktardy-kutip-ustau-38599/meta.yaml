act_code: '38599'
requisite: Батыс Қазақстан облысы Қаратөбе аудандық мәслихаттың 2008 жылғы 6 наурыздағы № 4-9 шешімі. Батыс Қазақстан облысы Қаратөбе ауданы әділет басқармасында 2008 жылғы 20 наурызда № 7-9-60 тіркелді. Күші жойылды - Батыс Қазақстан облысы Қаратөбе аудандық мәслихатының 2012 жылғы 21 маусымдағы № 3-5 шешімімен
