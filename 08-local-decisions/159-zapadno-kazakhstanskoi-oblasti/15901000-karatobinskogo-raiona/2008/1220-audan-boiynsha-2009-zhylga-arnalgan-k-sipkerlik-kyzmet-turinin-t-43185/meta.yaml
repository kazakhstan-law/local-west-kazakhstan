act_code: '43185'
requisite: Батыс Қазақстан облысы Қаратөбе аудандық мәслихаттың 2008 жылғы 20 желтоқсандағы № 9-8 шешімі. Батыс Қазақстан облысы Қаратөбе ауданы әділет басқармасында 2009 жылғы 5 қаңтарда № 7-9-71 тіркелді. Күші жойылды - Батыс Қазақстан облысы Қаратөбе аудандық мәслихатының 2010 жылғы 15 сәуірдегі № 19-5 шешімімен
