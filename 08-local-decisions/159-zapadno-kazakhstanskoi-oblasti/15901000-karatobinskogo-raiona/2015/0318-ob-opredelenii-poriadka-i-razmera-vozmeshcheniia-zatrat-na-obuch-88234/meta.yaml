  title:
    rus: О внесении изменений и дополнения в решение Каратобинского районного маслихата от 18 марта 2015 года № 30-4 «Об определении порядка и размера возмещения затрат на обучение на дому детей с ограниченными возможностями из числа инвалидов по индивидуальному учебному плану»
    kaz: Қаратөбе аудандық мәслихатының 2015 жылғы 18 наурыздағы № 30-4 «Мүгедектер қатарындағы кемтар балаларды жеке оқыту жоспары бойынша үйде оқытуға жұмсаған шығындарын өндіріп алу тәртібін және мөлшерін айқындау туралы» шешіміне өзгерістер мен толықтыру енгізу туралы
