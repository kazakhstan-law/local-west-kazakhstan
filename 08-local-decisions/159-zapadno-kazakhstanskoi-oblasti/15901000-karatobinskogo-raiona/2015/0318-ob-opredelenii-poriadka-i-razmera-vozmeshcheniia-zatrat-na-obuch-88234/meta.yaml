  title:
    rus: О внесении изменения в решение Каратобинского районного маслихата от 18 марта 2015 года № 30-4 «Об определении порядка и размера возмещения затрат на обучение на дому детей с ограниченными возможностями из числа детей с инвалидностью по индивидуальному учебному плану в Каратобинском районе»
    kaz: Қаратөбе аудандық мәслихатының «Қаратөбе ауданында жеке оқыту жоспары бойынша мүгедектігі бар балалар қатарындағы кемтар балаларды үйде оқытуға жұмсалған шығындарды өтеу тәртібі мен мөлшерін айқындау туралы» 2015 жылғы 18 наурыздағы № 30-4 шешіміне өзгеріс енгізу туралы
