requisite: Батыс Қазастан облысы Қаратөбе аудандық мәслихаттың 2009 жылғы 2 наурыздағы № 10-8 шешімі. Батыс Қазақстан облысы Қаратөбе ауданы әділет басқармасында 2009 жылғы 17 наурызда № 7-9-78 тіркелді. Күші жойылды - Батыс Қазақстан облысы Қаратөбе аудандық мәслихатының 2012 жылғы 18 желтоқсандығы № 19-6 шешімімен
