act_code: '49838'
requisite: Батыс Қазақстан облысы Қаратөбе аудандық мәслихаттың 2009 жылғы 22 желтоқсандағы № 16-2 шешімі. Батыс Қазақстан облысы Қаратөбе ауданы әділет басқармасында 2010 жылғы 11 қаңтарда № 7-9-89 тіркелді. Күші жойылды - Батыс Қазақстан облысы Қаратөбе ауданы мәслихатының 2010 жылғы 25 желтоқсандағы № 25-7 шешімімен
