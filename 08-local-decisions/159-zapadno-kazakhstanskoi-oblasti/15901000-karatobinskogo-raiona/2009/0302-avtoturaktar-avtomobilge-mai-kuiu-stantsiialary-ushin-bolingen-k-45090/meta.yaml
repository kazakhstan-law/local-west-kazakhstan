act_code: '45090'
requisite: Батыс Қазақстан облысы Қаратөбе аудандық мәслихаттың 2009 жылғы 2 наурыздағы № 10-9 шешімі. Батыс Қазақстан облысы Қаратөбе ауданы әділет басқармасында 2009 жылғы 19 наурызда № 7-9-80 тіркелді. Күші жойылды - Батыс Қазақстан облысы Қаратөбе аудандық мәслихаттың 2011 жылғы 21 маусымдағы № 29-6 шешімімен
