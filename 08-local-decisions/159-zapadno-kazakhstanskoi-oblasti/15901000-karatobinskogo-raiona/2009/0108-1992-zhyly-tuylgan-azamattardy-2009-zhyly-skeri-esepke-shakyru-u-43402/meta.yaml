requisite: Батыс Қазақстан облысы Қаратөбе ауданы әкімінің 2009 жылғы 8 қаңтардағы № 1 шешімі. Батыс Қазақстан облысы Қаратөбе ауданы әділет басқармасында 2009 жылғы 13 қаңтарда № 7-9-72 тіркелді. Күші жойылды - Батыс Қазақстан облысы Қаратөбе ауданы әкімінің 2009 жылғы 1 сәуірдегі № 10 шешімімен
