  title:
    rus: О внесении изменений в решение Чингирлауского районного маслихата от 29 декабря 2020 года № 65-1 «Об утверждении Правил оказания социальной помощи, установления размеров и определения перечня отдельных категорий нуждающихся граждан Чингирлауского района»
    kaz: Шыңғырлау аудандық мәслихатының 2020 жылғы 29 желтоқсандағы № 65-1 «Шыңғырлау ауданының әлеуметтік көмек көрсету, оның мөлшерлерін белгілеу және мұқтаж азаматтардың жекелеген санаттарының тізбесін айқындау қағидаларын бекіту туралы» шешіміне өзгерістер енгізу туралы
