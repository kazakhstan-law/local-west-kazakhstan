title:
  rus: Об отмене решения Чингирлауского районного маслихата от 30 июня 2022 года № 24-4 «Об утверждении Правил проведения раздельных сходов местного сообщества и определения количества представителей жителей села для участия в сходе местного сообщества на территории Чингирлауского района»
