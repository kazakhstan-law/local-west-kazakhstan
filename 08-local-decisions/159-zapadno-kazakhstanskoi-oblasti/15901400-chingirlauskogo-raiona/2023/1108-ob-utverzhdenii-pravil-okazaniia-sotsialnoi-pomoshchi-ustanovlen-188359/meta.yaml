  title:
    rus: О внесении изменений в решение Чингирлауского районного маслихата от 8 ноября 2023 года № 11-2 «Об утверждении Правил оказания социальной помощи, установления ее размеров и определения перечня отдельных категорий нуждающихся граждан Чингирлауского района»
