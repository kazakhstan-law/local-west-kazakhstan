  title:
    rus: О внесении изменений в решение акима Акбулакского сельского округа Чингирлауского района Западно-Казахстанской области от 22 мая 2013 года № 2 "Об установлении ветеринарного режима карантинной зоны с введением ограничительных мероприятий на территории Акбулакского сельского округа Чингирлауского района Западно-Казахстанской области"
    kaz: Батыс Қазақстан облысы Шыңғырлау ауданы Ақбұлақ селолық округі әкімінің 2013 жылғы 22 мамырдағы № 2 "Батыс Қазақстан облысы Шыңғырлау ауданы Ақбұлақ селолық округінің аумағында шектеу іс-шараларын енгізе отырып карантин аймағының ветеринариялық режимін белгілеу туралы" шешіміне өзгерістер енгізу туралы
