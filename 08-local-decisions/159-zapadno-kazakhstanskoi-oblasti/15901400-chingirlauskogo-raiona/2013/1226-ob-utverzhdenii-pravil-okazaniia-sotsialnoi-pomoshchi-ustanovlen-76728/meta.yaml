  title:
    rus: О внесении изменений в решение Чингирлауского районного маслихата от 26 декабря 2013 года № 18-5 «Об утверждении Правил оказания социальной помощи, установления размеров и определения перечня отдельных категорий нуждающихся граждан Чингирлауского района»
    kaz: Шыңғырлау аудандық мәслихатының 2013 жылғы 26 желтоқсандағы № 18-5 «Шыңғырлау ауданының әлеуметтік көмек көрсету, оның мөлшерлерін белгілеу және мұқтаж азаматтардың жекелеген санаттарының тізбесін айқындау қағидасын бекіту туралы» шешіміне өзгерістер енгізу туралы
