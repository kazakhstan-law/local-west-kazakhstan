requisite: Решение Чингирлауского районного маслихата Западно-Казахстанской области от 4 марта 2014 года № 19-3. Зарегистрировано Департаментом юстиции Западно-Казахстанской области 28 марта 2014 года № 3452. Утратило силу решением Чингирлауского районного маслихата Западно-Казахстанской области от 22 августа 2023 года № 9-8 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: Об утверждении Правил о порядке проведения раздельных сходов местного сообщества и определения количества представителей жителей села, улицы, многоквартирного жилого дома для участия в сходе местного сообщества на территории Чингирлауского района
  kaz: Шыңғырлау ауданының аумағында бөлек жергiлiктi қоғамдастық жиындарын өткiзу және жергiлiктi қоғамдастың жиынына қатысу үшiн ауыл, көше, көппәтерлi тұрғын үй тұрғындары өкiлдерiнiң санын айқындау тәртiбi туралы қағидасын бекiту туралы
