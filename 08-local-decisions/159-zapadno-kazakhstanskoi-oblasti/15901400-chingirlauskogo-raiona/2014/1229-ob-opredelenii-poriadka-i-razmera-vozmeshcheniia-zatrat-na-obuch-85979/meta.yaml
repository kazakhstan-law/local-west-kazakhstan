  title:
    rus: О внесении изменений в решение Чингирлауского районного маслихата от 5 октября 2022 года № 29-4 «Об определении порядка и размера возмещения затрат на обучение на дому детей с ограниченными возможностями из числа детей с инвалидностью по индивидуальному учебному плану в Чингирлауском районе»
    kaz: Шыңғырлау аудандық мәслихатының 2022 жылғы 5 қазандағы № 29-4 «Шыңғырлау ауданында мүгедектігі бар балалар қатарындағы кемтар балаларды жеке оқыту жоспары бойынша үйде оқытуға жұмсаған шығындарын өндіріп алу тәртібі мен мөлшерін айқындау туралы» шешіміне өзгерістер енгізу туралы
