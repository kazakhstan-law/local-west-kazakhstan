act_code: '85979'
requisite: Решение Чингирлауского районного маслихата Западно-Казахстанской области от 29 декабря 2014 года № 30-6. Зарегистрировано Департаментом юстиции Западно-Казахстанской области 14 января 2015 года № 3760. Утратило силу решением Чингирлауского районного маслихата Западно-Казахстанской области от 20 декабря 2023 года № 14-4 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: Об определении порядка и размера возмещения затрат на обучение на дому детей с ограниченными возможностями из числа детей с инвалидностью по индивидуальному учебному плану в Чингирлауском районе
  kaz: Шыңғырлау ауданында жеке оқыту жоспары бойынша мүгедектігі бар балалар қатарындағы кемтар балаларды үйде оқытуға жұмсалған шығындарды өтеу тәртібін және мөлшерін айқындау туралы
