  title:
    rus: О внесении изменений и дополнения в решение Чингирлауского районного маслихата от 29 декабря 2014 года № 30-6 «Об определении порядка и размера возмещения затрат на обучение на дому детей с ограниченными возможностями из числа инвалидов по индивидуальному учебному плану»
    kaz: Шыңғырлау аудандық мәслихатының 2014 жылғы 29 желтоқсандағы № 30-6 «Мүгедектер қатарындағы кемтар балаларды жеке оқыту жоспары бойынша үйде оқытуға жұмсаған шығындарын өндіріп алу тәртібін және мөлшерін айқындау туралы» шешіміне өзгерістер мен толықтыру енгізу туралы
