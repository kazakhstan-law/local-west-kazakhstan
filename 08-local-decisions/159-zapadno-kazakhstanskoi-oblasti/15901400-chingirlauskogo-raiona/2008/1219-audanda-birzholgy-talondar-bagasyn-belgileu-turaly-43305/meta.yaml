requisite: Батыс Қазақстан облысы Шыңғырлау аудандық мәслихатының 2008 жылғы 19 желтоқсандағы № 16-11 шешімі. Батыс Қазақстан облысы Шыңғырлау ауданы әділет басқармасында 2009 жылғы 12 қаңтарда № 7-13-89 тіркелді. Күші жойылды - Батыс Қазақстан облысы Шыңғырлау аудандық мәслихатының 2009 жылғы 18 ақпандағы № 17-8 шешімімен
