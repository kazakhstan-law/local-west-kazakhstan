requisite: Батыс Қазақстан облысы Шыңғырлау аудандық мәслихатының 2008 жылғы 6 наурыздағы № 6-3 шешімі. Батыс Қазақстан облысы Шыңғырлау ауданы әділет басқармасында 2008 жылғы 19 наурызда № 7-13-68 тіркелген. Күші жойылды - Батыс Қазақстан облысы Шыңғырлау аудандық мәслихатының 2010 жылғы 10 тамыздағы № 31-8 шешімімен
