act_code: '43307'
requisite: Батыс Қазақстан облысы Шыңғырлау аудандық мәслихатының 2008 жылғы 19 желтоқсандағы № 16-3 шешімі. Батыс Қазақстан облысы Шыңғырлау ауданы әділет басқармасында 2009 жылғы 12 қаңтарда № 7-13-91 тіркелді. Күші жойылды - Батыс Қазақстан облысы Шыңғырлау аудандық мәслихатының 2010 жылғы 25 ақпандағы № 27-11 шешімімен
