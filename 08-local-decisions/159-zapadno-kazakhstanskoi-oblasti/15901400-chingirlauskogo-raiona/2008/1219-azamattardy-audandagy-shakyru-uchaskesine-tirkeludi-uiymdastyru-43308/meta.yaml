act_code: '43308'
requisite: Батыс Қазақстан облысы Шыңғырлау ауданы әкімінің 2008 жылғы 19 желтоқсандағы № 15 шешімі. Батыс Қазақстан облысы Шыңғырлау ауданы әділет басқармасында 2009 жылғы 12 қаңтарда № 7-13-92 тіркелді. Күші жойылды - Батыс Қазақстан облысы Шыңғырлау ауданы әкімінің 2009 жылғы 5 наурыздағы № 3 шешімімен
