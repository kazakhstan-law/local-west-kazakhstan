requisite: Батыс Қазақстан облысы Шыңғырлау аудандық мәслихатының 2008 жылғы 19 желтоқсандағы № 16-12 шешімі. Батыс Қазақстан облысы Шыңғырлау ауданы әділет басқармасында 2009 жылғы 12 қаңтарда № 7-13-90 тіркелді. Күші жойылды - Батыс Қазақстан облысы Шыңғырлау аудандық мәслихаттың 2009 жылғы 25 сәуірдегі № 18-2 шешімімен
