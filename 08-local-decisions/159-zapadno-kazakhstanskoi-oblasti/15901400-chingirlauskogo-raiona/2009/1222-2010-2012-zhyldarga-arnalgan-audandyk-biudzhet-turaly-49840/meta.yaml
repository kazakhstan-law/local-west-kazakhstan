act_code: '49840'
requisite: Батыс Қазақстан облысы Шыңғырлау аудандық мәслихатының 2009 жылғы 22 желтоқсандағы № 25-3 шешімі. Батыс Қазақстан облысы Шыңғырлау ауданы әділет басқармасында 2010 жылғы 14 қаңтарда № 7-13-119 тіркелді. Күші жойылды - Батыс Қазақстан облысы Шыңғырлау аудандық мәслихатының 2013 жылғы 25 маусымдағы № 12-9 шешімімен
