act_code: '45095'
requisite: Батыс Қазақстан облысы Шыңғырлау аудандық мәслихатының 2009 жылғы 18 ақпандағы № 17-8 шешімі. Батыс Қазақстан облысы Шыңғырлау ауданы әділет басқармасында 2009 жылғы 27 наурызда № 7-13-94 тіркелді. Күші жойылды - Батыс Қазақстан облысы Шыңғырлау аудандық мәслихатының 2013 жылғы 29 наурыздағы № 10-4 шешімімен
