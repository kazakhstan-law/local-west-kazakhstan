act_code: '54432'
requisite: Батыс Қазақстан облысы Шыңғырлау аудандық мәслихатының 2010 жылғы 10 тамыздағы № 31-8 шешімі. Батыс Қазақстан облысы Шыңғырлау ауданы әділет басқармасында 2010 жылғы 10 қыркүйекте № 7-13-131 тіркелді. Күші жойылды - Батыс Қазақстан облысы Шыңғырлау аудандық мәслихатының 2013 жылғы 10 қазандағы № 17-3 шешімімен
