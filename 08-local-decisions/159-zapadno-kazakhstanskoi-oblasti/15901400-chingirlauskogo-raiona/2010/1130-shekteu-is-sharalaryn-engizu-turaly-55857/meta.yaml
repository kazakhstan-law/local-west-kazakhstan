requisite: Батыс Қазақстан облысы Шыңғырлау ауданы Ақбұлақ селолық округі әкімінің 2010 жылғы 30 қарашадағы № 1 шешімі. Батыс Қазақстан облысы Шыңғырлау ауданы әділет басқармасында 2010 жылғы 13 желтоқсанда № 7-13-135 тіркелді. Күші жойылды - Батыс Қазақстан облысы Шыңғырлау ауданы Ақбұлақ селолық округі әкімінің 2012 жылғы 18 қаңтардағы № 1 шешімімен
