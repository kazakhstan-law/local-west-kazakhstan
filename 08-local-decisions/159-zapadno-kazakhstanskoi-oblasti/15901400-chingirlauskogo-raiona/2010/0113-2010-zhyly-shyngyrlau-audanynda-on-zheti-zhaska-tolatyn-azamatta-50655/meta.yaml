requisite: Батыс Қазақстан облысы Шыңғырлау ауданы әкімінің 2010 жылғы 13 қаңтардағы № 1 шешімі. Батыс Қазақстан облысы Шыңғырлау ауданы әділет басқармасында 2010 жылғы 15 ақпанда № 7-13-122 тіркелді. Күші жойылды - Батыс Қазақстан облысы Шыңғырлау ауданы әкімінің 2010 жылғы 1 сәуірдегі № 4 шешімімен
