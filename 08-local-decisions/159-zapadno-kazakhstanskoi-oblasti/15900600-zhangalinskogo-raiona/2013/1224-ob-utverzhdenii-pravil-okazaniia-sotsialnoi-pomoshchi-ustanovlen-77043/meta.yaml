  title:
    rus: О внесении изменений в решение Жангалинского районного маслихата от 24 декабря 2013 года № 15-4 «Об утверждении Правил оказания социальной помощи, установления размеров и определения перечня отдельных категорий нуждающихся граждан Жангалинского района»
    kaz: Жаңақала аудандық мәслихатының 2013 жылғы 24 желтоқсандағы № 15-4 «Жаңақала ауданының әлеуметтік көмек көрсету, оның мөлшерлерін белгілеу және мұқтаж азаматтардың жекелеген санаттарының тізбесін айқындау қағидасын бекіту туралы» шешіміне өзгерістер енгізу туралы
