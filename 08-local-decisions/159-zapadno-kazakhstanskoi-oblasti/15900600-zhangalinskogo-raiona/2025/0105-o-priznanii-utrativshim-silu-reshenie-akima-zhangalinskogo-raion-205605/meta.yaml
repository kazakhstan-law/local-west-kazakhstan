act_code: '205605'
requisite: Решение акима Жангалинского района Западно-Казахстанской области от 5 января 2025 года № 1
title:
  rus: О признании утратившим силу решение акима Жангалинского района «Об объявлении чрезвычайной ситуации природного характера местного масштаба на территории Жанаказанского, Мастексайского, Копжасарского сельских округов и села Сарыкол Жанажолского сельского округа Жангалинского района» от 27 сентября 2024 года № 9
  kaz: Жаңақала ауданы әкімінің «Жаңақала ауданының Жаңақазан, Мастексай, Көпжасар ауылдық округтері және Жаңажол ауылдық округінің Сарыкөл ауылы аумағындағы жергілікті ауқымдағы табиғи сипаттағы төтенше жағдайды жариялау туралы» 2024 жылғы 27 қыркүйектегі № 9 шешімінің күшін жою деп тану туралы
