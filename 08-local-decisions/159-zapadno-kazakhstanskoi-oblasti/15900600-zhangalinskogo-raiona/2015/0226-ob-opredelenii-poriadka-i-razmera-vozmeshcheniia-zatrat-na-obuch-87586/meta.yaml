    rus: О внесении изменения в решение Жангалинского районного маслихата от 26 февраля 2015 года № 25-6 «Об определении порядка и размера возмещения затрат на обучение на дому детей с ограниченными возможностями из числа детей с инвалидностью по индивидуальному учебному плану»
    kaz: Жаңақала аудандық мәслихатының «Жеке оқыту жоспары бойынша мүгедектігі бар балалар қатарындағы кемтар балаларды үйде оқытуға жұмсалған шығындарды өтеу тәртібін және мөлшерін айқындау туралы» 2015 жылғы 26 ақпандағы № 25-6 шешіміне өзгеріс енгізу туралы
