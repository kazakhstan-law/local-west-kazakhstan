  title:
    rus: О внесении изменений в решение Жангалинского районного маслихата от 26 февраля 2015 года № 25-6 «Об определении порядка и размера возмещения затрат на обучение на дому детей с ограниченными возможностями из числа детей с инвалидностью по индивидуальному учебному плану»
    kaz: Жаңақала аудандық мәслихатының 2015 жылғы 26 ақпандағы № 25-6 «Мүгедектігі бар балалар қатарындағы кемтар балаларды жеке оқыту жоспары бойынша үйде оқытуға жұмсаған шығындарын өндіріп алу тәртібі мен мөлшерін айқындау туралы» шешіміне өзгерістер енгізу туралы
