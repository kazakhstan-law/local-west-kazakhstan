requisite: Решение Жангалинского районного маслихата Западно-Казахстанской области от 13 марта 2014 года № 16-3. Зарегистрировано Департаментом юстиции Западно-Казахстанской области 2 апреля 2014 года № 3479. Утратило силу решением Жангалинского районного маслихата Западно-Казахстанской области от 24 декабря 2021 года № 14-11 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: Об утверждении Правил о порядке проведения раздельных сходов местного сообщества и определения количества представителей жителей села, улицы, многоквартирного жилого дома для участия в сходе местного сообщества на территории Жангалинского района
  kaz: Жаңақала ауданының аумағында бөлек жергiлiктi қоғамдастық жиындарын өткiзу және жергiлiктi қоғамдастық жиынына қатысу үшiн ауыл, көше, көппәтерлi тұрғын үй тұрғындары өкiлдерiнiң санын айқындау тәртiбi туралы қағидасын бекiту туралы
