act_code: '178052'
requisite: Решение Жангалинского районного маслихата Западно-Казахстанской области от 17 января 2023 года № 33-4
title:
  rus: О предоставлении  единовременного подъемного пособия и бюджетного кредита на приобретение или строительство жилья специалистам в области здравоохранения, образования, социального обеспечения, культуры, спорта и агропромышленного комплекса, государственным служащим аппаратов акимов сел, сельских округов, прибывшим для работы и проживания в сельские населенные пункты Жангалинского района в 2023 году
  kaz: Жаңақала ауданының ауылдық елді мекендеріне жұмыс істеу және тұру үшін келген денсаулық сақтау, білім беру, әлеуметтік қамсыздандыру, мәдениет, спорт және агроөнеркәсіптік кешен саласындағы мамандарға, ауылдар, ауылдық округтер әкімдері аппараттарының мемлекеттік қызметшілеріне 2023 жылы бір жолғы көтерме жәрдемақы беру және тұрғын үй сатып алуға немесе салуға бюджеттік кредит беру туралы
