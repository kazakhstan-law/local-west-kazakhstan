  title:
    rus: О внесении изменения в решение Жангалинского районного маслихата от 17 января 2023 года № 33-4 «О предоставлении единовременного подъемного пособия и бюджетного кредита на приобретение или стоительство жилья специалистам в области здравоохранения, образования, социального обеспечения, культуры, спорта и агропромышленного комплекса, государственным служащим аппаратов акимов сел, сельских округов, прибывшим для работы и проживания в сельские населенные пункты Жангалинского района в 2023 году»
    kaz: Жаңақала аудандық мәслихатының 2023 жылғы 17 қаңтардағы № 33-4 «Жаңақала ауданының ауылдық елді мекендеріне жұмыс істеу және тұру үшін келген денсаулық сақтау, білім беру, әлеуметтік қамсыздандыру, мәдениет, спорт және агроөнеркәсіптік кешен саласындағы мамандарға, ауылдар, ауылдық округтер әкімдері аппараттарының мемлекеттік қызметшілеріне 2023 жылы бір жолғы көтерме жәрдемақы беру және тұрғын үй сатып алуға немесе салуға бюджеттік кредит беру туралы» шешіміне өзгеріс енгізу туралы
  link: https://zan.gov.kz/client/#!/doc/179708/rus
