  title:
    rus: О внесении изменения в решение Жангалинского районного маслихата от 5 октября 2023 года № 10-5 «Об утверждении Правил оказания социальной помощи, установления ее размеров и определения перечня отдельных категорий нуждающихся граждан Жангалинского района»
    kaz: Жаңақала аудандық мәслихатының «Жаңақала ауданының әлеуметтік көмек көрсетудің, оның мөлшерлерін белгілеудің және мұқтаж азаматтардың жекелеген санаттарының тізбесін айқындаудың қағидаларын бекіту туралы» 2023 жылғы 5 қазандағы № 10-5 шешіміне өзгеріс енгізу туралы
