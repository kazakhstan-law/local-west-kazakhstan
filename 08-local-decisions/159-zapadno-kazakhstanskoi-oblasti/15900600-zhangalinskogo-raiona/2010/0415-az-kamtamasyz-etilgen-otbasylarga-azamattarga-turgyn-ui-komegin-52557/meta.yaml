requisite: Батыс Қазақстан облысы Жаңақала аудандық мәслихатының 2010 жылғы 15 сәуірдегі № 21-5 шешімі. Батыс Қазақстан облысы Жаңақала ауданы әділет басқармасында 2010 жылғы 14 мамырда № 7-5-117 тіркелді. Күші жойылды - Батыс Қазақстан облысы Жаңақала аудандық мәслихатының 2012 жылғы 19 сәуірдегі № 2-20 шешімімен
