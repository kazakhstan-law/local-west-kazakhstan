requisite: Батыс Қазақстан облысы Жаңақала аудандық мәслихатының 2010 жылғы 23 ақпандағы № 19-3 шешімі. Батыс Қазақстан облысы Жаңақала ауданы әділет басқармасында 2010 жылғы 16 наурызда № 7-5-109 тіркелді. Күші жойылды - Батыс Қазақстан облысы Жаңақала аудандық мәслихаттың 2010 жылғы 27 желтоқсандағы № 26-4 шешімімен
