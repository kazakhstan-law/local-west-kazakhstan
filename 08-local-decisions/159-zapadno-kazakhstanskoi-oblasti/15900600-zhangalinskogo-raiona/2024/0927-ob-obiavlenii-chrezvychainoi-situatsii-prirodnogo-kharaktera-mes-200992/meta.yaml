requisite: Решение акима Жангалинского района Западно-Казахстанской области от 27 сентября 2024 года № 9. Утратило силу решением акима Жангалинского района Западно-Казахстанской области от 5 января 2025 года № 1 (вводится в действие после дня его первого официального опубликования)
title:
