act_code: '199965'
requisite: Решение акима Жангалинского района Западно-Казахстанской области от 22 августа 2024 года № 7
title:
  rus: О признании утратившим силу решение акима Жангалинского района «Об объявлении чрезвычайной ситуации природного характера местного масштаба на территории Жанаказанского, Мастексайского, Жанажолского и Копжасарского сельских округов Жангалинского района» от 2 августа 2024 года № 6
  kaz: Жаңақала ауданы әкімінің «Жаңақала ауданының Жаңақазан, Мастексай, Жаңажол, Көпжасар ауылдық округтері аумағындағы жергілікті ауқымдағы табиғи сипаттағы төтенше жағдайды жариялау туралы» 2024 жылғы 2 тамыздағы № 6 шешімінің күшін жою деп тану туралы
