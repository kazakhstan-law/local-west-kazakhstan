act_code: '196797'
requisite: Решение Жангалинского районного маслихата Западно-Казахстанской области от 14 мая 2024 года № 17-12
title:
  rus: Об утверждении Правил о порядке проведения раздельных сходов местного сообщества и определения количества представителей жителей села, улицы, многоквартирного жилого дома для участия в сходе местного сообщества на территории Жангалинского района
  kaz: Жаңақала ауданының аумағында жергілікті қоғамдастықтың бөлек жиындарын өткізудің және жергілікті қоғамдастық жиынына қатысу үшін ауыл, көше, көппәтерлі тұрғын үй тұрғындары өкілдерінің санын айқындау тәртібі туралы қағидаларын бекіту туралы
