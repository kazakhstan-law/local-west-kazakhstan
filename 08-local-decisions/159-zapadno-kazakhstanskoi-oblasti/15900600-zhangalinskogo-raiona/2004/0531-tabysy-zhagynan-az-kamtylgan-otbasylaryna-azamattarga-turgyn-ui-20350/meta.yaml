requisite: Батыс Қазақстан облысы Жаңакала аудандық мәслихаттың 2004 жылғы 1 маусымдағы № 6-1 шешімі. Батыс Қазақстан облыстық Әділет департаментінде 2004 жылғы 28 маусымда № 2703 тіркелген. Күші жойылды - Батыс Қазақстан облысы Жаңакала аудандық мәслихаттың 2008 жылғы 23 желтоқсандағы № 9-7 шешімімен
