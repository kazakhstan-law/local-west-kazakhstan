act_code: '224892'
requisite: Решение Жангалинского районного маслихата Западно-Казахстанской области от 29 апреля 2026 года № 38-1
title:
  rus: О предоставлении подъемного пособия и бюджетного кредита на приобретение или строительство жилья специалистам в области здравоохранения, образования, социального обеспечения, культуры, спорта и агропромышленного комплекса, государственным служащим аппаратов акимов сел, поселков, сельских округов, прибывшим для работы и проживания в сельские населенные пункты Жангалинского района на 2026 год
  kaz: Жаңақала ауданының ауылдық елді мекендеріне жұмыс істеу және тұруға келген денсаулық сақтау, білім беру, әлеуметтік қамсыздандыру, мәдениет, спорт және агроөнеркәсіптік кешен саласындағы мамандарға, ауылдар, ауылдық округтер әкімдері аппараттарының мемлекеттік қызметшілеріне тұрғын үй сатып алуға немесе салуға 2026 жылға бюджеттік кредит беру және бір жолғы көтерме жәрдемақы беру туралы
