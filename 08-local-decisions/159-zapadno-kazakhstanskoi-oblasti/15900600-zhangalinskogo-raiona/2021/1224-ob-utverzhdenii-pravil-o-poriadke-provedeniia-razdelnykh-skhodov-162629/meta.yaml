act_code: '162629'
requisite: Решение Жангалинского районного маслихата Западно-Казахстанской области от 24 декабря 2021 года № 14-11. Утратило силу решением Жангалинского районного маслихата Западно-Казахстанской области от 21 декабря 2023 года № 13-5 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: Об утверждении Правил о порядке проведения раздельных сходов местного сообщества и определения количества представителей жителей села, улицы, многоквартирного жилого дома для участия в сходе местного сообщества на территории Жангалинского района
  kaz: Жаңақала ауданының аумағында бөлек жергілікті қоғамдастық жиындарын өткiзу және жергiлiктi қоғамдастық жиынына қатысу үшiн ауыл, көше, көппәтерлi тұрғын үй тұрғындары өкiлдерiнiң санын айқындау тәртiбi туралы қағидасын бекiту туралы
