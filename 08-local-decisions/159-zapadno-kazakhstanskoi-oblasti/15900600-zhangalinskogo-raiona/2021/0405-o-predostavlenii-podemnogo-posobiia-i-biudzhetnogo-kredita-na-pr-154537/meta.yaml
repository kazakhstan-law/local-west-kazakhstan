act_code: '154537'
requisite: Решение Жангалинского районного маслихата Западно-Казахстанской области от 5 апреля 2021 года № 4-2. Зарегистрировано Департаментом юстиции Западно-Казахстанской области 8 апреля 2021 года № 6950
title:
  rus: О предоставлении подъемного пособия и бюджетного кредита на приобретение или строительство жилья специалистам в области здравоохранения, образования, социального обеспечения, культуры, спорта и агропромышленного комплекса, государственным служащим аппаратов акимов сел, сельских округов, прибывшим для работы и проживания в сельские населенные пункты Жангалинского района в 2021 году
  kaz: 2021 жылы Жаңақала ауданының ауылдық елді мекендеріне жұмыс істеу және тұру үшін келген, денсаулық сақтау, білім беру, әлеуметтік қамсыздандыру, мәдениет, спорт және агроөнеркәсіптік кешен саласындағы мамандарға, ауылдар, ауылдық округтер әкімдері аппараттарының мемлекеттік қызметшілеріне тұрғын үй сатып алуға немесе салуға көтерме жәрдемақы және бюджеттік кредит беру туралы
