  title:
    rus: О внесении изменений в решение Жангалинского районного маслихата от 22 января 2021 года № 2-2 «Об утверждении Правил оказания социальной помощи, установления размеров и определения перечня отдельных категорий нуждающихся граждан Жангалинского района»
    kaz: Жаңақала аудандық мәслихатының 2021 жылғы 22 қаңтардағы № 2-2 «Жаңақала ауданының әлеуметтік көмек көрсету, оның мөлшерлерін белгілеу және мұқтаж азаматтардың жекеленген санаттарының тізбесін айқындау қағидаларын бекіту туралы» шешіміне өзгерістер енгізу туралы
