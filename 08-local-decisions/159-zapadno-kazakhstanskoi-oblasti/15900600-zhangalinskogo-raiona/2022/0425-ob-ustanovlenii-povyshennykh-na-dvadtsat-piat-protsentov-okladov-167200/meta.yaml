act_code: '167200'
requisite: Решение Жангалинского районного маслихата Западно-Казахстанской области от 25 апреля 2022 года № 21-11. Зарегистрировано в Министерстве юстиции Республики Казахстан 3 мая 2022 года № 27851
title:
  rus: Об установлении повышенных на двадцать пять процентов окладов и тарифных ставок специалистам в области социального обеспечения, культуры и спорта, являющимся гражданскими служащими и работающим в сельских населенных пунктах Жангалинского района
  kaz: Жаңақала ауданының азаматтық қызметшілер болып табылатын және ауылдық елді мекендерде жұмыс істейтін әлеуметтік қамсыздандыру, мәдениет және спорт саласындағы мамандарға жиырма бес пайызға жоғарылатылған айлықақылар мен тарифтік мөлшерлемелерін  белгілеу туралы
