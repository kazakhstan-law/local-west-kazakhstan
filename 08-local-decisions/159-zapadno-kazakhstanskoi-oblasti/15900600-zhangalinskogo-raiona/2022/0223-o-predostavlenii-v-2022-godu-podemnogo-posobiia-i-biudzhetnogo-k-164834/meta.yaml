act_code: '164834'
requisite: Решение Жангалинского районного маслихата Западно-Казахстанской области от 23 февраля 2022 года № 17-4
title:
  rus: О предоставлении в 2022 году подъемного пособия и бюджетного кредита на приобретение или стоительство жилья специалистам в области здравоохранения, образования, социального обеспечения, культуры, спорта и агропромышленного комплекса, государственным служащим аппаратов акимов сел, поселков, сельских округов, прибывшим для работы и проживания в сельские населенные пункты  Жангалинского района
  kaz: 2022 жылы Жаңақала ауданының ауылдық елді мекендеріне жұмыс істеу және тұру үшін келген денсаулық сақтау, білім беру, әлеуметтік қамсыздандыру, мәдениет, спорт және агроөнеркәсіптік кешен саласындағы мамандарға, ауылдар, ауылдық округтер әкімдері аппараттарының мемлекеттік қызметшілеріне тұрғын үй сатып алуға немесе салуға бюджеттік кредит беру және бір жолғы көтерме жәрдемақы беру туралы
