act_code: '169786'
requisite: Решение Жангалинского районного маслихата Западно-Казахстанской области от 15 марта 2022 года № 18-1
title:
  rus: Об отмене решения Жангалинского районного маслихата от 23 февраля 2022 года №17-3 «Об установлении повышенных на двадцать пять процентов окладов и тарифных ставок специалистам в области социального обеспечения, культуры и спорта, являющимся гражданскими служащими и работающим в сельских населенных пунктах Жангалинского района»
  kaz: Жаңақала аудандық мәслихатының 2022 жылғы 23 ақпандағы №17-3 «Жаңақала ауданының азаматтық қызметшілер болып табылатын және ауылдық елді мекендерде жұмыс істейтін әлеуметтік қамсыздандыру, мәдениет және спорт саласындағы мамандарға жиырма бес пайызға жоғарылатылған айлықақылар мен тарифтік мөлшерлемелерін белгілеу туралы» шешімін жою туралы
