act_code: '43663'
requisite: Батыс Қазақстан облысы Жаңақала аудандық мәслихатының 2008 жылғы 23 желтоқсандағы № 9-5 шешімі. Батыс Қазақстан облысы Жаңақала ауданы әділет басқармасында 2009 жылғы 20 қаңтарда № 7-5-78 тіркелді. Күші жойылды - Батыс Қазақстан облысы Жаңақала аудандық мәслихатының 2010 жылғы 23 ақпандағы № 19-4 шешімімен
title:
