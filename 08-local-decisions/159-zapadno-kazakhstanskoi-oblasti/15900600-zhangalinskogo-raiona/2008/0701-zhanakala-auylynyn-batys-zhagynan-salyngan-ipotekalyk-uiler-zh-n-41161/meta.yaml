act_code: '41161'
requisite: Батыс Қазақстан облысы Жаңақала ауданы Жаңақала ауылдық округі әкімінің 2008 жылғы 1 шілдедегі № 47 шешімі. Батыс Қазақстан облысы Жаңақала ауданы әділет басқармасында 2008 жылғы 12 тамызда № 7-5-69 тіркелді
title:
