act_code: '41480'
requisite: Батыс Қазақстан облысы Жаңақала ауданы Бірлік ауылдық округі әкімінің 2008 жылғы 4 тамыздағы № 9 шешімі. Батыс Қазақстан облысы Жаңақала ауданы әділет басқармасында 2008 жылғы 7 қыркүйекте № 7-5-71 тіркелді
