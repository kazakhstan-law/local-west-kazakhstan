act_code: '43665'
requisite: Батыс Қазақстан облысы Жаңақала аудандық мәслихатының 2008 жылғы 23 желтоқсандағы № 9-6 шешімі. Батыс Қазақстан облысы Жаңақала ауданы Әділет басқармасында 2009 жылғы 20 қаңтарда № 7-5-79 тіркелді. Күші жойылды - Батыс Қазақстан облысы Жаңақала аудандық мәслихатының 2010 жылғы 23 ақпандағы № 19-4 шешімімен
title:
