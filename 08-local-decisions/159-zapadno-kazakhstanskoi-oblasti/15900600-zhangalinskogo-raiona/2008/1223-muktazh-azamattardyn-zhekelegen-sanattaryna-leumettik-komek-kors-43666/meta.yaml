requisite: Батыс Қазақстан облысы Жаңақала аудандық мәслихатының 2008 жылғы 23 желтоқсандағы № 9-8 шешімі. Батыс Қазақстан облысы Жаңақала ауданы әділет басқармасында 2009 жылғы 20 қаңтарда № 7-5-80 тіркелді. Күші жойылды - Батыс Қазақстан облысы Жаңақала аудандық мәслихатының 2010 жылғы 15 сәуірдегі № 21-10 шешімімен
