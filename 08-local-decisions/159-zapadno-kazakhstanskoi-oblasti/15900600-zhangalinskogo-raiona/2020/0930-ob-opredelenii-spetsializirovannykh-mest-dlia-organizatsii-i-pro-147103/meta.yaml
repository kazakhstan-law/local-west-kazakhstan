act_code: '147103'
requisite: Решение Жангалинского районного маслихата Западно-Казахстанской области от 30 сентября 2020 года № 52-1. Зарегистрировано Департаментом юстиции Западно-Казахстанской области 6 октября 2020 года № 6410
title:
  rus: Об определении специализированных мест для организации и проведения мирных собраний, порядка их использования, норм их предельной заполняемости, требований к их материально-техническому и организационному обеспечению, границ прилегающих территорий, в которых запрещено проведение пикетирования по Жангалинскому району
  kaz: Жаңақала ауданында бейбіт жиналыстарды ұйымдастыру және өткізу үшін арнайы орындарды, оларды пайдалану тәртібін, шекті толтырылу нормаларын, олардың материалдық-техникалық және ұйымдастырушылық қамтамасыз етуге қойылатын талаптарын, пикеттеуді өткізуге тыйым салынған іргелес аумақтардың шекараларын айқындау туралы
