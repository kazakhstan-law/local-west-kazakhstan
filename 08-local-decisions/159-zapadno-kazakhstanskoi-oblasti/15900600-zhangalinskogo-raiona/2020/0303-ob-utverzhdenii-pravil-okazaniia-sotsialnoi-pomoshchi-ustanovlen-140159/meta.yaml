    kaz: Жаңақала аудандық мәслихатының 2020 жылғы 3 наурыздағы № 44-2 «Жаңақала ауданының әлеуметтік көмек көрсету, оның мөлшерлерін белгілеу және мұқтаж азаматтардың жекелеген санаттарының тізбесін айқындау қағидаларын бекіту туралы» шешіміне өзгеріс енгізу туралы
