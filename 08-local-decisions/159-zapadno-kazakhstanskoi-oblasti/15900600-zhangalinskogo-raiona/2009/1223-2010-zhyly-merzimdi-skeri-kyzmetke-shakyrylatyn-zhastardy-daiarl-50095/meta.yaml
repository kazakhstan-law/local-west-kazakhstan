act_code: '50095'
requisite: Батыс Қазақстан облысы Жаңақала ауданы әкімінің 2009 жылғы 23 желтоқсандағы № 83 шешімі. Батыс Қазақстан облысы Жаңақала ауданы әділет басқармасында 2010 жылғы 21 қаңтарда № 7-5-106 тіркелді. Күші жойылды - Батыс Қазақстан облысы Жаңақала ауданы әкімдігінің 2010 жылғы 1 наурыздағы № 2 қаулысымен
