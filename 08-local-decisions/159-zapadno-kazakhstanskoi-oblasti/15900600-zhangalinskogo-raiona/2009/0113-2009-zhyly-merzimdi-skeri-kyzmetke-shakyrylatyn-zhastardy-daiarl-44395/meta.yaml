requisite: Батыс Қазақстан облысы Жаңақала ауданы әкімінің 2009 жылғы 13 қаңтардағы № 1 шешімі. Батыс Қазақстан облысы Жаңақала ауданы әділет басқармасында 2009 жылғы 12 ақпанда № 7-5-82 тіркелді. Күші жойылды - Батыс Қазақстан облысы Жаңақала ауданы әкімінің 2009 жылғы 15 сәуірдегі № 7 шешімімен
