act_code: '49450'
requisite: Батыс Қазақстан облысы Жаңақала ауданы Бірлік ауылдық округі әкімінің 2009 жылғы 18 қарашадағы № 7 шешімі. Батыс Қазақстан облысы Жаңақала ауданы әділет басқармасында 2009 жылғы 14 желтоқсанда № 7-5-102 тіркелді
